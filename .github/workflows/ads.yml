name: name: "ads-rules"
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v5
      # ==========================================================
      # 2. 日期
      # ==========================================================
      - name: Set date
        run: |
          echo "DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"
      # ==========================================================
      # 3. 获取最新版本
      # ==========================================================
      - name: Get latest tool versions
        id: versions
        run: |
          set -euo pipefail
          TAG_SING=$(curl -fsSL \
            https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | grep '"tag_name":' \
            | sed -E 's/.*"([^"]+)".*/\1/')
          TAG_MIHOMO=$(curl -fsSL \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | grep '"tag_name":' \
            | sed -E 's/.*"([^"]+)".*/\1/')
          echo "singbox=${TAG_SING}" >> "$GITHUB_OUTPUT"
          echo "mihomo=${TAG_MIHOMO}" >> "$GITHUB_OUTPUT"
          echo "sing-box = ${TAG_SING}"
          echo "mihomo   = ${TAG_MIHOMO}"
      # ==========================================================
      # 4. Cache
      # ==========================================================
      - name: Cache binaries
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/custom-tools
          key: ${{ runner.os }}-tools-${{ steps.versions.outputs.singbox }}-${{ steps.versions.outputs.mihomo }}
      # ==========================================================
      # 5. 安装 sing-box / mihomo
      # ==========================================================
      - name: Install sing-box & mihomo
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p /usr/local/bin/custom-tools
          # ------------------------------------------------------
          # sing-box
          # ------------------------------------------------------
          TAG_SING="${{ steps.versions.outputs.singbox }}"
          VERSION_SING="${TAG_SING#v}"
          curl -fsSL \
            -o sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/${TAG_SING}/sing-box-${VERSION_SING}-linux-amd64.tar.gz"
          tar -xzf sing-box.tar.gz
          mv \
            "sing-box-${VERSION_SING}-linux-amd64/sing-box" \
            /usr/local/bin/custom-tools/sing-box
          rm -rf \
            sing-box.tar.gz \
            "sing-box-${VERSION_SING}-linux-amd64"
          # ------------------------------------------------------
          # mihomo
          # ------------------------------------------------------
          TAG_MIHOMO="${{ steps.versions.outputs.mihomo }}"
          curl -fsSL \
            -o mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/${TAG_MIHOMO}/mihomo-linux-amd64-${TAG_MIHOMO}.gz"
          gunzip mihomo.gz
          chmod +x mihomo
          mv \
            mihomo \
            /usr/local/bin/custom-tools/mihomo
      # ==========================================================
      # 6. PATH + 版本
      # ==========================================================
      - name: Add custom-tools to PATH
        run: |
          echo "/usr/local/bin/custom-tools" >> "$GITHUB_PATH"
          export PATH="/usr/local/bin/custom-tools:$PATH"
          echo "========== sing-box =========="
          sing-box version
          echo
          echo "========== mihomo =========="
          mihomo -v
      # ==========================================================
      # 7. 下载规则
      # ==========================================================
      - name: Download rules
        run: |
          set -euo pipefail
          curl -fsSL \
            https://raw.githubusercontent.com/olocn/rule/refs/heads/master/surge/reject-drop.txt \
            -o ruleA.txt
          curl -fsSL \
            https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list \
            -o ruleB.list
      # ==========================================================
      # 8. 通用规则清洗
      #
      # 只保留：
      # DOMAIN
      # DOMAIN-SUFFIX
      # DOMAIN-KEYWORD
      # ==========================================================
      - name: Normalize source rules
        run: |
          set -euo pipefail
          rm -f \
            rules.source \
            rules.normalized \
            rules.other
          cat ruleA.txt ruleB.list \
            | sed '/^[[:space:]]*$/d' \
            | grep -vE '^[[:space:]]*#' \
            | sed -E 's/,(REJECT|reject|REJECT-DROP|reject-drop)$//I' \
            | sed 's/,extended-matching//Ig' \
            | sed 's/,pre-matching//Ig' \
            | sed 's/,no-resolve//Ig' \
            | sed 's/^[[:space:]]*//' \
            | sed 's/[[:space:]]*$//' \
            > rules.source
          awk -F',' '
          BEGIN {
            OFS=","
          }
          {
            type=toupper($1)
            value=tolower($2)
            if (value == "")
              next
            if (type == "DOMAIN") {
              print "DOMAIN", value
            }
            else if (type == "DOMAIN-SUFFIX") {
              print "DOMAIN-SUFFIX", value
            }
            else if (type == "DOMAIN-KEYWORD") {
              print "DOMAIN-KEYWORD", value
            }
            else {
              print $0 >> "rules.other"
            }
          }
          ' rules.source > rules.normalized
          # ======================================================
          # 完全重复规则去除
          # ======================================================
          awk '!seen[$0]++' \
            rules.normalized \
            > rules.normalized.tmp
          mv \
            rules.normalized.tmp \
            rules.normalized
          if [ ! -f rules.other ]; then
            touch rules.other
          fi
          echo "======================================"
          echo "Normalized rules"
          echo "======================================"
          echo "DOMAIN:"
          grep -c '^DOMAIN,' rules.normalized || true
          echo "DOMAIN-SUFFIX:"
          grep -c '^DOMAIN-SUFFIX,' rules.normalized || true
          echo "DOMAIN-KEYWORD:"
          grep -c '^DOMAIN-KEYWORD,' rules.normalized || true
          echo "Other:"
          wc -l < rules.other
      # ==========================================================
      # 9. 生成 Mihomo YAML
      # ==========================================================
      - name: Generate Mihomo YAML
        run: |
          set -euo pipefail
          {
            echo "payload:"
            awk -F',' '
            {
              if ($1 == "DOMAIN")
                print "  - DOMAIN," $2
              else if ($1 == "DOMAIN-SUFFIX")
                print "  - DOMAIN-SUFFIX," $2
              else if ($1 == "DOMAIN-KEYWORD")
                print "  - DOMAIN-KEYWORD," $2
            }
            ' rules.normalized \
            | sort -u
          } > ads-clash.yaml
          echo "======================================"
          echo "Mihomo YAML"
          echo "======================================"
          ls -lh ads-clash.yaml
      # ==========================================================
      # 10. Surge / Shadowrocket DOMAIN-SET
      #
      # DOMAIN-SUFFIX -> .example.com (扩展匹配子域名)
      # DOMAIN        -> example.com  (单域名精确匹配)
      # DOMAIN-KEYWORD 不支持，自动忽略
      # ==========================================================
      - name: Generate DOMAIN-SET rules
        run: |
          set -euo pipefail
          {
            echo "# Auto merged DOMAIN-SET rules (${DATE})"
            awk -F',' '
            {
              if ($1 == "DOMAIN-SUFFIX") {
                gsub(/^[.]+/, "", $2)
                if ($2 != "") print "." $2
              }
              else if ($1 == "DOMAIN") {
                gsub(/^[.]+/, "", $2)
                if ($2 != "") print $2
              }
            }
            ' rules.normalized \
            | sort -u
          } > ads-latest.txt
          echo "======================================"
          echo "DOMAIN-SET rules generated"
          echo "======================================"
          ls -lh ads-latest.txt
      # ==========================================================
      # 11. MosDNS
      # ==========================================================
      - name: Generate MosDNS rules
        run: |
          set -euo pipefail
          {
            echo "# Auto merged MosDNS rules (${DATE})"
            awk -F',' '
            {
              if ($1 == "DOMAIN-SUFFIX")
                print "domain:" $2
              else if ($1 == "DOMAIN")
                print "full:" $2
              else if ($1 == "DOMAIN-KEYWORD")
                print "keyword:" $2
            }
            ' rules.normalized \
            | sort -u
          } > ads-mosdns.txt
      # ==========================================================
      # 12. Quantumult X
      # ==========================================================
      - name: Generate Quantumult X rules
        run: |
          set -euo pipefail
          {
            echo "# Auto merged Quantumult X rules (${DATE})"
            awk -F',' '
            {
              if ($1 == "DOMAIN-SUFFIX")
                print "host-suffix, " $2 ", reject"
              else if ($1 == "DOMAIN")
                print "host, " $2 ", reject"
              else if ($1 == "DOMAIN-KEYWORD")
                print "host-keyword, " $2 ", reject"
            }
            ' rules.normalized \
            | sort -u
          } > ads-qx.snippet
      # ==========================================================
      # 13. sing-box JSON
      # ==========================================================
      - name: Generate sing-box JSON
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          suffix = set()
          domain = set()
          keyword = set()
          with open("rules.normalized", "r", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  parts = line.split(",", 1)
                  if len(parts) != 2:
                      continue
                  rule_type, value = parts
                  if rule_type == "DOMAIN-SUFFIX":
                      suffix.add(value)
                  elif rule_type == "DOMAIN":
                      domain.add(value)
                  elif rule_type == "DOMAIN-KEYWORD":
                      keyword.add(value)
          rule = {}
          if suffix:
              rule["domain_suffix"] = sorted(suffix)
          if domain:
              rule["domain"] = sorted(domain)
          if keyword:
              rule["domain_keyword"] = sorted(keyword)
          output = {
              "version": 1,
              "rules": [rule]
          }
          with open("ads-singbox.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
      # ==========================================================
      # 14. 输出检查
      # ==========================================================
      - name: Verify all outputs
        run: |
          set -euo pipefail
          echo "======================================"
          echo "Final outputs"
          echo "======================================"
          ls -lh \
            ads-latest.txt \
            ads-mosdns.txt \
            ads-qx.snippet \
            ads-singbox.json \
            ads-clash.yaml
          echo
          echo "DOMAIN-SET line count (ads-latest.txt):"
          wc -l < ads-latest.txt
      # ==========================================================
      # 15. 清理
      # ==========================================================
      - name: Cleanup
        run: |
          rm -f \
            ruleA.txt \
            ruleB.list \
            rules.source \
            rules.normalized \
            rules.other
      # ==========================================================
      # 16. Commit
      # ==========================================================
      - name: Commit and Push result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ads-latest.txt \
            ads-mosdns.txt \
            ads-qx.snippet \
            ads-singbox.json \
            ads-clash.yaml
          if git diff --staged --quiet; then
            echo "No changes detected."
            echo "Skipping commit and push."
          else
            git commit \
              -m "Update ad rules (${DATE}) [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
