name: ads-rules
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ads-rules
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONUNBUFFERED: "1"
    steps:
      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      # ==========================================================
      # 2. Prepare environment
      # ==========================================================
      - name: Prepare environment
        shell: bash
        run: |
          set -euo pipefail
          echo "DATE=$(date -u +'%Y-%m-%d')" >> "$GITHUB_ENV"
          python3 --version
      # ==========================================================
      # 3. Download source rules
      # ==========================================================
      - name: Download source rules
        shell: bash
        run: |
          set -euo pipefail
          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 15 \
            --max-time 180 \
            "https://raw.githubusercontent.com/olocn/rule/refs/heads/master/surge/reject-drop.txt" \
            -o source-olocn.txt
          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 15 \
            --max-time 180 \
            "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list" \
            -o source-awa.txt
          if [ ! -s source-olocn.txt ]; then
            echo "ERROR: source-olocn.txt is empty"
            exit 1
          fi
          if [ ! -s source-awa.txt ]; then
            echo "ERROR: source-awa.txt is empty"
            exit 1
          fi
          echo "Source rules:"
          wc -l source-olocn.txt source-awa.txt
      # ==========================================================
      # 4. Python process
      #
      # 安全规则：
      #
      # 1. 精确重复去重
      # 2. 仅 DOMAIN-SUFFIX 做父子域名去重
      # 3. DOMAIN 不做父子去重
      # 4. DOMAIN-KEYWORD 不做父子去重
      # 5. DOMAIN-SET 不做父子去重
      # 6. CIDR 完全不参与去重
      # 7. 不做 CIDR 包含关系判断
      # 8. 不改变原始规则语义
      # ==========================================================
      - name: Process rules with Python
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from __future__ import annotations
          import re
          from pathlib import Path
          SOURCES = [
              Path("source-olocn.txt"),
              Path("source-awa.txt"),
          ]
          NORMALIZED = Path("rules.normalized")
          # ------------------------------------------------------
          # 支持的规则类型
          # ------------------------------------------------------
          ALLOWED_TYPES = {
              "DOMAIN",
              "DOMAIN-SUFFIX",
              "DOMAIN-KEYWORD",
              "DOMAIN-SET",
          }
          # ------------------------------------------------------
          # 明确记录 CIDR 类型。
          #
          # 本程序绝不对 CIDR 做包含关系判断。
          # 即使出现：
          #
          # 1.1.1.0/24
          # 1.1.1.1/32
          #
          # 也不会因为包含关系删除任何规则。
          # ------------------------------------------------------
          CIDR_TYPES = {
              "IP-CIDR",
              "IP-CIDR6",
              "IP-CIDR-NO-RESOLVE",
              "IP-CIDR6-NO-RESOLVE",
          }
          # ------------------------------------------------------
          # Unicode 隐藏字符清理
          # ------------------------------------------------------
          HIDDEN_CHARS = {
              "\ufeff",  # BOM
              "\u200b",  # Zero Width Space
              "\u200c",  # Zero Width Non-Joiner
              "\u200d",  # Zero Width Joiner
              "\u2060",  # Word Joiner
              "\u00ad",  # Soft Hyphen
              "\u200e",  # LRM
              "\u200f",  # RLM
              "\u202a",  # LRE
              "\u202b",  # RLE
              "\u202c",  # PDF
              "\u202d",  # LRO
              "\u202e",  # RLO
              "\u2066",  # LRI
              "\u2067",  # RLI
              "\u2068",  # FSI
              "\u2069",  # PDI
          }
          def clean_unicode(text: str) -> str:
              for char in HIDDEN_CHARS:
                  text = text.replace(char, "")
              return text
          # ------------------------------------------------------
          # 删除行尾注释
          #
          # 与原 Workflow：
          #
          # sed 's/[[:space:]]*#.*$//'
          #
          # 保持相同目的。
          # ------------------------------------------------------
          def remove_comment(line: str) -> str:
              return re.sub(r"\s*#.*$", "", line)
          # ------------------------------------------------------
          # 处理规则
          # ------------------------------------------------------
          def parse_rule(line: str):
              line = clean_unicode(line)
              line = line.replace("\r", "")
              line = remove_comment(line).strip()
              if not line:
                  return None
              parts = [x.strip() for x in line.split(",")]
              if len(parts) < 2:
                  return None
              rule_type = parts[0].upper()
              value = parts[1].strip()
              if rule_type not in ALLOWED_TYPES:
                  return None
              if not value:
                  return None
              # --------------------------------------------------
              # 删除原 Workflow 中的尾部参数
              #
              # REJECT...
              # extended-matching
              # pre-matching
              # no-resolve
              # --------------------------------------------------
              tail = parts[2:]
              cleaned_tail = []
              for item in tail:
                  item = item.strip()
                  if not item:
                      continue
                  lower = item.lower()
                  if lower in {
                      "extended-matching",
                      "pre-matching",
                      "no-resolve",
                  }:
                      continue
                  if lower in {
                      "reject",
                      "reject-dict",
                      "reject-tinygif",
                      "reject-no-drop",
                      "reject-img",
                      "reject-200",
                      "reject-drop",
                      "reject-quic",
                  }:
                      continue
                  cleaned_tail.append(item)
              # --------------------------------------------------
              # 你的原 Workflow 最终只输出：
              #
              # TYPE,value
              #
              # 因此这里不保留 tail。
              # --------------------------------------------------
              value = value.lower()
              # 去掉输入域名前后的点
              value = value.strip(".")
              if not value:
                  return None
              return rule_type, value
          # ------------------------------------------------------
          # 域名标准化
          #
          # 只用于判断父子关系。
          # ------------------------------------------------------
          def normalize_domain(value: str):
              value = value.lower().strip().rstrip(".")
              if not value:
                  return None
              # 不允许明显的非域名内容进入父子判断
              if "/" in value:
                  return None
              if " " in value:
                  return None
              # IPv4
              if re.fullmatch(
                  r"(?:\d{1,3}\.){3}\d{1,3}",
                  value,
              ):
                  return None
              # IPv6
              if ":" in value:
                  return None
              return value
          # ------------------------------------------------------
          # 严格 DNS label 父子判断
          #
          # www.example.com
          # example.com
          #
          # True
          #
          # notexample.com
          # example.com
          #
          # False
          # ------------------------------------------------------
          def is_subdomain(child: str, parent: str) -> bool:
              if child == parent:
                  return False
              return child.endswith("." + parent)
          # ------------------------------------------------------
          # 第一阶段：读取并规范化
          # ------------------------------------------------------
          parsed_rules = []
          source_count = 0
          for source in SOURCES:
              print()
              print("=" * 60)
              print(f"Reading: {source}")
              print("=" * 60)
              lines = source.read_text(
                  encoding="utf-8",
                  errors="replace",
              ).splitlines()
              source_count += len(lines)
              accepted = 0
              for line in lines:
                  result = parse_rule(line)
                  if result is None:
                      continue
                  rule_type, value = result
                  parsed_rules.append(
                      (rule_type, value)
                  )
                  accepted += 1
              print(f"Input lines : {len(lines)}")
              print(f"Accepted    : {accepted}")
          # ------------------------------------------------------
          # 第二阶段：精确重复去重
          #
          # 保持第一次出现的规则。
          # ------------------------------------------------------
          exact_seen = set()
          exact_removed = 0
          unique_rules = []
          for rule in parsed_rules:
              if rule in exact_seen:
                  exact_removed += 1
                  continue
              exact_seen.add(rule)
              unique_rules.append(rule)
          # ------------------------------------------------------
          # 第三阶段：
          #
          # 仅 DOMAIN-SUFFIX 做父子域名去重。
          #
          # 非常重要：
          #
          # DOMAIN：
          #   example.com
          #   www.example.com
          #
          # 不删除。
          #
          # 因为 DOMAIN 是精确匹配语义。
          #
          # DOMAIN-SUFFIX：
          #   example.com
          #   www.example.com
          #
          # 可以删除 www.example.com。
          # ------------------------------------------------------
          suffix_domains = {
              value
              for rule_type, value in unique_rules
              if rule_type == "DOMAIN-SUFFIX"
          }
          suffix_removed = 0
          final_rules = []
          for rule_type, value in unique_rules:
              if rule_type != "DOMAIN-SUFFIX":
                  final_rules.append(
                      (rule_type, value)
                  )
                  continue
              domain = normalize_domain(value)
              if domain is None:
                  final_rules.append(
                      (rule_type, value)
                  )
                  continue
              labels = domain.split(".")
              covered = False
              # 从最直接的父域开始检查
              #
              # a.b.example.com
              #   -> b.example.com
              #   -> example.com
              #
              for index in range(1, len(labels) - 1):
                  parent = ".".join(
                      labels[index:]
                  )
                  if parent in suffix_domains:
                      covered = True
                      break
              if covered:
                  suffix_removed += 1
                  continue
              final_rules.append(
                  (rule_type, value)
              )
          # ------------------------------------------------------
          # 最终排序
          #
          # 按：
          #   TYPE
          #   VALUE
          #
          # 排序。
          #
          # 不进行任何语义上的合并。
          # ------------------------------------------------------
          final_rules = sorted(
              final_rules,
              key=lambda item: (
                  item[0],
                  item[1],
              ),
          )
          # ------------------------------------------------------
          # 输出 normalized
          # ------------------------------------------------------
          with NORMALIZED.open(
              "w",
              encoding="utf-8",
              newline="\n",
          ) as f:
              for rule_type, value in final_rules:
                  f.write(
                      f"{rule_type},{value}\n"
                  )
          # ------------------------------------------------------
          # 统计
          # ------------------------------------------------------
          print()
          print("=" * 60)
          print("RULE PROCESSING")
          print("=" * 60)
          print(
              f"Source lines             : {source_count}"
          )
          print(
              f"Accepted rules           : {len(parsed_rules)}"
          )
          print(
              f"Exact duplicates removed : {exact_removed}"
          )
          print(
              f"Parent domains removed   : {suffix_removed}"
          )
          print(
              "CIDR containment removed : 0"
          )
          print(
              f"Final rules              : {len(final_rules)}"
          )
          # ------------------------------------------------------
          # 安全检查
          # ------------------------------------------------------
          # 明确保证没有 CIDR 规则参与
          # 但即使以后加入 CIDR，也绝不进行包含去重。
          #
          # 当前输入只允许四种域名规则。
          # ------------------------------------------------------
          if not final_rules:
              raise SystemExit(
                  "ERROR: normalized rules are empty"
              )
          # 检查隐藏字符
          content = NORMALIZED.read_text(
              encoding="utf-8"
          )
          for char in HIDDEN_CHARS:
              if char in content:
                  raise SystemExit(
                      "ERROR: hidden Unicode character "
                      "remains in normalized rules"
                  )
          # 检查空值
          for line in content.splitlines():
              parts = line.split(",", 1)
              if (
                  len(parts) != 2
                  or not parts[1].strip()
              ):
                  raise SystemExit(
                      f"ERROR: invalid normalized rule: {line}"
                  )
          print()
          print("Normalized rules:")
          print(len(final_rules))
          print()
          print("Rule types:")
          type_count = {}
          for rule_type, _ in final_rules:
              type_count[rule_type] = (
                  type_count.get(rule_type, 0) + 1
              )
          for rule_type in sorted(type_count):
              print(
                  f"{type_count[rule_type]:8d} {rule_type}"
              )
          print()
          print("Python rule processing completed.")
          PY
      # ==========================================================
      # 5. Generate Surge DOMAIN-SET
      #
      # DOMAIN:
      #   DOMAIN,example.com
      #   ->
      #   example.com
      #
      # DOMAIN-SUFFIX:
      #   DOMAIN-SUFFIX,example.com
      #   ->
      #   .example.com
      #
      # DOMAIN-SET:
      #   DOMAIN-SET,example.com
      #   ->
      #   example.com
      #
      # DOMAIN-KEYWORD:
      #   不进入 ads-latest.txt
      # ==========================================================
      - name: Generate Surge DOMAIN-SET
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          rules = []
          with open(
              "rules.normalized",
              encoding="utf-8"
          ) as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  rule_type, value = line.split(",", 1)
                  if rule_type == "DOMAIN":
                      rules.append(value)
                  elif rule_type == "DOMAIN-SUFFIX":
                      rules.append("." + value)
                  elif rule_type == "DOMAIN-SET":
                      rules.append(value)
          rules = sorted(set(rules))
          if not rules:
              raise SystemExit(
                  "ERROR: ads-latest.txt contains no rules"
              )
          with open(
              "ads-latest.txt",
              "w",
              encoding="utf-8",
              newline="\n",
          ) as f:
              f.write(
                  "# Auto merged Surge DOMAIN-SET rules "
                  f"({__import__('os').environ['DATE']})\n"
              )
              for rule in rules:
                  f.write(rule + "\n")
          print(
              "Surge DOMAIN-SET rules:",
              len(rules)
          )
          print()
          print("First 20 rules:")
          for rule in rules[:20]:
              print(rule)
          PY
      # ==========================================================
      # 6. Generate MosDNS
      #
      # DOMAIN-SUFFIX -> domain:
      # DOMAIN        -> full:
      # DOMAIN-KEYWORD -> keyword:
      # DOMAIN-SET    -> full:
      # ==========================================================
      - name: Generate MosDNS
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          rules = []
          with open(
              "rules.normalized",
              encoding="utf-8"
          ) as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  rule_type, value = line.split(",", 1)
                  if rule_type == "DOMAIN-SUFFIX":
                      rules.append(
                          "domain:" + value
                      )
                  elif rule_type == "DOMAIN":
                      rules.append(
                          "full:" + value
                      )
                  elif rule_type == "DOMAIN-KEYWORD":
                      rules.append(
                          "keyword:" + value
                      )
                  elif rule_type == "DOMAIN-SET":
                      rules.append(
                          "full:" + value
                      )
          rules = sorted(set(rules))
          if not rules:
              raise SystemExit(
                  "ERROR: ads-mosdns.txt is empty"
              )
          with open(
              "ads-mosdns.txt",
              "w",
              encoding="utf-8",
              newline="\n",
          ) as f:
              for rule in rules:
                  f.write(rule + "\n")
          print(
              "MosDNS rules:",
              len(rules)
          )
          PY
      # ==========================================================
      # 7. Generate Quantumult X
      #
      # DOMAIN-SUFFIX -> host-suffix
      # DOMAIN        -> host
      # DOMAIN-KEYWORD -> host-keyword
      # DOMAIN-SET    -> host
      # ==========================================================
      - name: Generate Quantumult X
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          rules = []
          with open(
              "rules.normalized",
              encoding="utf-8"
          ) as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  rule_type, value = line.split(",", 1)
                  if rule_type == "DOMAIN-SUFFIX":
                      rules.append(
                          f"host-suffix,{value},reject"
                      )
                  elif rule_type == "DOMAIN":
                      rules.append(
                          f"host,{value},reject"
                      )
                  elif rule_type == "DOMAIN-KEYWORD":
                      rules.append(
                          f"host-keyword,{value},reject"
                      )
                  elif rule_type == "DOMAIN-SET":
                      rules.append(
                          f"host,{value},reject"
                      )
          rules = sorted(set(rules))
          if not rules:
              raise SystemExit(
                  "ERROR: ads-qx.snippet is empty"
              )
          with open(
              "ads-qx.snippet",
              "w",
              encoding="utf-8",
              newline="\n",
          ) as f:
              for rule in rules:
                  f.write(rule + "\n")
          print(
              "Quantumult X rules:",
              len(rules)
          )
          PY
      # ==========================================================
      # 8. Validate normalized rules
      # ==========================================================
      - name: Validate normalized rules
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s rules.normalized ]; then
            echo "ERROR: rules.normalized is empty"
            exit 1
          fi
          echo "Checking hidden / non-ASCII characters..."
          if LC_ALL=C grep -n '[^ -~]' rules.normalized; then
            echo
            echo "ERROR: rules.normalized contains non-ASCII/invisible characters"
            exit 1
          fi
          echo "Checking empty values..."
          if grep -qE \
            '^(DOMAIN|DOMAIN-SUFFIX|DOMAIN-KEYWORD|DOMAIN-SET),$' \
            rules.normalized; then
            echo "ERROR: empty domain value detected"
            exit 1
          fi
          echo "Checking rule types..."
          INVALID_TYPES=$(
            cut -d',' -f1 rules.normalized \
              | grep -vE \
                '^(DOMAIN|DOMAIN-SUFFIX|DOMAIN-KEYWORD|DOMAIN-SET)$' \
              || true
          )
          if [ -n "$INVALID_TYPES" ]; then
            echo
            echo "ERROR: invalid rule types:"
            echo "$INVALID_TYPES"
            exit 1
          fi
          echo
          echo "Normalized rules are clean."
      # ==========================================================
      # 9. Validate Surge DOMAIN-SET
      # ==========================================================
      - name: Validate Surge DOMAIN-SET
        shell: bash
        run: |
          set -euo pipefail
          DOMAIN_SET_COUNT=$(
            grep -vE '^#|^$' ads-latest.txt | wc -l
          )
          if [ "$DOMAIN_SET_COUNT" -eq 0 ]; then
            echo "ERROR: ads-latest.txt contains no rules"
            exit 1
          fi
          echo "Checking invisible / non-ASCII characters..."
          if LC_ALL=C grep -n '[^ -~]' ads-latest.txt; then
            echo
            echo "ERROR: ads-latest.txt contains non-ASCII/invisible characters"
            exit 1
          fi
          echo "Checking rule-type prefixes..."
          if grep -qE \
            '^(DOMAIN|DOMAIN-SUFFIX|DOMAIN-KEYWORD|DOMAIN-SET),' \
            ads-latest.txt; then
            echo "ERROR: ads-latest.txt contains rule-type prefixes"
            exit 1
          fi
          echo "Checking domain format..."
          INVALID=$(
            grep -vE \
              '^#|^$|^\.[A-Za-z0-9_-]+([.][A-Za-z0-9_-]+)*$|^[A-Za-z0-9_-]+([.][A-Za-z0-9_-]+)*$' \
              ads-latest.txt \
              || true
          )
          if [ -n "$INVALID" ]; then
            echo
            echo "ERROR: invalid DOMAIN-SET entries:"
            echo "$INVALID"
            exit 1
          fi
          echo
          echo "Valid Surge DOMAIN-SET rules:"
          echo "$DOMAIN_SET_COUNT"
      # ==========================================================
      # 10. Validate output files
      # ==========================================================
      - name: Validate output files
        shell: bash
        run: |
          set -euo pipefail
          FILES="
          ads-latest.txt
          ads-mosdns.txt
          ads-qx.snippet
          "
          for file in $FILES; do
            if [ ! -s "$file" ]; then
              echo "ERROR: $file is empty or missing"
              exit 1
            fi
            echo "OK: $file"
            ls -lh "$file"
          done
      # ==========================================================
      # 11. Statistics
      # ==========================================================
      - name: Show statistics
        shell: bash
        run: |
          set -euo pipefail
          echo
          echo "========================================"
          echo "ADS RULES BUILD"
          echo "========================================"
          echo
          echo "Normalized:"
          wc -l rules.normalized
          echo
          echo "Rule types:"
          cut -d',' -f1 rules.normalized \
            | sort \
            | uniq -c
          echo
          echo "Surge DOMAIN-SET:"
          grep -vE '^#|^$' ads-latest.txt | wc -l
          echo
          echo "MosDNS:"
          wc -l ads-mosdns.txt
          echo
          echo "Quantumult X:"
          wc -l ads-qx.snippet
          echo
          echo "Generated files:"
          echo "  ads-latest.txt"
          echo "  ads-mosdns.txt"
          echo "  ads-qx.snippet"
          echo
          echo "NOT generated:"
          echo "  ads-clash.yaml"
          echo "  ads-singbox.json"
          echo "  *.mrs"
          echo "  *.srs"
      # ==========================================================
      # 12. Cleanup
      # ==========================================================
      - name: Cleanup
        shell: bash
        run: |
          rm -f \
            source-olocn.txt \
            source-awa.txt \
            rules.normalized
      # ==========================================================
      # 13. Commit and push
      # ==========================================================
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name \
            "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ads-latest.txt \
            ads-mosdns.txt \
            ads-qx.snippet
          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi
          git commit \
            -m "chore: update ads rules ${DATE}"
          git push
