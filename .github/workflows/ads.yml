name: "ads-rules"
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ads-rules
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      # ==========================================================
      # 2. 日期
      # ==========================================================
      - name: Set date
        run: |
          echo "DATE=$(date -u +'%Y-%m-%d')" >> "$GITHUB_ENV"
      # ==========================================================
      # 3. 获取最新版本
      # ==========================================================
      - name: Get latest tool versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          TAG_SING="$(
            curl -fsSL \
              --retry 3 \
              --retry-delay 2 \
              https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | grep '"tag_name":' \
            | head -n 1 \
            | sed -E 's/.*"([^"]+)".*/\1/'
          )"
          TAG_MIHOMO="$(
            curl -fsSL \
              --retry 3 \
              --retry-delay 2 \
              https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | grep '"tag_name":' \
            | head -n 1 \
            | sed -E 's/.*"([^"]+)".*/\1/'
          )"
          test -n "$TAG_SING"
          test -n "$TAG_MIHOMO"
          echo "singbox=${TAG_SING}" >> "$GITHUB_OUTPUT"
          echo "mihomo=${TAG_MIHOMO}" >> "$GITHUB_OUTPUT"
          echo "======================================"
          echo "Latest versions"
          echo "======================================"
          echo "sing-box : ${TAG_SING}"
          echo "mihomo   : ${TAG_MIHOMO}"
      # ==========================================================
      # 4. Cache binaries
      # ==========================================================
      - name: Cache binaries
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/custom-tools
          key: ${{ runner.os }}-tools-${{ steps.versions.outputs.singbox }}-${{ steps.versions.outputs.mihomo }}
      # ==========================================================
      # 5. 安装 sing-box / mihomo
      # ==========================================================
      - name: Install sing-box & mihomo
        if: steps.cache-tools.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /usr/local/bin/custom-tools
          # ------------------------------------------------------
          # sing-box
          # ------------------------------------------------------
          TAG_SING="${{ steps.versions.outputs.singbox }}"
          VERSION_SING="${TAG_SING#v}"
          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            -o sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/${TAG_SING}/sing-box-${VERSION_SING}-linux-amd64.tar.gz"
          tar -xzf sing-box.tar.gz
          install -m 0755 \
            "sing-box-${VERSION_SING}-linux-amd64/sing-box" \
            /usr/local/bin/custom-tools/sing-box
          rm -rf \
            sing-box.tar.gz \
            "sing-box-${VERSION_SING}-linux-amd64"
          # ------------------------------------------------------
          # mihomo
          # ------------------------------------------------------
          TAG_MIHOMO="${{ steps.versions.outputs.mihomo }}"
          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            -o mihomo.gz \
            "https://github.com/MetaCubeX/mihomo/releases/download/${TAG_MIHOMO}/mihomo-linux-amd64-${TAG_MIHOMO}.gz"
          gunzip mihomo.gz
          install -m 0755 \
            mihomo \
            /usr/local/bin/custom-tools/mihomo
          rm -f mihomo
      # ==========================================================
      # 6. PATH + 版本
      # ==========================================================
      - name: Add custom-tools to PATH
        shell: bash
        run: |
          set -euo pipefail
          echo "/usr/local/bin/custom-tools" >> "$GITHUB_PATH"
          export PATH="/usr/local/bin/custom-tools:$PATH"
          echo "======================================"
          echo "sing-box"
          echo "======================================"
          sing-box version
          echo
          echo "======================================"
          echo "mihomo"
          echo "======================================"
          mihomo -v
      # ==========================================================
      # 7. 下载规则
      # ==========================================================
      - name: Download rules
        shell: bash
        run: |
          set -euo pipefail
          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            --connect-timeout 15 \
            --max-time 120 \
            https://raw.githubusercontent.com/olocn/rule/refs/heads/master/surge/reject-drop.txt \
            -o ruleA.txt
          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            --connect-timeout 15 \
            --max-time 120 \
            https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list \
            -o ruleB.list
          test -s ruleA.txt
          test -s ruleB.list
          echo "======================================"
          echo "Downloaded sources"
          echo "======================================"
          wc -l \
            ruleA.txt \
            ruleB.list
      # ==========================================================
      # 8. 规则清洗
      #
      # 最终只保留：
      #
      # DOMAIN
      # DOMAIN-SUFFIX
      # DOMAIN-KEYWORD
      # ==========================================================
      - name: Normalize source rules
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            rules.source \
            rules.normalized
          cat \
            ruleA.txt \
            ruleB.list \
          | sed \
              '/^[[:space:]]*$/d' \
          | grep -vE \
              '^[[:space:]]*#' \
          | sed -E \
              's/,(REJECT|REJECT-DROP|reject|reject-drop)[[:space:]]*$//I' \
          | sed -E \
              's/,(extended-matching|pre-matching|no-resolve)//Ig' \
          | sed \
              's/^[[:space:]]*//' \
          | sed \
              's/[[:space:]]*$//' \
          > rules.source
          awk -F',' '
          BEGIN {
            OFS=","
          }
          {
            type = toupper($1)
            value = $2
            gsub(/^[[:space:]]+/, "", value)
            gsub(/[[:space:]]+$/, "", value)
            value = tolower(value)
            if (value == "")
              next
            # 去掉域名前后的点
            sub(/^\.+/, "", value)
            sub(/\.+$/, "", value)
            if (value == "")
              next
            if (type == "DOMAIN") {
              print "DOMAIN", value
            }
            else if (type == "DOMAIN-SUFFIX") {
              print "DOMAIN-SUFFIX", value
            }
            else if (type == "DOMAIN-KEYWORD") {
              print "DOMAIN-KEYWORD", value
            }
          }
          ' rules.source \
          | sort -u \
          > rules.normalized
          test -s rules.normalized
          echo "======================================"
          echo "Normalized rules"
          echo "======================================"
          echo "DOMAIN:"
          grep -c '^DOMAIN,' rules.normalized || true
          echo "DOMAIN-SUFFIX:"
          grep -c '^DOMAIN-SUFFIX,' rules.normalized || true
          echo "DOMAIN-KEYWORD:"
          grep -c '^DOMAIN-KEYWORD,' rules.normalized || true
          echo "Total:"
          wc -l < rules.normalized
      # ==========================================================
      # 9. 生成 Mihomo YAML
      # ==========================================================
      - name: Generate Mihomo YAML
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "payload:"
            awk -F',' '
            {
              print "  - " $1 "," $2
            }
            ' rules.normalized
          } > ads-clash.yaml
          test -s ads-clash.yaml
          echo "======================================"
          echo "Mihomo YAML"
          echo "======================================"
          ls -lh ads-clash.yaml
          echo
          echo "First 10 rules:"
          head -n 11 ads-clash.yaml
      # ==========================================================
      # 10. Surge DOMAIN-SET
      #
      # 输出：
      #
      # DOMAIN-SET,example.com
      # DOMAIN-SET,ads.example.com
      #
      # DOMAIN-KEYWORD 无法转换为 DOMAIN-SET，因此忽略
      # ==========================================================
      - name: Generate Surge DOMAIN-SET
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Auto merged Surge DOMAIN-SET rules (${DATE})"
            awk -F',' '
            {
              if ($1 == "DOMAIN")
                print "DOMAIN-SET," $2
              else if ($1 == "DOMAIN-SUFFIX")
                print "DOMAIN-SET," $2
            }
            ' rules.normalized \
            | sort -u
          } > ads-latest.txt
          test -s ads-latest.txt
          echo "======================================"
          echo "Surge DOMAIN-SET"
          echo "======================================"
          ls -lh ads-latest.txt
          echo
          echo "First 10 rules:"
          head -n 11 ads-latest.txt
          echo
          echo "Total:"
          grep -c '^DOMAIN-SET,' ads-latest.txt || true
      # ==========================================================
      # 11. MosDNS
      #
      # domain = suffix
      # full   = exact
      # keyword = keyword
      # ==========================================================
      - name: Generate MosDNS rules
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Auto merged MosDNS rules (${DATE})"
            awk -F',' '
            {
              if ($1 == "DOMAIN-SUFFIX")
                print "domain:" $2
              else if ($1 == "DOMAIN")
                print "full:" $2
              else if ($1 == "DOMAIN-KEYWORD")
                print "keyword:" $2
            }
            ' rules.normalized
          } > ads-mosdns.txt
          test -s ads-mosdns.txt
      # ==========================================================
      # 12. Quantumult X
      #
      # DOMAIN-SUFFIX -> host-suffix
      # DOMAIN        -> host
      # DOMAIN-KEYWORD -> host-keyword
      # ==========================================================
      - name: Generate Quantumult X rules
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Auto merged Quantumult X rules (${DATE})"
            awk -F',' '
            {
              if ($1 == "DOMAIN-SUFFIX")
                print "host-suffix, " $2 ", reject"
              else if ($1 == "DOMAIN")
                print "host, " $2 ", reject"
              else if ($1 == "DOMAIN-KEYWORD")
                print "host-keyword, " $2 ", reject"
            }
            ' rules.normalized
          } > ads-qx.snippet
          test -s ads-qx.snippet
      # ==========================================================
      # 13. sing-box JSON
      #
      # sing-box 1.14+ -> source format version 5
      # ==========================================================
      - name: Generate sing-box JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          suffix = set()
          domain = set()
          keyword = set()
          with open(
              "rules.normalized",
              "r",
              encoding="utf-8"
          ) as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  parts = line.split(",", 1)
                  if len(parts) != 2:
                      continue
                  rule_type, value = parts
                  if rule_type == "DOMAIN-SUFFIX":
                      suffix.add(value)
                  elif rule_type == "DOMAIN":
                      domain.add(value)
                  elif rule_type == "DOMAIN-KEYWORD":
                      keyword.add(value)
          rule = {}
          if domain:
              rule["domain"] = sorted(domain)
          if suffix:
              rule["domain_suffix"] = sorted(suffix)
          if keyword:
              rule["domain_keyword"] = sorted(keyword)
          if not rule:
              raise SystemExit("ERROR: no valid rules")
          output = {
              "version": 5,
              "rules": [
                  rule
              ]
          }
          with open(
              "ads-singbox.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
              f.write("\n")
          PY
          echo "======================================"
          echo "sing-box JSON"
          echo "======================================"
          ls -lh ads-singbox.json
          echo
          echo "JSON validation:"
          python3 -m json.tool \
            ads-singbox.json \
            > /dev/null
          echo "OK"
      # ==========================================================
      # 14. sing-box 实际规则集验证
      #
      # 只验证，不输出 SRS
      # ==========================================================
      - name: Validate sing-box rule-set
        shell: bash
        run: |
          set -euo pipefail
          echo "======================================"
          echo "sing-box rule-set compile test"
          echo "======================================"
          sing-box rule-set compile \
            --output /tmp/ads-test.srs \
            ads-singbox.json
          test -s /tmp/ads-test.srs
          ls -lh /tmp/ads-test.srs
          echo "sing-box rule-set: OK"
      # ==========================================================
      # 15. Mihomo YAML 检查
      # ==========================================================
      - name: Validate Mihomo YAML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml
          with open(
              "ads-clash.yaml",
              "r",
              encoding="utf-8"
          ) as f:
              data = yaml.safe_load(f)
          if not isinstance(data, dict):
              raise SystemExit("Invalid YAML structure")
          payload = data.get("payload")
          if not isinstance(payload, list):
              raise SystemExit("Missing payload list")
          if not payload:
              raise SystemExit("Empty payload")
          print(f"Mihomo payload rules: {len(payload)}")
          print("YAML: OK")
          PY
      # ==========================================================
      # 16. 最终输出检查
      # ==========================================================
      - name: Verify all outputs
        shell: bash
        run: |
          set -euo pipefail
          echo "======================================"
          echo "Final outputs"
          echo "======================================"
          ls -lh \
            ads-latest.txt \
            ads-mosdns.txt \
            ads-qx.snippet \
            ads-singbox.json \
            ads-clash.yaml
          echo
          echo "======================================"
          echo "Rule counts"
          echo "======================================"
          DOMAIN_COUNT=$(
            grep -c '^DOMAIN,' rules.normalized || true
          )
          SUFFIX_COUNT=$(
            grep -c '^DOMAIN-SUFFIX,' rules.normalized || true
          )
          KEYWORD_COUNT=$(
            grep -c '^DOMAIN-KEYWORD,' rules.normalized || true
          )
          TOTAL_COUNT=$(
            wc -l < rules.normalized
          )
          DOMAIN_SET_COUNT=$(
            grep -c '^DOMAIN-SET,' ads-latest.txt || true
          )
          echo "DOMAIN         : ${DOMAIN_COUNT}"
          echo "DOMAIN-SUFFIX  : ${SUFFIX_COUNT}"
          echo "DOMAIN-KEYWORD : ${KEYWORD_COUNT}"
          echo "TOTAL          : ${TOTAL_COUNT}"
          echo "DOMAIN-SET     : ${DOMAIN_SET_COUNT}"
          if [ "$TOTAL_COUNT" -eq 0 ]; then
            echo "ERROR: generated zero rules"
            exit 1
          fi
          if [ "$DOMAIN_SET_COUNT" -eq 0 ]; then
            echo "ERROR: generated zero DOMAIN-SET rules"
            exit 1
          fi
          # 确保 Surge 文件中不存在其他规则类型
          if grep -vE '^#|^DOMAIN-SET,' ads-latest.txt | grep -q .; then
            echo "ERROR: ads-latest.txt contains invalid rules"
            exit 1
          fi
      # ==========================================================
      # 17. 清理
      # ==========================================================
      - name: Cleanup
        shell: bash
        run: |
          rm -f \
            ruleA.txt \
            ruleB.list \
            rules.source \
            rules.normalized
      # ==========================================================
      # 18. Commit & Push
      # ==========================================================
      - name: Commit and Push result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name \
            "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ads-latest.txt \
            ads-mosdns.txt \
            ads-qx.snippet \
            ads-singbox.json \
            ads-clash.yaml
          if git diff --staged --quiet; then
            echo "======================================"
            echo "No changes detected"
            echo "======================================"
            exit 0
          fi
          echo "======================================"
          echo "Changes detected"
          echo "======================================"
          git diff --stat --cached
          git commit \
            -m "Update ad rules (${DATE}) [skip ci]"
          git push \
            origin \
            "HEAD:${{ github.ref_name }}"
