name: ads-rules
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ads-rules
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      # ==========================================================
      # 2. Basic environment
      # ==========================================================
      - name: Prepare environment
        shell: bash
        run: |
          set -euo pipefail
          echo "DATE=$(date -u +'%Y-%m-%d')" >> "$GITHUB_ENV"
          mkdir -p /usr/local/bin/custom-tools
          echo "/usr/local/bin/custom-tools" >> "$GITHUB_PATH"
      # ==========================================================
      # 3. Get latest sing-box / Mihomo versions
      # ==========================================================
      - name: Get latest versions
        shell: bash
        run: |
          set -euo pipefail
          VERSION_SING=$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | jq -r '.tag_name'
          )
          TAG_MIHOMO=$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '.tag_name'
          )
          test -n "$VERSION_SING"
          test -n "$TAG_MIHOMO"
          echo "VERSION_SING=$VERSION_SING" >> "$GITHUB_ENV"
          echo "TAG_MIHOMO=$TAG_MIHOMO" >> "$GITHUB_ENV"
          echo "sing-box: $VERSION_SING"
          echo "mihomo:   $TAG_MIHOMO"
      # ==========================================================
      # 4. Cache binaries
      # ==========================================================
      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/custom-tools
          key: ads-tools-${{ runner.os }}-${{ env.VERSION_SING }}-${{ env.TAG_MIHOMO }}
      # ==========================================================
      # 5. Install sing-box
      # ==========================================================
      - name: Install sing-box
        shell: bash
        run: |
          set -euo pipefail
          if command -v sing-box >/dev/null 2>&1; then
            echo "sing-box already available"
            sing-box version
            exit 0
          fi
          if [ -x /usr/local/bin/custom-tools/sing-box ]; then
            echo "Using cached sing-box"
            exit 0
          fi
          VERSION="${VERSION_SING#v}"
          URL="https://github.com/SagerNet/sing-box/releases/download/${VERSION_SING}/sing-box-${VERSION}-linux-amd64.tar.gz"
          echo "Downloading:"
          echo "$URL"
          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 15 \
            --max-time 180 \
            "$URL" \
            -o /tmp/sing-box.tar.gz
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          BIN=$(find /tmp -type f -name sing-box | head -n 1)
          test -n "$BIN"
          install -m 0755 "$BIN" \
            /usr/local/bin/custom-tools/sing-box
          /usr/local/bin/custom-tools/sing-box version
      # ==========================================================
      # 6. Install Mihomo
      # ==========================================================
      - name: Install Mihomo
        shell: bash
        run: |
          set -euo pipefail
          if [ -x /usr/local/bin/custom-tools/mihomo ]; then
            echo "Using cached Mihomo"
            /usr/local/bin/custom-tools/mihomo -v
            exit 0
          fi
          URL="https://github.com/MetaCubeX/mihomo/releases/download/${TAG_MIHOMO}/mihomo-linux-amd64-${TAG_MIHOMO}.gz"
          echo "Downloading:"
          echo "$URL"
          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 15 \
            --max-time 180 \
            "$URL" \
            -o /tmp/mihomo.gz
          gzip -dc /tmp/mihomo.gz \
            > /usr/local/bin/custom-tools/mihomo
          chmod +x /usr/local/bin/custom-tools/mihomo
          /usr/local/bin/custom-tools/mihomo -v
      # ==========================================================
      # 7. Download source rules
      # ==========================================================
      - name: Download source rules
        shell: bash
        run: |
          set -euo pipefail
          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 15 \
            --max-time 180 \
            "https://raw.githubusercontent.com/olocn/rule/refs/heads/master/surge/reject-drop.txt" \
            -o source-olocn.txt
          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 15 \
            --max-time 180 \
            "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list" \
            -o source-awa.txt
          test -s source-olocn.txt
          test -s source-awa.txt
          echo "Source files:"
          wc -l source-olocn.txt source-awa.txt
      # ==========================================================
      # 8. Normalize rules
      # ==========================================================
      - name: Normalize rules
        shell: bash
        run: |
          set -euo pipefail
          cat source-olocn.txt source-awa.txt \
            | sed 's/\r$//' \
            | sed 's/[[:space:]]*#.*$//' \
            | sed 's/[[:space:]]*$//' \
            | grep -vE '^[[:space:]]*$' \
            | sed -E \
                's/,(REJECT|REJECT-DICT|REJECT-TINYGIF|REJECT-NO-DROP|REJECT-IMG|REJECT-200|REJECT-DROP|REJECT-QUIC)$//I' \
            | sed -E \
                's/,(extended-matching|pre-matching|no-resolve)//Ig' \
            | sed -E 's/^[[:space:]]+//;s/[[:space:]]+$//' \
            | awk -F',' '
                NF >= 2 &&
                ($1 == "DOMAIN" ||
                 $1 == "DOMAIN-SUFFIX" ||
                 $1 == "DOMAIN-KEYWORD")
                {
                  value=$2
                  gsub(/^[[:space:]]+/, "", value)
                  gsub(/[[:space:]]+$/, "", value)
                  if (value == "")
                    next
                  value=tolower(value)
                  sub(/^\./, "", value)
                  sub(/\.$/, "", value)
                  print $1 "," value
                }
              ' \
            | sort -u \
            > rules.normalized
          test -s rules.normalized
          echo "Normalized rules:"
          wc -l rules.normalized
          echo
          echo "Rule types:"
          cut -d',' -f1 rules.normalized \
            | sort \
            | uniq -c
      # ==========================================================
      # 9. Generate Mihomo YAML
      # ==========================================================
      - name: Generate Mihomo YAML
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "payload:"
            awk -F',' '
            {
              print "  - " $1 "," $2
            }
            ' rules.normalized
          } > ads-clash.yaml
          test -s ads-clash.yaml
      # ==========================================================
      # 10. Generate Surge DOMAIN-SET
      #
      # DOMAIN       -> example.com
      # DOMAIN-SUFFIX -> .example.com
      #
      # DOMAIN-KEYWORD 不生成
      # ==========================================================
      - name: Generate Surge DOMAIN-SET
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Auto merged Surge DOMAIN-SET rules (${DATE})"
            awk -F',' '
            {
              if ($1 == "DOMAIN")
                print $2
              else if ($1 == "DOMAIN-SUFFIX")
                print "." $2
            }
            ' rules.normalized | sort -u
          } > ads-latest.txt
          test -s ads-latest.txt
          echo "Surge DOMAIN-SET:"
          grep -vE '^#|^$' ads-latest.txt | wc -l
          echo
          head -n 20 ads-latest.txt
      # ==========================================================
      # 11. Generate MosDNS
      # ==========================================================
      - name: Generate MosDNS
        shell: bash
        run: |
          set -euo pipefail
          awk -F',' '
          {
            if ($1 == "DOMAIN-SUFFIX")
              print "domain:" $2
            else if ($1 == "DOMAIN")
              print "full:" $2
            else if ($1 == "DOMAIN-KEYWORD")
              print "keyword:" $2
          }
          ' rules.normalized \
          | sort -u \
          > ads-mosdns.txt
          test -s ads-mosdns.txt
      # ==========================================================
      # 12. Generate Quantumult X
      # ==========================================================
      - name: Generate Quantumult X
        shell: bash
        run: |
          set -euo pipefail
          awk -F',' '
          {
            if ($1 == "DOMAIN-SUFFIX")
              print "host-suffix," $2 ",reject"
            else if ($1 == "DOMAIN")
              print "host," $2 ",reject"
            else if ($1 == "DOMAIN-KEYWORD")
              print "host-keyword," $2 ",reject"
          }
          ' rules.normalized \
          | sort -u \
          > ads-qx.snippet
          test -s ads-qx.snippet
      # ==========================================================
      # 13. Generate sing-box JSON source rule-set
      # ==========================================================
      - name: Generate sing-box JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          domain = []
          domain_suffix = []
          domain_keyword = []
          with open("rules.normalized", encoding="utf-8") as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  typ, value = line.split(",", 1)
                  if typ == "DOMAIN":
                      domain.append(value)
                  elif typ == "DOMAIN-SUFFIX":
                      domain_suffix.append(value)
                  elif typ == "DOMAIN-KEYWORD":
                      domain_keyword.append(value)
          rule = {}
          if domain:
              rule["domain"] = sorted(set(domain))
          if domain_suffix:
              rule["domain_suffix"] = sorted(set(domain_suffix))
          if domain_keyword:
              rule["domain_keyword"] = sorted(set(domain_keyword))
          data = {
              "version": 5,
              "rules": [rule]
          }
          with open(
              "ads-singbox.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
              f.write("\n")
          PY
          test -s ads-singbox.json
          python3 -m json.tool \
            ads-singbox.json \
            > /dev/null
      # ==========================================================
      # 14. Compile sing-box SRS
      #
      # 仅作为 CI 验证，不提交 SRS
      # ==========================================================
      - name: Validate sing-box rule-set
        shell: bash
        run: |
          set -euo pipefail
          sing-box rule-set compile \
            --output /tmp/ads-test.srs \
            ads-singbox.json
          test -s /tmp/ads-test.srs
          echo "sing-box rule-set compiled successfully"
      # ==========================================================
      # 15. Validate Mihomo YAML
      # ==========================================================
      - name: Validate Mihomo YAML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import yaml
          with open(
              "ads-clash.yaml",
              encoding="utf-8"
          ) as f:
              data = yaml.safe_load(f)
          if not isinstance(data, dict):
              raise SystemExit("Invalid YAML root")
          payload = data.get("payload")
          if not isinstance(payload, list):
              raise SystemExit("Missing payload list")
          if not payload:
              raise SystemExit("payload is empty")
          print(f"Mihomo rules: {len(payload)}")
          PY
      # ==========================================================
      # 16. Validate Surge DOMAIN-SET
      #
      # 合法：
      # example.com
      # .example.com
      #
      # 非法：
      # DOMAIN-SET,example.com
      # DOMAIN,example.com
      # DOMAIN-SUFFIX,example.com
      # ==========================================================
      - name: Validate Surge DOMAIN-SET
        shell: bash
        run: |
          set -euo pipefail
          DOMAIN_SET_COUNT=$(
            grep -vE '^#|^$' ads-latest.txt | wc -l
          )
          if [ "$DOMAIN_SET_COUNT" -eq 0 ]; then
            echo "ERROR: ads-latest.txt contains no rules"
            exit 1
          fi
          if grep -vE \
            '^#|^$|^\.[A-Za-z0-9_-]+([.][A-Za-z0-9_-]+)*$|^[A-Za-z0-9_-]+([.][A-Za-z0-9_-]+)*$' \
            ads-latest.txt \
            | grep -q .; then
            echo "ERROR: ads-latest.txt contains invalid DOMAIN-SET entries"
            echo
            echo "Invalid entries:"
            grep -vE \
              '^#|^$|^\.[A-Za-z0-9_-]+([.][A-Za-z0-9_-]+)*$|^[A-Za-z0-9_-]+([.][A-Za-z0-9_-]+)*$' \
              ads-latest.txt || true
            exit 1
          fi
          echo "Valid Surge DOMAIN-SET rules: $DOMAIN_SET_COUNT"
      # ==========================================================
      # 17. Validate generated files
      # ==========================================================
      - name: Validate output files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            ads-latest.txt \
            ads-clash.yaml \
            ads-mosdns.txt \
            ads-qx.snippet \
            ads-singbox.json
          do
            if [ ! -s "$file" ]; then
              echo "ERROR: $file is empty or missing"
              exit 1
            fi
            echo "OK: $file"
            ls -lh "$file"
          done
      # ==========================================================
      # 18. Show statistics
      # ==========================================================
      - name: Show statistics
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================"
          echo "ADS RULES BUILD"
          echo "========================================"
          echo
          echo "Normalized:"
          wc -l rules.normalized
          echo
          echo "Surge DOMAIN-SET:"
          grep -vE '^#|^$' ads-latest.txt | wc -l
          echo
          echo "Mihomo:"
          grep -c '^  - ' ads-clash.yaml
          echo
          echo "MosDNS:"
          wc -l ads-mosdns.txt
          echo
          echo "Quantumult X:"
          wc -l ads-qx.snippet
          echo
          echo "sing-box:"
          python3 - <<'PY'
          import json
          with open(
              "ads-singbox.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)
          rules = data.get("rules", [])
          print("version:", data.get("version"))
          print("rule groups:", len(rules))
          for rule in rules:
              for key in (
                  "domain",
                  "domain_suffix",
                  "domain_keyword"
              ):
                  print(
                      f"{key}:",
                      len(rule.get(key, []))
                  )
          PY
      # ==========================================================
      # 19. Remove temporary source files
      # ==========================================================
      - name: Cleanup
        shell: bash
        run: |
          rm -f \
            source-olocn.txt \
            source-awa.txt \
            rules.normalized
      # ==========================================================
      # 20. Commit and push
      # ==========================================================
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ads-latest.txt \
            ads-clash.yaml \
            ads-mosdns.txt \
            ads-qx.snippet \
            ads-singbox.json
          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi
          git commit \
            -m "chore: update ads rules ${DATE}"
          git push
