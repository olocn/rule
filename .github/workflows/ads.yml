name: ads-rules
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ads-rules
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      # ==========================================================
      # 2. Prepare environment
      # ==========================================================
      - name: Prepare environment
        shell: bash
        run: |
          set -euo pipefail
          echo "DATE=$(date -u +'%Y-%m-%d')" >> "$GITHUB_ENV"
          mkdir -p /usr/local/bin/custom-tools
          echo "/usr/local/bin/custom-tools" >> "$GITHUB_PATH"
      # ==========================================================
      # 3. Get latest sing-box / Mihomo versions
      # ==========================================================
      - name: Get latest versions
        shell: bash
        run: |
          set -euo pipefail
          VERSION_SING=$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              --connect-timeout 15 \
              --max-time 60 \
              https://api.github.com/repos/SagerNet/sing-box/releases/latest \
              | jq -r '.tag_name'
          )
          TAG_MIHOMO=$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              --connect-timeout 15 \
              --max-time 60 \
              https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
              | jq -r '.tag_name'
          )
          if [ -z "$VERSION_SING" ] || [ "$VERSION_SING" = "null" ]; then
            echo "ERROR: failed to get sing-box version"
            exit 1
          fi
          if [ -z "$TAG_MIHOMO" ] || [ "$TAG_MIHOMO" = "null" ]; then
            echo "ERROR: failed to get Mihomo version"
            exit 1
          fi
          echo "VERSION_SING=$VERSION_SING" >> "$GITHUB_ENV"
          echo "TAG_MIHOMO=$TAG_MIHOMO" >> "$GITHUB_ENV"
          echo "sing-box: $VERSION_SING"
          echo "mihomo:   $TAG_MIHOMO"
      # ==========================================================
      # 4. Cache tools
      # ==========================================================
      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/custom-tools
          key: ads-tools-${{ runner.os }}-${{ env.VERSION_SING }}-${{ env.TAG_MIHOMO }}
      # ==========================================================
      # 5. Install sing-box
      #
      # 只在自己创建的目录中搜索
      # 不扫描整个 /tmp
      # ==========================================================
      - name: Install sing-box
        shell: bash
        run: |
          set -euo pipefail
          TOOL_DIR="/usr/local/bin/custom-tools"
          PACKAGE_DIR="/tmp/sing-box-package"
          if [ -x "$TOOL_DIR/sing-box" ]; then
            echo "Using cached sing-box"
            "$TOOL_DIR/sing-box" version
            exit 0
          fi
          VERSION="${VERSION_SING#v}"
          URL="https://github.com/SagerNet/sing-box/releases/download/${VERSION_SING}/sing-box-${VERSION}-linux-amd64.tar.gz"
          echo "Downloading sing-box:"
          echo "$URL"
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR"
          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 15 \
            --max-time 180 \
            "$URL" \
            -o /tmp/sing-box.tar.gz
          tar -xzf \
            /tmp/sing-box.tar.gz \
            -C "$PACKAGE_DIR"
          echo
          echo "Extracted files:"
          find "$PACKAGE_DIR" \
            -maxdepth 3 \
            -type f \
            -print
          BIN=$(
            find "$PACKAGE_DIR" \
              -maxdepth 3 \
              -type f \
              -name "sing-box" \
              -print \
              | head -n 1
          )
          if [ -z "$BIN" ]; then
            echo "ERROR: sing-box binary not found"
            exit 1
          fi
          echo
          echo "Found sing-box:"
          echo "$BIN"
          install -m 0755 \
            "$BIN" \
            "$TOOL_DIR/sing-box"
          echo
          echo "Installed sing-box:"
          "$TOOL_DIR/sing-box" version
      # ==========================================================
      # 6. Install Mihomo
      # ==========================================================
      - name: Install Mihomo
        shell: bash
        run: |
          set -euo pipefail
          TOOL_DIR="/usr/local/bin/custom-tools"
          if [ -x "$TOOL_DIR/mihomo" ]; then
            echo "Using cached Mihomo"
            "$TOOL_DIR/mihomo" -v
            exit 0
          fi
          URL="https://github.com/MetaCubeX/mihomo/releases/download/${TAG_MIHOMO}/mihomo-linux-amd64-${TAG_MIHOMO}.gz"
          echo "Downloading Mihomo:"
          echo "$URL"
          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 15 \
            --max-time 180 \
            "$URL" \
            -o /tmp/mihomo.gz
          gzip -dc \
            /tmp/mihomo.gz \
            > "$TOOL_DIR/mihomo"
          chmod 0755 "$TOOL_DIR/mihomo"
          echo
          echo "Installed Mihomo:"
          "$TOOL_DIR/mihomo" -v
      # ==========================================================
      # 7. Download source rules
      # ==========================================================
      - name: Download source rules
        shell: bash
        run: |
          set -euo pipefail
          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 15 \
            --max-time 180 \
            "https://raw.githubusercontent.com/olocn/rule/refs/heads/master/surge/reject-drop.txt" \
            -o source-olocn.txt
          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 15 \
            --max-time 180 \
            "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list" \
            -o source-awa.txt
          if [ ! -s source-olocn.txt ]; then
            echo "ERROR: source-olocn.txt is empty"
            exit 1
          fi
          if [ ! -s source-awa.txt ]; then
            echo "ERROR: source-awa.txt is empty"
            exit 1
          fi
          echo "Source rules:"
          wc -l source-olocn.txt source-awa.txt
      # ==========================================================
      # 8. Normalize rules
      #
      # 支持：
      # DOMAIN
      # DOMAIN-SUFFIX
      # DOMAIN-KEYWORD
      # DOMAIN-SET
      #
      # 清理：
      # BOM
      # Zero Width Space
      # Zero Width Joiner
      # Word Joiner U+2060
      # Bidi 控制字符
      # Soft Hyphen
      # ==========================================================
      - name: Normalize rules
        shell: bash
        run: |
          set -euo pipefail
          cat \
            source-olocn.txt \
            source-awa.txt \
            | perl -CS -pe '
                # BOM
                s/\x{FEFF}//g;
                # Zero Width Space
                s/\x{200B}//g;
                # Zero Width Non-Joiner
                s/\x{200C}//g;
                # Zero Width Joiner
                s/\x{200D}//g;
                # Word Joiner
                s/\x{2060}//g;
                # Soft Hyphen
                s/\x{00AD}//g;
                # Left-to-Right Mark
                s/\x{200E}//g;
                # Right-to-Left Mark
                s/\x{200F}//g;
                # Directional formatting
                s/\x{202A}//g;
                s/\x{202B}//g;
                s/\x{202C}//g;
                s/\x{202D}//g;
                s/\x{202E}//g;
                # Bidi isolates
                s/\x{2066}//g;
                s/\x{2067}//g;
                s/\x{2068}//g;
                s/\x{2069}//g;
                # CRLF
                s/\r$//;
              ' \
            | sed 's/[[:space:]]*#.*$//' \
            | sed 's/[[:space:]]*$//' \
            | grep -vE '^[[:space:]]*$' \
            | sed -E \
                's/,(REJECT|REJECT-DICT|REJECT-TINYGIF|REJECT-NO-DROP|REJECT-IMG|REJECT-200|REJECT-DROP|REJECT-QUIC)$//I' \
            | sed -E \
                's/,(extended-matching|pre-matching|no-resolve)//Ig' \
            | sed -E \
                's/^[[:space:]]+//;s/[[:space:]]+$//' \
            | awk -F',' '
                NF >= 2 &&
                ($1 == "DOMAIN" ||
                 $1 == "DOMAIN-SUFFIX" ||
                 $1 == "DOMAIN-KEYWORD" ||
                 $1 == "DOMAIN-SET")
                {
                  value=$2
                  gsub(/^[[:space:]]+/, "", value)
                  gsub(/[[:space:]]+$/, "", value)
                  if (value == "")
                    next
                  value=tolower(value)
                  # 去掉输入域名前后的点
                  sub(/^\./, "", value)
                  sub(/\.$/, "", value)
                  print $1 "," value
                }
              ' \
            | sort -u \
            > rules.normalized
          if [ ! -s rules.normalized ]; then
            echo "ERROR: normalized rules are empty"
            exit 1
          fi
          echo "Normalized rules:"
          wc -l rules.normalized
          echo
          echo "Rule types:"
          cut -d',' -f1 rules.normalized \
            | sort \
            | uniq -c
      # ==========================================================
      # 9. Generate Mihomo YAML
      #
      # DOMAIN-SET 按 DOMAIN 处理
      # ==========================================================
      - name: Generate Mihomo YAML
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "payload:"
            awk -F',' '
            {
              if ($1 == "DOMAIN-SET")
                print "  - DOMAIN," $2
              else
                print "  - " $1 "," $2
            }
            ' rules.normalized
          } > ads-clash.yaml
          if [ ! -s ads-clash.yaml ]; then
            echo "ERROR: ads-clash.yaml is empty"
            exit 1
          fi
      # ==========================================================
      # 10. Generate Surge DOMAIN-SET
      #
      # DOMAIN:
      #   DOMAIN,2345.com
      #   ->
      #   2345.com
      #
      # DOMAIN-SUFFIX:
      #   DOMAIN-SUFFIX,2345.com
      #   ->
      #   .2345.com
      #
      # DOMAIN-SET:
      #   DOMAIN-SET,2345.com
      #   ->
      #   2345.com
      #
      # DOMAIN-KEYWORD:
      #   不进入 ads-latest.txt
      # ==========================================================
      - name: Generate Surge DOMAIN-SET
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Auto merged Surge DOMAIN-SET rules (${DATE})"
            awk -F',' '
            {
              if ($1 == "DOMAIN")
                print $2
              else if ($1 == "DOMAIN-SUFFIX")
                print "." $2
              else if ($1 == "DOMAIN-SET")
                print $2
            }
            ' rules.normalized \
            | sort -u
          } > ads-latest.txt
          DOMAIN_SET_COUNT=$(
            grep -vE '^#|^$' ads-latest.txt | wc -l
          )
          if [ "$DOMAIN_SET_COUNT" -eq 0 ]; then
            echo "ERROR: ads-latest.txt contains no rules"
            exit 1
          fi
          echo
          echo "Surge DOMAIN-SET rules:"
          echo "$DOMAIN_SET_COUNT"
          echo
          echo "First 20 rules:"
          head -n 21 ads-latest.txt
      # ==========================================================
      # 11. Generate MosDNS
      #
      # DOMAIN-SET 按 full 处理
      # ==========================================================
      - name: Generate MosDNS
        shell: bash
        run: |
          set -euo pipefail
          awk -F',' '
          {
            if ($1 == "DOMAIN-SUFFIX")
              print "domain:" $2
            else if ($1 == "DOMAIN")
              print "full:" $2
            else if ($1 == "DOMAIN-KEYWORD")
              print "keyword:" $2
            else if ($1 == "DOMAIN-SET")
              print "full:" $2
          }
          ' rules.normalized \
          | sort -u \
          > ads-mosdns.txt
          if [ ! -s ads-mosdns.txt ]; then
            echo "ERROR: ads-mosdns.txt is empty"
            exit 1
          fi
      # ==========================================================
      # 12. Generate Quantumult X
      #
      # DOMAIN-SET 按 host 处理
      # ==========================================================
      - name: Generate Quantumult X
        shell: bash
        run: |
          set -euo pipefail
          awk -F',' '
          {
            if ($1 == "DOMAIN-SUFFIX")
              print "host-suffix," $2 ",reject"
            else if ($1 == "DOMAIN")
              print "host," $2 ",reject"
            else if ($1 == "DOMAIN-KEYWORD")
              print "host-keyword," $2 ",reject"
            else if ($1 == "DOMAIN-SET")
              print "host," $2 ",reject"
          }
          ' rules.normalized \
          | sort -u \
          > ads-qx.snippet
          if [ ! -s ads-qx.snippet ]; then
            echo "ERROR: ads-qx.snippet is empty"
            exit 1
          fi
      # ==========================================================
      # 13. Generate sing-box JSON
      #
      # DOMAIN:
      #   domain
      #
      # DOMAIN-SUFFIX:
      #   domain_suffix
      #
      # DOMAIN-KEYWORD:
      #   domain_keyword
      #
      # DOMAIN-SET:
      #   按 domain 处理
      # ==========================================================
      - name: Generate sing-box JSON
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          domain = set()
          domain_suffix = set()
          domain_keyword = set()
          with open(
              "rules.normalized",
              encoding="utf-8"
          ) as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  parts = line.split(",", 1)
                  if len(parts) != 2:
                      continue
                  typ, value = parts
                  if typ == "DOMAIN":
                      domain.add(value)
                  elif typ == "DOMAIN-SUFFIX":
                      domain_suffix.add(value)
                  elif typ == "DOMAIN-KEYWORD":
                      domain_keyword.add(value)
                  elif typ == "DOMAIN-SET":
                      domain.add(value)
          rule = {}
          if domain:
              rule["domain"] = sorted(domain)
          if domain_suffix:
              rule["domain_suffix"] = sorted(domain_suffix)
          if domain_keyword:
              rule["domain_keyword"] = sorted(domain_keyword)
          if not rule:
              raise SystemExit(
                  "ERROR: sing-box rule is empty"
              )
          data = {
              "version": 5,
              "rules": [
                  rule
              ]
          }
          with open(
              "ads-singbox.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
              f.write("\n")
          PY
          if [ ! -s ads-singbox.json ]; then
            echo "ERROR: ads-singbox.json is empty"
            exit 1
          fi
          python3 -m json.tool \
            ads-singbox.json \
            > /dev/null
          echo "sing-box JSON generated successfully"
      # ==========================================================
      # 14. Validate sing-box
      # ==========================================================
      - name: Validate sing-box rule-set
        shell: bash
        run: |
          set -euo pipefail
          echo "sing-box version:"
          sing-box version
          echo
          echo "Validating JSON..."
          python3 -m json.tool \
            ads-singbox.json \
            > /dev/null
          echo "JSON validation OK"
          echo
          echo "Compiling rule-set..."
          rm -f /tmp/ads-test.srs
          sing-box rule-set compile \
            --output /tmp/ads-test.srs \
            ads-singbox.json
          if [ ! -s /tmp/ads-test.srs ]; then
            echo "ERROR: SRS output is empty"
            exit 1
          fi
          echo
          echo "sing-box rule-set compiled successfully"
          ls -lh /tmp/ads-test.srs
      # ==========================================================
      # 15. Validate Mihomo YAML
      #
      # 不依赖 PyYAML
      # ==========================================================
      - name: Validate Mihomo YAML
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s ads-clash.yaml ]; then
            echo "ERROR: ads-clash.yaml is empty"
            exit 1
          fi
          if ! grep -q '^payload:$' ads-clash.yaml; then
            echo "ERROR: missing payload:"
            exit 1
          fi
          RULE_COUNT=$(
            grep -c '^  - ' ads-clash.yaml || true
          )
          if [ "$RULE_COUNT" -eq 0 ]; then
            echo "ERROR: Mihomo payload is empty"
            exit 1
          fi
          echo "Mihomo rules: $RULE_COUNT"
      # ==========================================================
      # 16. Validate Surge DOMAIN-SET
      #
      # 合法：
      #   example.com
      #   .example.com
      #
      # 非法：
      #   DOMAIN-SET,example.com
      #   DOMAIN,example.com
      #   DOMAIN-SUFFIX,example.com
      #
      # 同时禁止 Unicode 隐藏字符
      # ==========================================================
      - name: Validate Surge DOMAIN-SET
        shell: bash
        run: |
          set -euo pipefail
          DOMAIN_SET_COUNT=$(
            grep -vE '^#|^$' ads-latest.txt | wc -l
          )
          if [ "$DOMAIN_SET_COUNT" -eq 0 ]; then
            echo "ERROR: ads-latest.txt contains no rules"
            exit 1
          fi
          echo "Checking invisible / non-ASCII characters..."
          if LC_ALL=C grep -n '[^ -~]' ads-latest.txt; then
            echo
            echo "ERROR: ads-latest.txt contains non-ASCII/invisible characters"
            exit 1
          fi
          echo "Checking rule-type prefixes..."
          if grep -qE \
            '^(DOMAIN|DOMAIN-SUFFIX|DOMAIN-KEYWORD|DOMAIN-SET),' \
            ads-latest.txt; then
            echo "ERROR: ads-latest.txt contains rule-type prefixes"
            exit 1
          fi
          echo "Checking domain format..."
          INVALID=$(
            grep -vE \
              '^#|^$|^\.[A-Za-z0-9_-]+([.][A-Za-z0-9_-]+)*$|^[A-Za-z0-9_-]+([.][A-Za-z0-9_-]+)*$' \
              ads-latest.txt \
              || true
          )
          if [ -n "$INVALID" ]; then
            echo
            echo "ERROR: invalid DOMAIN-SET entries:"
            echo "$INVALID"
            exit 1
          fi
          echo
          echo "Valid Surge DOMAIN-SET rules:"
          echo "$DOMAIN_SET_COUNT"
      # ==========================================================
      # 17. Extra source sanity check
      #
      # 确保最终规则里不残留 U+2060 等字符
      # ==========================================================
      - name: Validate normalized rules
        shell: bash
        run: |
          set -euo pipefail
          if LC_ALL=C grep -n '[^ -~]' rules.normalized; then
            echo
            echo "ERROR: rules.normalized contains non-ASCII/invisible characters"
            exit 1
          fi
          if grep -qE \
            '^(DOMAIN|DOMAIN-SUFFIX|DOMAIN-KEYWORD|DOMAIN-SET),$' \
            rules.normalized; then
            echo "ERROR: empty domain value detected"
            exit 1
          fi
          echo "Normalized rules are clean."
      # ==========================================================
      # 18. Validate output files
      # ==========================================================
      - name: Validate output files
        shell: bash
        run: |
          set -euo pipefail
          FILES="
          ads-latest.txt
          ads-clash.yaml
          ads-mosdns.txt
          ads-qx.snippet
          ads-singbox.json
          "
          for file in $FILES; do
            if [ ! -s "$file" ]; then
              echo "ERROR: $file is empty or missing"
              exit 1
            fi
            echo "OK: $file"
            ls -lh "$file"
          done
      # ==========================================================
      # 19. Statistics
      # ==========================================================
      - name: Show statistics
        shell: bash
        run: |
          set -euo pipefail
          echo
          echo "========================================"
          echo "ADS RULES BUILD"
          echo "========================================"
          echo
          echo "Normalized:"
          wc -l rules.normalized
          echo
          echo "Rule types:"
          cut -d',' -f1 rules.normalized \
            | sort \
            | uniq -c
          echo
          echo "Surge DOMAIN-SET:"
          grep -vE '^#|^$' ads-latest.txt | wc -l
          echo
          echo "Mihomo:"
          grep -c '^  - ' ads-clash.yaml
          echo
          echo "MosDNS:"
          wc -l ads-mosdns.txt
          echo
          echo "Quantumult X:"
          wc -l ads-qx.snippet
          echo
          echo "sing-box:"
          python3 <<'PY'
          import json
          with open(
              "ads-singbox.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)
          print("version:", data.get("version"))
          rules = data.get("rules", [])
          print("rule groups:", len(rules))
          for rule in rules:
              print(
                  "domain:",
                  len(rule.get("domain", []))
              )
              print(
                  "domain_suffix:",
                  len(rule.get("domain_suffix", []))
              )
              print(
                  "domain_keyword:",
                  len(rule.get("domain_keyword", []))
              )
          PY
      # ==========================================================
      # 20. Cleanup
      # ==========================================================
      - name: Cleanup
        shell: bash
        run: |
          rm -f \
            source-olocn.txt \
            source-awa.txt \
            rules.normalized \
            /tmp/sing-box.tar.gz \
            /tmp/mihomo.gz \
            /tmp/ads-test.srs
          rm -rf \
            /tmp/sing-box-package
      # ==========================================================
      # 21. Commit and push
      # ==========================================================
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name \
            "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ads-latest.txt \
            ads-clash.yaml \
            ads-mosdns.txt \
            ads-qx.snippet \
            ads-singbox.json
          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi
          git commit \
            -m "chore: update ads rules ${DATE}"
          git push
