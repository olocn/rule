name: "ads-rules"

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      # 1️⃣ 获取 sing-box 和 mihomo 最新 release 版本号
      - name: Get latest tool versions
        id: versions
        run: |
          TAG_SING=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          TAG_MIHOMO=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "singbox=${TAG_SING}" >> $GITHUB_OUTPUT
          echo "mihomo=${TAG_MIHOMO}" >> $GITHUB_OUTPUT

      # 2️⃣ 配置二进制缓存
      - name: Cache binaries
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/custom-tools
          key: ${{ runner.os }}-tools-${{ steps.versions.outputs.singbox }}-${{ steps.versions.outputs.mihomo }}

      # 3️⃣ 未命中缓存时下载并提取二进制文件
      - name: Install sing-box & mihomo
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p /usr/local/bin/custom-tools

          # 下载 sing-box
          TAG_SING="${{ steps.versions.outputs.singbox }}"
          VERSION_SING="${TAG_SING#v}"
          curl -Lo sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/${TAG_SING}/sing-box-${VERSION_SING}-linux-amd64.tar.gz"
          tar -xzf sing-box.tar.gz
          mv "sing-box-${VERSION_SING}-linux-amd64/sing-box" /usr/local/bin/custom-tools/
          rm -rf sing-box*

          # 下载 mihomo
          TAG_MIHOMO="${{ steps.versions.outputs.mihomo }}"
          curl -Lo mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${TAG_MIHOMO}/mihomo-linux-amd64-${TAG_MIHOMO}.gz"
          gunzip mihomo.gz
          chmod +x mihomo
          mv mihomo /usr/local/bin/custom-tools/

      # 4️⃣ 将缓存/安装路径加入 PATH 并校验版本
      - name: Add custom-tools to PATH
        run: |
          echo "/usr/local/bin/custom-tools" >> $GITHUB_PATH
          export PATH="/usr/local/bin/custom-tools:$PATH"
          sing-box version
          mihomo -v

      - name: Download conf rules
        run: |
          curl -L https://raw.githubusercontent.com/olocn/rule/refs/heads/master/surge/reject-drop.txt -o ruleA.txt
          curl -L https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list -o ruleB.list

      - name: Extract + merge + optimize rules
        run: |
          set -e

          # 1. 清洗与智能类型转换
          cat ruleA.txt ruleB.list \
            | sed '/^\s*$/d' \
            | grep -v '^#' \
            | sed -E 's/,(REJECT|reject|REJECT-DROP|reject-drop)//gI' \
            | sed 's/,extended-matching//g; s/,pre-matching//g; s/,no-resolve//g' \
            | sed 's/[[:space:]]//g' \
            | awk -F',' '
              BEGIN { OFS="," }
              {
                if ($1 == "DOMAIN") {
                  split($2, parts, ".");
                  if (length(parts) == 2) {
                    $1 = "DOMAIN-SUFFIX"
                  }
                }
                print $0
              }' \
            | awk '!seen[$0]++' \
            > rules.cleaned

          # 2. 深度优化逻辑：移除冗余规则
          awk -F',' '
          {
            rules[NR] = $0
            type[NR]  = $1
            val[NR]   = $2
            if ($1 == "DOMAIN-SUFFIX") suffix_list[$2] = 1
          }
          END {
            for (i = 1; i <= NR; i++) {
              skip = 0
              if (type[i] == "DOMAIN") {
                for (s in suffix_list) {
                  if (val[i] == s || val[i] ~ ("\\." s "$")) {
                    skip = 1
                    break
                  }
                }
              } else if (type[i] == "DOMAIN-SUFFIX") {
                for (s in suffix_list) {
                  if (val[i] != s && val[i] ~ ("\\." s "$")) {
                    skip = 1
                    break
                  }
                }
              }
              if (!skip) print rules[i]
            }
          }' rules.cleaned > rules.optimized

          # 3. 生成各格式文件
          # Surge 格式
          SURGE_OUT="ads-latest.txt"
          echo "# Auto merged Surge rules (${DATE})" > "$SURGE_OUT"
          awk -F',' '
          {
            split($2, d, ".");
            root = d[length(d)-1] "." d[length(d)];
            print root "\t" $0
          }' rules.optimized \
            | sort -k1,1 \
            | cut -f2- >> "$SURGE_OUT"

          # MosDNS 格式
          MOSDNS_OUT="ads-mosdns.txt"
          echo "# Auto merged MosDNS rules (${DATE})" > "$MOSDNS_OUT"
          awk -F',' '{
            if ($1 == "DOMAIN-SUFFIX") print "domain:" $2
            else if ($1 == "DOMAIN") print "full:" $2
            else if ($1 == "DOMAIN-KEYWORD") print "keyword:" $2
          }' rules.optimized >> "$MOSDNS_OUT"

          # Quantumult X 格式
          QX_OUT="ads-qx.snippet"
          echo "# Auto merged Quantumult X rules (${DATE})" > "$QX_OUT"
          awk -F',' '{
            if ($1 == "DOMAIN-SUFFIX") print "host-suffix, " $2 ", reject"
            else if ($1 == "DOMAIN") print "host, " $2 ", reject"
            else if ($1 == "DOMAIN-KEYWORD") print "host-keyword, " $2 ", reject"
          }' rules.optimized >> "$QX_OUT"

          # sing-box JSON & SRS 格式
          SINGBOX_JSON="ads-singbox.json"
          SINGBOX_SRS="ads.srs"
          awk -F',' '
          {
            if ($1 == "DOMAIN-SUFFIX") suffix[s++] = "\"" $2 "\""
            else if ($1 == "DOMAIN") full[f++] = "\"" $2 "\""
            else if ($1 == "DOMAIN-KEYWORD") keyword[k++] = "\"" $2 "\""
          }
          END {
            print "{"
            print "  \"version\": 1,"
            print "  \"rules\": ["
            print "    {"

            first_block = 1

            if (s > 0) {
              printf "      \"domain_suffix\": ["
              for (i = 0; i < s; i++) printf "%s%s", (i > 0 ? ", " : ""), suffix[i]
              printf "]"
              first_block = 0
            }

            if (f > 0) {
              if (!first_block) print ","
              printf "      \"domain\": ["
              for (i = 0; i < f; i++) printf "%s%s", (i > 0 ? ", " : ""), full[i]
              printf "]"
              first_block = 0
            }

            if (k > 0) {
              if (!first_block) print ","
              printf "      \"domain_keyword\": ["
              for (i = 0; i < k; i++) printf "%s%s", (i > 0 ? ", " : ""), keyword[i]
              printf "]"
            }

            print ""
            print "    }"
            print "  ]"
            print "}"
          }' rules.optimized > "$SINGBOX_JSON"

          # 编译成 sing-box SRS 二进制规则集
          sing-box rule-set compile "$SINGBOX_JSON" -o "$SINGBOX_SRS"

          # Clash Meta / Mihomo MRS 格式
          CLASH_YAML="ads-clash.yaml"
          CLASH_MRS="ads.mrs"
          echo "payload:" > "$CLASH_YAML"
          awk -F',' '{
            if ($1 == "DOMAIN-SUFFIX") print "  - DOMAIN-SUFFIX," $2
            else if ($1 == "DOMAIN") print "  - DOMAIN," $2
            else if ($1 == "DOMAIN-KEYWORD") print "  - DOMAIN-KEYWORD," $2
          }' rules.optimized >> "$CLASH_YAML"

          # 编译成 Clash Meta MRS 二进制规则集
          mihomo convert-ruleset domain yaml "$CLASH_YAML" "$CLASH_MRS"

      - name: Commit and Push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add ads-latest.txt ads-mosdns.txt ads-qx.snippet ads-singbox.json ads.srs ads-clash.yaml ads.mrs
          
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit and push."
          else
            git commit -m "Update rules: Add clash mrs format and cache binary dependencies (${DATE}) [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
