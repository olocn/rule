name: ads-rules
on:
  push:
    branches:
      - master
    paths:
      - 'ad.txt'
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ads-rules
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONUNBUFFERED: "1"
    steps:
      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      # ==========================================================
      # 2. Prepare
      # ==========================================================
      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          echo "Python:"
          python3 --version
          echo "Curl:"
          curl --version | head -n 1
      # ==========================================================
      # 3. Download source rules
      # ==========================================================
      - name: Download source rules
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================"
          echo "Downloading source 1"
          echo "========================================"
          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 180 \
            -o .tmp/source-1.txt \
            "https://raw.githubusercontent.com/olocn/rule/refs/heads/master/ad.txt"
          echo "========================================"
          echo "Downloading source 2"
          echo "========================================"
          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 180 \
            -o .tmp/source-2.txt \
            "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list"
          test -s .tmp/source-1.txt
          test -s .tmp/source-2.txt
          echo
          echo "Source 1 lines: $(wc -l < .tmp/source-1.txt)"
          echo "Source 2 lines: $(wc -l < .tmp/source-2.txt)"
      # ==========================================================
      # 4. Python processing
      # ==========================================================
      - name: Process rules
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          from datetime import date
          import re
          # ======================================================
          # Configuration
          # ======================================================
          SOURCE_1 = Path(".tmp/source-1.txt")
          SOURCE_2 = Path(".tmp/source-2.txt")
          OUTPUT_SURGE = Path("ads-latest.txt")
          OUTPUT_MOSDNS = Path("ads-mosdns.txt")
          OUTPUT_QX = Path("ads-qx.snippet")
          VALID_TYPES = {
              "DOMAIN",
              "DOMAIN-SUFFIX",
              "DOMAIN-KEYWORD",
              "DOMAIN-SET",
          }
          # ======================================================
          # Hidden Unicode characters
          # ======================================================
          HIDDEN_CHARS = dict.fromkeys([
              "\ufeff",
              "\u200b",
              "\u200c",
              "\u200d",
              "\u2060",
              "\u00ad",
              "\u200e",
              "\u200f",
              "\u202a",
              "\u202b",
              "\u202c",
              "\u202d",
              "\u202e",
              "\u2066",
              "\u2067",
              "\u2068",
              "\u2069",
          ], None)
          # ======================================================
          # Domain validation
          # ======================================================
          DOMAIN_RE = re.compile(
              r"^(?=.{1,253}$)"
              r"(?:[a-z0-9]"
              r"(?:[a-z0-9-]{0,61}[a-z0-9])?"
              r"\.)*"
              r"[a-z0-9]"
              r"(?:[a-z0-9-]{0,61}[a-z0-9])?$",
              re.IGNORECASE,
          )
          IPV4_RE = re.compile(
              r"^(?:\d{1,3}\.){3}\d{1,3}$"
          )
          # ======================================================
          # Text cleanup
          # ======================================================
          def clean_text(text: str) -> str:
              text = text.translate(HIDDEN_CHARS)
              # Remove comments.
              text = re.sub(r"\s*#.*$", "", text)
              return text.strip()
          def normalize_value(value: str) -> str:
              value = clean_text(value)
              value = value.strip().lower()
              value = value.strip(".")
              return value
          # ======================================================
          # IP / CIDR detection
          # ======================================================
          def is_ip_or_cidr(value: str) -> bool:
              if "/" in value:
                  return True
              if IPV4_RE.fullmatch(value):
                  return True
              if ":" in value:
                  return True
              return False
          # ======================================================
          # Domain detection
          # ======================================================
          def is_domain(value: str) -> bool:
              if not value:
                  return False
              if is_ip_or_cidr(value):
                  return False
              if any(ch.isspace() for ch in value):
                  return False
              return bool(DOMAIN_RE.fullmatch(value))
          # ======================================================
          # Parse Source 1
          # ======================================================
          #
          # Source 1 is a plain domain list.
          #
          # example:
          #
          # example.com
          # ad.example.com
          #
          # becomes:
          #
          # DOMAIN-SUFFIX,example.com
          # DOMAIN-SUFFIX,ad.example.com
          #
          # ======================================================
          def parse_source_1(line: str):
              line = clean_text(line)
              if not line:
                  return None
              # Source 1 should be plain domain only.
              #
              # Ignore anything that already looks like a rule.
              if "," in line:
                  return None
              value = normalize_value(line)
              if not is_domain(value):
                  return None
              return "DOMAIN-SUFFIX", value
          # ======================================================
          # Parse Source 2
          # ======================================================
          def parse_source_2(line: str):
              line = clean_text(line)
              if not line:
                  return None
              if line.startswith("#"):
                  return None
              parts = line.split(",", 1)
              if len(parts) != 2:
                  return None
              rule_type = parts[0].strip().upper()
              value = normalize_value(parts[1])
              if rule_type not in VALID_TYPES:
                  return None
              if not value:
                  return None
              if "," in value:
                  return None
              if any(ch.isspace() for ch in value):
                  return None
              return rule_type, value
          # ======================================================
          # DOMAIN-SUFFIX coverage
          # ======================================================
          def suffix_covers(domain: str, suffix: str) -> bool:
              if not is_domain(domain):
                  return False
              if not is_domain(suffix):
                  return False
              return (
                  domain == suffix
                  or domain.endswith("." + suffix)
              )
          # ======================================================
          # Parent suffix detection
          # ======================================================
          def has_parent_suffix(
              domain: str,
              suffix_set: set[str],
          ) -> bool:
              if not is_domain(domain):
                  return False
              parts = domain.split(".")
              if len(parts) < 2:
                  return False
              for i in range(1, len(parts)):
                  parent = ".".join(parts[i:])
                  if parent in suffix_set:
                      return True
              return False
          # ======================================================
          # 1. Read Source 1
          # ======================================================
          source1_rules = []
          source1_total = 0
          source1_valid = 0
          print()
          print("=" * 40)
          print(f"Processing source 1: {SOURCE_1}")
          print("=" * 40)
          with SOURCE_1.open(
              "r",
              encoding="utf-8",
              errors="replace",
          ) as f:
              for raw_line in f:
                  source1_total += 1
                  rule = parse_source_1(raw_line)
                  if rule is None:
                      continue
                  source1_rules.append(rule)
                  source1_valid += 1
          print(
              f"Source 1 total lines : {source1_total}"
          )
          print(
              f"Source 1 domains     : {source1_valid}"
          )
          # ======================================================
          # 2. Read Source 2
          # ======================================================
          source2_rules = []
          source2_total = 0
          source2_valid = 0
          print()
          print("=" * 40)
          print(f"Processing source 2: {SOURCE_2}")
          print("=" * 40)
          with SOURCE_2.open(
              "r",
              encoding="utf-8",
              errors="replace",
          ) as f:
              for raw_line in f:
                  source2_total += 1
                  rule = parse_source_2(raw_line)
                  if rule is None:
                      continue
                  source2_rules.append(rule)
                  source2_valid += 1
          print(
              f"Source 2 total lines : {source2_total}"
          )
          print(
              f"Source 2 valid rules : {source2_valid}"
          )
          # ======================================================
          # 3. Merge
          # ======================================================
          parsed_rules = (
              source1_rules +
              source2_rules
          )
          print()
          print(
              f"Total parsed rules : {len(parsed_rules)}"
          )
          # ======================================================
          # 4. Exact duplicate removal
          # ======================================================
          unique_rules = []
          seen = set()
          for rule in parsed_rules:
              if rule in seen:
                  continue
              seen.add(rule)
              unique_rules.append(rule)
          print(
              f"After exact dedup   : {len(unique_rules)}"
          )
          # ======================================================
          # 5. Collect DOMAIN-SUFFIX
          # ======================================================
          all_suffixes = {
              value
              for rule_type, value in unique_rules
              if rule_type == "DOMAIN-SUFFIX"
              and is_domain(value)
          }
          # ======================================================
          # 6. Remove redundant child suffixes
          # ======================================================
          surviving_suffixes = set()
          for suffix in sorted(
              all_suffixes,
              key=lambda x: (x.count("."), x),
          ):
              if has_parent_suffix(
                  suffix,
                  surviving_suffixes,
              ):
                  continue
              surviving_suffixes.add(suffix)
          print()
          print(
              f"DOMAIN-SUFFIX before : "
              f"{len(all_suffixes)}"
          )
          print(
              f"DOMAIN-SUFFIX after  : "
              f"{len(surviving_suffixes)}"
          )
          # ======================================================
          # 7. Semantic cross-type dedup
          # ======================================================
          #
          # DOMAIN-SUFFIX covers:
          #
          # DOMAIN
          # DOMAIN-SET
          # child DOMAIN-SUFFIX
          #
          # DOMAIN-KEYWORD is always retained.
          #
          # ======================================================
          final_rules = []
          removed_domain = 0
          removed_domain_set = 0
          removed_suffix = 0
          for rule_type, value in unique_rules:
              # --------------------------------------------------
              # DOMAIN-SUFFIX
              # --------------------------------------------------
              if rule_type == "DOMAIN-SUFFIX":
                  if value not in surviving_suffixes:
                      removed_suffix += 1
                      continue
                  final_rules.append(
                      (rule_type, value)
                  )
                  continue
              # --------------------------------------------------
              # DOMAIN
              # --------------------------------------------------
              if rule_type == "DOMAIN":
                  if is_domain(value):
                      covered = any(
                          suffix_covers(
                              value,
                              suffix,
                          )
                          for suffix in surviving_suffixes
                      )
                      if covered:
                          removed_domain += 1
                          continue
                  final_rules.append(
                      (rule_type, value)
                  )
                  continue
              # --------------------------------------------------
              # DOMAIN-SET
              # --------------------------------------------------
              if rule_type == "DOMAIN-SET":
                  if is_domain(value):
                      covered = any(
                          suffix_covers(
                              value,
                              suffix,
                          )
                          for suffix in surviving_suffixes
                      )
                      if covered:
                          removed_domain_set += 1
                          continue
                  final_rules.append(
                      (rule_type, value)
                  )
                  continue
              # --------------------------------------------------
              # DOMAIN-KEYWORD
              # --------------------------------------------------
              if rule_type == "DOMAIN-KEYWORD":
                  final_rules.append(
                      (rule_type, value)
                  )
                  continue
          # ======================================================
          # 8. Stable sorting
          # ======================================================
          TYPE_ORDER = {
              "DOMAIN": 0,
              "DOMAIN-SUFFIX": 1,
              "DOMAIN-KEYWORD": 2,
              "DOMAIN-SET": 3,
          }
          final_rules.sort(
              key=lambda rule: (
                  TYPE_ORDER[rule[0]],
                  rule[1],
              )
          )
          # ======================================================
          # 9. Final exact duplicate safety
          # ======================================================
          checked_rules = []
          final_seen = set()
          for rule in final_rules:
              if rule in final_seen:
                  continue
              final_seen.add(rule)
              checked_rules.append(rule)
          final_rules = checked_rules
          # ======================================================
          # 10. Statistics
          # ======================================================
          print()
          print("=" * 40)
          print("Deduplication statistics")
          print("=" * 40)
          print(
              f"Final rules        : {len(final_rules)}"
          )
          print(
              f"Removed DOMAIN     : {removed_domain}"
          )
          print(
              f"Removed DOMAIN-SET : {removed_domain_set}"
          )
          print(
              f"Removed SUFFIX     : {removed_suffix}"
          )
          # ======================================================
          # 11. Generate Surge
          # ======================================================
          surge_lines = [
              f"# Auto merged Surge rules "
              f"({date.today().isoformat()})"
          ]
          for rule_type, value in final_rules:
              surge_lines.append(
                  f"{rule_type},{value}"
              )
          # ======================================================
          # 12. Generate MosDNS
          # ======================================================
          mosdns_lines = []
          for rule_type, value in final_rules:
              if rule_type == "DOMAIN":
                  mosdns_lines.append(
                      f"full:{value}"
                  )
              elif rule_type == "DOMAIN-SUFFIX":
                  mosdns_lines.append(
                      f"domain:{value}"
                  )
              elif rule_type == "DOMAIN-KEYWORD":
                  mosdns_lines.append(
                      f"keyword:{value}"
                  )
              elif rule_type == "DOMAIN-SET":
                  mosdns_lines.append(
                      f"full:{value}"
                  )
          # ======================================================
          # 13. Generate Quantumult X
          # ======================================================
          qx_lines = []
          for rule_type, value in final_rules:
              if rule_type == "DOMAIN":
                  qx_lines.append(
                      f"host,{value},reject"
                  )
              elif rule_type == "DOMAIN-SUFFIX":
                  qx_lines.append(
                      f"host-suffix,{value},reject"
                  )
              elif rule_type == "DOMAIN-KEYWORD":
                  qx_lines.append(
                      f"host-keyword,{value},reject"
                  )
              elif rule_type == "DOMAIN-SET":
                  qx_lines.append(
                      f"host,{value},reject"
                  )
          # ======================================================
          # 14. Atomic write
          # ======================================================
          def atomic_write(path: Path, lines):
              tmp = path.with_suffix(
                  path.suffix + ".tmp"
              )
              data = "\n".join(lines) + "\n"
              tmp.write_text(
                  data,
                  encoding="utf-8",
                  newline="\n",
              )
              tmp.replace(path)
          atomic_write(
              OUTPUT_SURGE,
              surge_lines,
          )
          atomic_write(
              OUTPUT_MOSDNS,
              mosdns_lines,
          )
          atomic_write(
              OUTPUT_QX,
              qx_lines,
          )
          # ======================================================
          # 15. Explicit coverage test
          # ======================================================
          print()
          print("=" * 40)
          print("Coverage test")
          print("=" * 40)
          test_domain = "ad.life.360.cn"
          covering_suffixes = sorted(
              suffix
              for suffix in surviving_suffixes
              if suffix_covers(
                  test_domain,
                  suffix,
              )
          )
          print(
              f"DOMAIN,{test_domain}"
          )
          if covering_suffixes:
              print("Covered by:")
              for suffix in covering_suffixes:
                  print(
                      f"  DOMAIN-SUFFIX,{suffix}"
                  )
          else:
              print(
                  "No DOMAIN-SUFFIX coverage"
              )
          # ======================================================
          # 16. Final output statistics
          # ======================================================
          print()
          print("=" * 40)
          print("Generated files")
          print("=" * 40)
          print(
              f"{OUTPUT_SURGE}: "
              f"{len(surge_lines) - 1} rules"
          )
          print(
              f"{OUTPUT_MOSDNS}: "
              f"{len(mosdns_lines)} rules"
          )
          print(
              f"{OUTPUT_QX}: "
              f"{len(qx_lines)} rules"
          )
          PY
      # ==========================================================
      # 5. Validate Surge
      # ==========================================================
      - name: Validate Surge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("ads-latest.txt")
          if not path.exists():
              raise SystemExit(
                  "ads-latest.txt not found"
              )
          rule_re = re.compile(
              r"^(DOMAIN|DOMAIN-SUFFIX|DOMAIN-KEYWORD|DOMAIN-SET),"
              r"[^,\s]+$"
          )
          seen = set()
          count = 0
          for line_no, raw in enumerate(
              path.read_text(
                  encoding="utf-8"
              ).splitlines(),
              1,
          ):
              line = raw.strip()
              if not line:
                  continue
              if line.startswith("#"):
                  continue
              if not rule_re.fullmatch(line):
                  raise SystemExit(
                      f"Invalid Surge rule at line "
                      f"{line_no}: {line}"
                  )
              if line in seen:
                  raise SystemExit(
                      f"Duplicate Surge rule at line "
                      f"{line_no}: {line}"
                  )
              seen.add(line)
              count += 1
              if any(
                  ord(ch) > 127
                  for ch in line
              ):
                  raise SystemExit(
                      f"Non-ASCII character at line "
                      f"{line_no}: {line}"
                  )
          if count == 0:
              raise SystemExit(
                  "No Surge rules generated"
              )
          print(
              f"Surge validation OK: {count} rules"
          )
          PY
      # ==========================================================
      # 6. Validate MosDNS
      # ==========================================================
      - name: Validate MosDNS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("ads-mosdns.txt")
          if not path.exists():
              raise SystemExit(
                  "ads-mosdns.txt not found"
              )
          rule_re = re.compile(
              r"^(domain|full|keyword):\S+$"
          )
          seen = set()
          count = 0
          for line_no, raw in enumerate(
              path.read_text(
                  encoding="utf-8"
              ).splitlines(),
              1,
          ):
              line = raw.strip()
              if not line:
                  continue
              if not rule_re.fullmatch(line):
                  raise SystemExit(
                      f"Invalid MosDNS rule at line "
                      f"{line_no}: {line}"
                  )
              if line in seen:
                  raise SystemExit(
                      f"Duplicate MosDNS rule at line "
                      f"{line_no}: {line}"
                  )
              seen.add(line)
              count += 1
          if count == 0:
              raise SystemExit(
                  "No MosDNS rules generated"
              )
          print(
              f"MosDNS validation OK: {count} rules"
          )
          PY
      # ==========================================================
      # 7. Validate Quantumult X
      # ==========================================================
      - name: Validate Quantumult X
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("ads-qx.snippet")
          if not path.exists():
              raise SystemExit(
                  "ads-qx.snippet not found"
              )
          rule_re = re.compile(
              r"^host(-suffix|-keyword)?,"
              r"[^,\s]+,reject$"
          )
          seen = set()
          count = 0
          for line_no, raw in enumerate(
              path.read_text(
                  encoding="utf-8"
              ).splitlines(),
              1,
          ):
              line = raw.strip()
              if not line:
                  continue
              if not rule_re.fullmatch(line):
                  raise SystemExit(
                      f"Invalid QX rule at line "
                      f"{line_no}: {line}"
                  )
              if line in seen:
                  raise SystemExit(
                      f"Duplicate QX rule at line "
                      f"{line_no}: {line}"
                  )
              seen.add(line)
              count += 1
          if count == 0:
              raise SystemExit(
                  "No QX rules generated"
              )
          print(
              f"Quantumult X validation OK: {count} rules"
          )
          PY
      # ==========================================================
      # 8. Statistics
      # ==========================================================
      - name: Show statistics
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================"
          echo "Generated statistics"
          echo "========================================"
          echo
          echo "Surge:"
          grep -v '^#' ads-latest.txt | wc -l
          echo
          echo "MosDNS:"
          wc -l < ads-mosdns.txt
          echo
          echo "Quantumult X:"
          wc -l < ads-qx.snippet
          echo
          echo "Rule type statistics:"
          grep -v '^#' ads-latest.txt \
            | cut -d',' -f1 \
            | sort \
            | uniq -c \
            || true
      # ==========================================================
      # 9. Preview
      # ==========================================================
      - name: Preview
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================"
          echo "Surge preview"
          echo "========================================"
          head -n 20 ads-latest.txt
          echo
          echo "========================================"
          echo "MosDNS preview"
          echo "========================================"
          head -n 20 ads-mosdns.txt
          echo
          echo "========================================"
          echo "Quantumult X preview"
          echo "========================================"
          head -n 20 ads-qx.snippet
      # ==========================================================
      # 10. Cleanup
      # ==========================================================
      - name: Cleanup
        shell: bash
        run: |
          rm -rf .tmp
      # ==========================================================
      # 11. Commit and push only when changed
      # ==========================================================
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name \
            "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ads-latest.txt \
            ads-mosdns.txt \
            ads-qx.snippet
          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi
          echo "Changes detected:"
          git diff --cached --stat
          git commit \
            -m "chore: update ad rules"
          git push
