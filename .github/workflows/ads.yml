name: ads-rules

on:
  push:
    branches:
      - master
    paths:
      - 'ad.txt'

  schedule:
    - cron: '0 */12 * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ads-rules
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONUNBUFFERED: "1"

    steps:
      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # ==========================================================
      # 2. Prepare
      # ==========================================================
      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .tmp

          python3 --version
          curl --version | head -n 1

      # ==========================================================
      # 3. Download source rules
      # ==========================================================
      - name: Download source rules
        shell: bash
        run: |
          set -euo pipefail

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 180 \
            -o .tmp/source-1.txt \
            "https://raw.githubusercontent.com/olocn/rule/refs/heads/master/surge/ad.txt"

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 180 \
            -o .tmp/source-2.txt \
            "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list"

          test -s .tmp/source-1.txt
          test -s .tmp/source-2.txt

          echo "Source 1: $(wc -l < .tmp/source-1.txt) lines"
          echo "Source 2: $(wc -l < .tmp/source-2.txt) lines"

      # ==========================================================
      # 4. Python merge / semantic dedup / generate
      # ==========================================================
      - name: Process rules
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          # ======================================================
          # Configuration
          # ======================================================

          SOURCES = [
              Path(".tmp/source-1.txt"),
              Path(".tmp/source-2.txt"),
          ]

          OUTPUT_SURGE = Path("ads-latest.txt")
          OUTPUT_MOSDNS = Path("ads-mosdns.txt")
          OUTPUT_QX = Path("ads-qx.snippet")

          VALID_TYPES = {
              "DOMAIN",
              "DOMAIN-SUFFIX",
              "DOMAIN-KEYWORD",
              "DOMAIN-SET",
          }

          # Invisible / hidden Unicode characters that should not
          # survive into the generated rule files.
          HIDDEN_CHARS = dict.fromkeys([
              "\ufeff",
              "\u200b",
              "\u200c",
              "\u200d",
              "\u2060",
              "\u00ad",
              "\u200e",
              "\u200f",
              "\u202a",
              "\u202b",
              "\u202c",
              "\u202d",
              "\u202e",
              "\u2066",
              "\u2067",
              "\u2068",
              "\u2069",
          ], None)

          COMMENT_RE = re.compile(r"\s*#.*$")

          # Domain-like value.
          # Deliberately excludes IP/CIDR from semantic domain
          # containment checks.
          DOMAIN_RE = re.compile(
              r"^(?=.{1,253}$)"
              r"(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)*"
              r"[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$",
              re.IGNORECASE,
          )

          IPV4_RE = re.compile(
              r"^(?:\d{1,3}\.){3}\d{1,3}$"
          )

          IPV6_RE = re.compile(r":")

          # ======================================================
          # Helpers
          # ======================================================

          def clean_text(text: str) -> str:
              text = text.translate(HIDDEN_CHARS)
              text = COMMENT_RE.sub("", text)
              return text.strip()


          def normalize_value(value: str) -> str:
              value = clean_text(value)
              value = value.strip().lower()

              # Remove only surrounding dots.
              value = value.strip(".")

              return value


          def is_ip_or_cidr(value: str) -> bool:
              """
              CIDR/IP is intentionally excluded from all semantic
              domain containment logic.
              """
              if "/" in value:
                  return True

              if IPV4_RE.fullmatch(value):
                  return True

              if IPV6_RE.search(value):
                  return True

              return False


          def is_domain(value: str) -> bool:
              if not value:
                  return False

              if is_ip_or_cidr(value):
                  return False

              if any(ch.isspace() for ch in value):
                  return False

              return bool(DOMAIN_RE.fullmatch(value))


          def parse_rule(line: str):
              line = clean_text(line)

              if not line:
                  return None

              # Ignore ordinary comments.
              if line.startswith("#"):
                  return None

              parts = line.split(",", 1)

              if len(parts) != 2:
                  return None

              rule_type = parts[0].strip().upper()
              value = normalize_value(parts[1])

              if rule_type not in VALID_TYPES:
                  return None

              if not value:
                  return None

              # Do not allow embedded comma or whitespace.
              if "," in value:
                  return None

              if any(ch.isspace() for ch in value):
                  return None

              return rule_type, value


          def suffix_covers(domain: str, suffix: str) -> bool:
              """
              DOMAIN-SUFFIX semantics:

                  example.com
                  ├── example.com
                  ├── www.example.com
                  └── a.b.example.com

              Therefore both exact match and subdomains are covered.
              """

              if not is_domain(domain):
                  return False

              if not is_domain(suffix):
                  return False

              return (
                  domain == suffix
                  or domain.endswith("." + suffix)
              )


          def has_parent_suffix(domain: str, suffix_set: set[str]) -> bool:
              """
              Determine whether `domain` is covered by a MORE GENERAL
              DOMAIN-SUFFIX rule.

              Example:

                  ad.life.360.cn

              checks:

                  life.360.cn
                  360.cn
                  cn

              If 360.cn exists, the specific rule is redundant.

              This is O(number of labels), not O(number of rules).
              """

              if not is_domain(domain):
                  return False

              parts = domain.split(".")

              # Need at least one parent.
              if len(parts) < 2:
                  return False

              # Start from immediate parent.
              for i in range(1, len(parts)):
                  parent = ".".join(parts[i:])

                  if parent in suffix_set:
                      return True

              return False


          # ======================================================
          # 1. Parse all sources
          # ======================================================

          parsed = []

          total_lines = 0
          valid_lines = 0

          for source in SOURCES:
              with source.open("r", encoding="utf-8", errors="replace") as f:
                  for raw_line in f:
                      total_lines += 1

                      rule = parse_rule(raw_line)

                      if rule is not None:
                          parsed.append(rule)
                          valid_lines += 1

          print(f"Total source lines : {total_lines}")
          print(f"Valid rules        : {valid_lines}")


          # ======================================================
          # 2. Exact duplicate removal
          # ======================================================

          unique_rules = []
          seen = set()

          for rule in parsed:
              if rule in seen:
                  continue

              seen.add(rule)
              unique_rules.append(rule)

          print(f"After exact dedup   : {len(unique_rules)}")


          # ======================================================
          # 3. Collect DOMAIN-SUFFIX
          # ======================================================

          suffix_domains = {
              value
              for rule_type, value in unique_rules
              if rule_type == "DOMAIN-SUFFIX"
              and is_domain(value)
          }


          # ======================================================
          # 4. Remove redundant DOMAIN-SUFFIX children
          # ======================================================
          #
          # Example:
          #
          # DOMAIN-SUFFIX,360.cn
          # DOMAIN-SUFFIX,life.360.cn
          #
          # Keep only:
          #
          # DOMAIN-SUFFIX,360.cn
          #
          # Because 360.cn already covers life.360.cn.
          #
          # ======================================================

          surviving_suffixes = set()

          for suffix in sorted(
              suffix_domains,
              key=lambda x: (x.count("."), x)
          ):
              if has_parent_suffix(suffix, surviving_suffixes):
                  continue

              surviving_suffixes.add(suffix)


          print(
              f"DOMAIN-SUFFIX before : {len(suffix_domains)}"
          )

          print(
              f"DOMAIN-SUFFIX after  : {len(surviving_suffixes)}"
          )


          # ======================================================
          # 5. Semantic cross-type dedup
          # ======================================================
          #
          # IMPORTANT:
          #
          # DOMAIN-SUFFIX can cover:
          #
          #   DOMAIN
          #   DOMAIN-SET
          #   more-specific DOMAIN-SUFFIX
          #
          # DOMAIN-KEYWORD NEVER participates.
          #
          # DOMAIN itself NEVER covers another rule.
          #
          # DOMAIN-SET itself NEVER covers another rule.
          #
          # ======================================================

          final_rules = []

          removed_domain = 0
          removed_domain_set = 0
          removed_suffix = 0

          for rule_type, value in unique_rules:

              if rule_type == "DOMAIN-SUFFIX":

                  # Keep only the non-redundant suffixes.
                  if value not in surviving_suffixes:
                      removed_suffix += 1
                      continue

                  final_rules.append((rule_type, value))
                  continue


              if rule_type == "DOMAIN":

                  if is_domain(value):
                      if any(
                          suffix_covers(value, suffix)
                          for suffix in surviving_suffixes
                      ):
                          removed_domain += 1
                          continue

                  final_rules.append((rule_type, value))
                  continue


              if rule_type == "DOMAIN-SET":

                  if is_domain(value):
                      if any(
                          suffix_covers(value, suffix)
                          for suffix in surviving_suffixes
                      ):
                          removed_domain_set += 1
                          continue

                  final_rules.append((rule_type, value))
                  continue


              # DOMAIN-KEYWORD:
              #
              # ALWAYS KEEP.
              #
              # It has completely different matching semantics.
              #
              if rule_type == "DOMAIN-KEYWORD":
                  final_rules.append((rule_type, value))
                  continue


          # ======================================================
          # 6. Stable sort
          # ======================================================

          TYPE_ORDER = {
              "DOMAIN": 0,
              "DOMAIN-SUFFIX": 1,
              "DOMAIN-KEYWORD": 2,
              "DOMAIN-SET": 3,
          }

          final_rules.sort(
              key=lambda x: (
                  TYPE_ORDER[x[0]],
                  x[1],
              )
          )


          # ======================================================
          # 7. Final exact duplicate safety check
          # ======================================================

          checked = []
          final_seen = set()

          for rule in final_rules:
              if rule in final_seen:
                  continue

              final_seen.add(rule)
              checked.append(rule)

          final_rules = checked


          print(f"Final rules        : {len(final_rules)}")
          print(f"Removed DOMAIN     : {removed_domain}")
          print(f"Removed DOMAIN-SET : {removed_domain_set}")
          print(f"Removed SUFFIX     : {removed_suffix}")


          # ======================================================
          # 8. Generate Surge
          # ======================================================

          from datetime import date

          header = (
              f"# Auto merged Surge rules ({date.today().isoformat()})"
          )

          surge_lines = [header]

          for rule_type, value in final_rules:
              surge_lines.append(f"{rule_type},{value}")


          # ======================================================
          # 9. Generate MosDNS
          # ======================================================

          mosdns_lines = []

          for rule_type, value in final_rules:

              if rule_type == "DOMAIN":
                  mosdns_lines.append(f"full:{value}")

              elif rule_type == "DOMAIN-SUFFIX":
                  mosdns_lines.append(f"domain:{value}")

              elif rule_type == "DOMAIN-KEYWORD":
                  mosdns_lines.append(f"keyword:{value}")

              elif rule_type == "DOMAIN-SET":
                  mosdns_lines.append(f"full:{value}")


          # ======================================================
          # 10. Generate Quantumult X
          # ======================================================

          qx_lines = []

          for rule_type, value in final_rules:

              if rule_type == "DOMAIN":
                  qx_lines.append(
                      f"host,{value},reject"
                  )

              elif rule_type == "DOMAIN-SUFFIX":
                  qx_lines.append(
                      f"host-suffix,{value},reject"
                  )

              elif rule_type == "DOMAIN-KEYWORD":
                  qx_lines.append(
                      f"host-keyword,{value},reject"
                  )

              elif rule_type == "DOMAIN-SET":
                  qx_lines.append(
                      f"host,{value},reject"
                  )


          # ======================================================
          # 11. Atomic output
          # ======================================================

          def atomic_write(path: Path, lines):
              tmp = path.with_suffix(path.suffix + ".tmp")

              data = "\n".join(lines) + "\n"

              tmp.write_text(
                  data,
                  encoding="utf-8",
                  newline="\n",
              )

              tmp.replace(path)


          atomic_write(
              OUTPUT_SURGE,
              surge_lines,
          )

          atomic_write(
              OUTPUT_MOSDNS,
              mosdns_lines,
          )

          atomic_write(
              OUTPUT_QX,
              qx_lines,
          )


          # ======================================================
          # 12. Show important example
          # ======================================================

          target = "ad.life.360.cn"

          print()
          print("Coverage check:")
          print(f"  DOMAIN,{target}")

          covering = [
              suffix
              for suffix in surviving_suffixes
              if suffix_covers(target, suffix)
          ]

          if covering:
              print(
                  "  Covered by DOMAIN-SUFFIX:"
              )

              for suffix in sorted(covering):
                  print(
                      f"    DOMAIN-SUFFIX,{suffix}"
                  )

          print()
          print("Generated:")
          print(f"  {OUTPUT_SURGE}")
          print(f"  {OUTPUT_MOSDNS}")
          print(f"  {OUTPUT_QX}")

          PY

      # ==========================================================
      # 5. Validate Surge
      # ==========================================================
      - name: Validate Surge
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("ads-latest.txt")

          if not path.exists():
              raise SystemExit("ads-latest.txt not found")

          rule_re = re.compile(
              r"^(DOMAIN|DOMAIN-SUFFIX|DOMAIN-KEYWORD|DOMAIN-SET),"
              r"[^,[:space:]]+$"
          )

          seen = set()
          count = 0

          for line_no, raw in enumerate(
              path.read_text(encoding="utf-8").splitlines(),
              1
          ):
              line = raw.strip()

              if not line or line.startswith("#"):
                  continue

              if not rule_re.fullmatch(line):
                  raise SystemExit(
                      f"Invalid Surge rule at line {line_no}: {line}"
                  )

              if line in seen:
                  raise SystemExit(
                      f"Duplicate Surge rule at line {line_no}: {line}"
                  )

              seen.add(line)
              count += 1

              if any(ord(ch) > 127 for ch in line):
                  raise SystemExit(
                      f"Non-ASCII character at line {line_no}: {line}"
                  )

          if count == 0:
              raise SystemExit("No Surge rules generated")

          print(f"Surge validation OK: {count} rules")
          PY

      # ==========================================================
      # 6. Validate MosDNS
      # ==========================================================
      - name: Validate MosDNS
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("ads-mosdns.txt")

          rule_re = re.compile(
              r"^(domain|full|keyword):[^[:space:]]+$"
          )

          seen = set()
          count = 0

          for line_no, raw in enumerate(
              path.read_text(encoding="utf-8").splitlines(),
              1
          ):
              line = raw.strip()

              if not line:
                  continue

              if not rule_re.fullmatch(line):
                  raise SystemExit(
                      f"Invalid MosDNS rule at line {line_no}: {line}"
                  )

              if line in seen:
                  raise SystemExit(
                      f"Duplicate MosDNS rule at line {line_no}: {line}"
                  )

              seen.add(line)
              count += 1

          if count == 0:
              raise SystemExit("No MosDNS rules generated")

          print(f"MosDNS validation OK: {count} rules")
          PY

      # ==========================================================
      # 7. Validate Quantumult X
      # ==========================================================
      - name: Validate Quantumult X
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("ads-qx.snippet")

          rule_re = re.compile(
              r"^host(-suffix|-keyword)?,"
              r"[^,[:space:]]+,reject$"
          )

          seen = set()
          count = 0

          for line_no, raw in enumerate(
              path.read_text(encoding="utf-8").splitlines(),
              1
          ):
              line = raw.strip()

              if not line:
                  continue

              if not rule_re.fullmatch(line):
                  raise SystemExit(
                      f"Invalid QX rule at line {line_no}: {line}"
                  )

              if line in seen:
                  raise SystemExit(
                      f"Duplicate QX rule at line {line_no}: {line}"
                  )

              seen.add(line)
              count += 1

          if count == 0:
              raise SystemExit("No QX rules generated")

          print(f"Quantumult X validation OK: {count} rules")
          PY

      # ==========================================================
      # 8. Statistics
      # ==========================================================
      - name: Show statistics
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Generated statistics"
          echo "========================================"

          echo
          echo "Surge:"
          grep -v '^#' ads-latest.txt | wc -l

          echo
          echo "MosDNS:"
          wc -l < ads-mosdns.txt

          echo
          echo "Quantumult X:"
          wc -l < ads-qx.snippet

          echo
          echo "Rule type statistics:"
          grep -v '^#' ads-latest.txt \
            | cut -d',' -f1 \
            | sort \
            | uniq -c \
            || true

      # ==========================================================
      # 9. Preview
      # ==========================================================
      - name: Preview
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Surge preview"
          echo "========================================"

          head -n 20 ads-latest.txt

          echo
          echo "========================================"
          echo "MosDNS preview"
          echo "========================================"

          head -n 20 ads-mosdns.txt

          echo
          echo "========================================"
          echo "Quantumult X preview"
          echo "========================================"

          head -n 20 ads-qx.snippet

      # ==========================================================
      # 10. Cleanup
      # ==========================================================
      - name: Cleanup
        shell: bash
        run: |
          rm -rf .tmp

      # ==========================================================
      # 11. Commit and push only when changed
      # ==========================================================
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            ads-latest.txt \
            ads-mosdns.txt \
            ads-qx.snippet

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          echo "Changes detected:"
          git diff --cached --stat

          git commit -m "chore: update ad rules"

          git push
