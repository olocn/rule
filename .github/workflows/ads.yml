name: ads-rules

on:
  push:
    branches:
      - master
    paths:
      - 'ad.txt'
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ads-rules
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONUNBUFFERED: "1"

    steps:
      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # ==========================================================
      # 2. Download source rules
      # ==========================================================
      - name: Download source rules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp

          echo "Downloading source 1..."
          curl -fL --retry 5 --retry-delay 2 --retry-all-errors \
            --connect-timeout 15 --max-time 180 \
            -o .tmp/source-1.txt \
            "https://raw.githubusercontent.com/olocn/rule/refs/heads/master/ad.txt"

          echo "Downloading source 2..."
          curl -fL --retry 5 --retry-delay 2 --retry-all-errors \
            --connect-timeout 15 --max-time 180 \
            -o .tmp/source-2.txt \
            "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list"

          test -s .tmp/source-1.txt
          test -s .tmp/source-2.txt
          echo "Source 1 lines: $(wc -l < .tmp/source-1.txt)"
          echo "Source 2 lines: $(wc -l < .tmp/source-2.txt)"

      # ==========================================================
      # 3. Process rules
      # ==========================================================
      - name: Process rules
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          from datetime import date
          import re

          SOURCE_1 = Path(".tmp/source-1.txt")
          SOURCE_2 = Path(".tmp/source-2.txt")
          OUTPUT_SURGE = Path("ads-latest.txt")
          OUTPUT_MOSDNS = Path("ads-mosdns.txt")
          OUTPUT_QX = Path("ads-qx.snippet")

          VALID_TYPES = {"DOMAIN", "DOMAIN-SUFFIX", "DOMAIN-KEYWORD", "DOMAIN-SET"}
          TYPE_ORDER = {"DOMAIN": 0, "DOMAIN-SUFFIX": 1, "DOMAIN-KEYWORD": 2, "DOMAIN-SET": 3}

          HIDDEN_CHARS = dict.fromkeys([
              "\ufeff", "\u200b", "\u200c", "\u200d", "\u2060", "\u00ad",
              "\u200e", "\u200f", "\u202a", "\u202b", "\u202c", "\u202d",
              "\u202e", "\u2066", "\u2067", "\u2068", "\u2069",
          ], None)

          DOMAIN_RE = re.compile(
              r"^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)*[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$",
              re.IGNORECASE,
          )
          IPV4_RE = re.compile(r"^(?:\d{1,3}\.){3}\d{1,3}$")

          def clean_text(text: str) -> str:
              text = text.translate(HIDDEN_CHARS)
              text = re.sub(r"\s*#.*$", "", text)
              return text.strip()

          def normalize_value(value: str) -> str:
              return clean_text(value).strip().lower().strip(".")

          def is_ip_or_cidr(value: str) -> bool:
              return "/" in value or ":" in value or bool(IPV4_RE.fullmatch(value))

          def is_domain(value: str) -> bool:
              if not value or is_ip_or_cidr(value) or any(ch.isspace() for ch in value):
                  return False
              return bool(DOMAIN_RE.fullmatch(value))

          def parse_source_1(line: str):
              line = clean_text(line)
              if not line or "," in line:
                  return None
              value = normalize_value(line)
              return ("DOMAIN-SUFFIX", value) if is_domain(value) else None

          def parse_source_2(line: str):
              line = clean_text(line)
              if not line or line.startswith("#"):
                  return None
              parts = line.split(",", 1)
              if len(parts) != 2:
                  return None
              rule_type = parts[0].strip().upper()
              value = normalize_value(parts[1])
              if rule_type not in VALID_TYPES or not value:
                  return None
              if "," in value or any(ch.isspace() for ch in value):
                  return None
              return rule_type, value

          def has_parent_suffix(domain: str, suffix_set: set[str]) -> bool:
              parts = domain.split(".")
              for i in range(1, len(parts)):
                  if ".".join(parts[i:]) in suffix_set:
                      return True
              return False

          # 1. Read & Merge
          unique_rules = []
          seen = set()

          with SOURCE_1.open("r", encoding="utf-8", errors="replace") as f:
              for raw in f:
                  rule = parse_source_1(raw)
                  if rule and rule not in seen:
                      seen.add(rule)
                      unique_rules.append(rule)

          with SOURCE_2.open("r", encoding="utf-8", errors="replace") as f:
              for raw in f:
                  rule = parse_source_2(raw)
                  if rule and rule not in seen:
                      seen.add(rule)
                      unique_rules.append(rule)

          # 2. Prune redundant suffixes & domains
          all_suffixes = {val for r_type, val in unique_rules if r_type == "DOMAIN-SUFFIX" and is_domain(val)}
          surviving_suffixes = set()
          for suffix in sorted(all_suffixes, key=lambda x: (x.count("."), x)):
              if not has_parent_suffix(suffix, surviving_suffixes):
                  surviving_suffixes.add(suffix)

          final_rules = []
          removed_domain = 0
          for rule_type, value in unique_rules:
              if rule_type == "DOMAIN-SUFFIX":
                  if value in surviving_suffixes:
                      final_rules.append((rule_type, value))
              elif rule_type in ("DOMAIN", "DOMAIN-SET"):
                  if is_domain(value) and (value in surviving_suffixes or has_parent_suffix(value, surviving_suffixes)):
                      removed_domain += 1
                      continue
                  final_rules.append((rule_type, value))
              elif rule_type == "DOMAIN-KEYWORD":
                  final_rules.append((rule_type, value))

          final_rules.sort(key=lambda r: (TYPE_ORDER[r[0]], r[1]))

          # 3. Format outputs
          surge_lines = [f"# Auto merged Surge rules ({date.today().isoformat()})"]
          mosdns_lines = []
          qx_lines = []

          for rule_type, value in final_rules:
              surge_lines.append(f"{rule_type},{value}")
              if rule_type in ("DOMAIN", "DOMAIN-SET"):
                  mosdns_lines.append(f"full:{value}")
                  qx_lines.append(f"host,{value},reject")
              elif rule_type == "DOMAIN-SUFFIX":
                  mosdns_lines.append(f"domain:{value}")
                  qx_lines.append(f"host-suffix,{value},reject")
              elif rule_type == "DOMAIN-KEYWORD":
                  mosdns_lines.append(f"keyword:{value}")
                  qx_lines.append(f"host-keyword,{value},reject")

          # 4. Atomic write
          def atomic_write(path: Path, lines):
              path.parent.mkdir(parents=True, exist_ok=True)
              tmp = path.with_suffix(path.suffix + ".tmp")
              tmp.write_text("\n".join(lines) + "\n", encoding="utf-8", newline="\n")
              tmp.replace(path)

          atomic_write(OUTPUT_SURGE, surge_lines)
          atomic_write(OUTPUT_MOSDNS, mosdns_lines)
          atomic_write(OUTPUT_QX, qx_lines)

          print(f"Processed {len(final_rules)} final rules (pruned {removed_domain} redundant domains).")
          PY

      # ==========================================================
      # 4. Validate outputs
      # ==========================================================
      - name: Validate rules
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          CHECKS = [
              ("Surge", Path("ads-latest.txt"), re.compile(r"^(DOMAIN|DOMAIN-SUFFIX|DOMAIN-KEYWORD|DOMAIN-SET),[^,\s]+$"), True),
              ("MosDNS", Path("ads-mosdns.txt"), re.compile(r"^(domain|full|keyword):\S+$"), False),
              ("Quantumult X", Path("ads-qx.snippet"), re.compile(r"^host(-suffix|-keyword)?,[^,\s]+,reject$"), False),
          ]

          for name, path, pattern, allow_comments in CHECKS:
              if not path.exists():
                  raise SystemExit(f"{path} not found")
              seen = set()
              count = 0
              for line_no, raw in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  line = raw.strip()
                  if not line or (allow_comments and line.startswith("#")):
                      continue
                  if not pattern.fullmatch(line) or line in seen:
                      raise SystemExit(f"Invalid/Duplicate {name} rule at line {line_no}: {line}")
                  seen.add(line)
                  count += 1
              print(f"{name} validation OK: {count} rules")
          PY

      # ==========================================================
      # 5. Cleanup & Commit
      # ==========================================================
      - name: Cleanup and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ads-latest.txt ads-mosdns.txt ads-qx.snippet

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git diff --cached --stat
          git commit -m "chore: update ad rules"
          git push
