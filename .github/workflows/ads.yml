name: ads-rules

on:
  push:
    branches:
      - master
    paths:
      - 'ad.txt'

  schedule:
    - cron: '0 */12 * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ads-rules
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONUNBUFFERED: "1"

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # ==========================================================
      # 2. Prepare environment
      # ==========================================================
      - name: Prepare environment
        shell: bash
        run: |
          set -euo pipefail

          echo "DATE=$(date -u +'%Y-%m-%d')" >> "$GITHUB_ENV"

          echo "========================================"
          echo "Environment"
          echo "========================================"

          python3 --version
          curl --version | head -n 1

      # ==========================================================
      # 3. Download source rules
      # ==========================================================
      - name: Download source rules
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Downloading source rules"
          echo "========================================"

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 180 \
            "https://raw.githubusercontent.com/olocn/rule/refs/heads/master/surge/ad.txt" \
            -o source-olocn.txt

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 180 \
            "https://raw.githubusercontent.com/TG-Twilight/AWAvenue-Ads-Rule/main/Filters/AWAvenue-Ads-Rule-Surge-RULE-SET.list" \
            -o source-awa.txt

          for file in \
            source-olocn.txt \
            source-awa.txt
          do
            if [ ! -s "$file" ]; then
              echo "ERROR: $file is empty"
              exit 1
            fi

            echo
            echo "$file:"
            wc -l "$file"
            ls -lh "$file"
          done

      # ==========================================================
      # 4. Process + Generate all outputs
      #
      # 输入：
      #
      # DOMAIN,example.com
      # DOMAIN-SUFFIX,example.com
      # DOMAIN-KEYWORD,example
      # DOMAIN-SET,example.com
      #
      # 输出：
      #
      # ads-latest.txt
      # ads-mosdns.txt
      # ads-qx.snippet
      #
      # 去重规则：
      #
      # 1. 精确重复：全部规则类型都去重
      #
      # 2. DOMAIN-SUFFIX：
      #    仅此类型做父子域去重
      #
      # 3. DOMAIN：
      #    不做父子域去重
      #
      # 4. DOMAIN-KEYWORD：
      #    不做父子域去重
      #
      # 5. DOMAIN-SET：
      #    不做父子域去重
      #
      # 6. CIDR：
      #    不参与处理
      #
      # 7. 不进行 CIDR 包含关系判断
      # ==========================================================
      - name: Process and generate rules
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from __future__ import annotations

          import os
          import re
          from pathlib import Path


          # ======================================================
          # Configuration
          # ======================================================

          SOURCES = (
              Path("source-olocn.txt"),
              Path("source-awa.txt"),
          )

          OUTPUT_SURGE = Path("ads-latest.txt")
          OUTPUT_MOSDNS = Path("ads-mosdns.txt")
          OUTPUT_QX = Path("ads-qx.snippet")


          ALLOWED_TYPES = {
              "DOMAIN",
              "DOMAIN-SUFFIX",
              "DOMAIN-KEYWORD",
              "DOMAIN-SET",
          }


          # ======================================================
          # Hidden Unicode characters
          # ======================================================

          HIDDEN_CHARS = {
              "\ufeff",  # BOM
              "\u200b",  # Zero Width Space
              "\u200c",  # Zero Width Non-Joiner
              "\u200d",  # Zero Width Joiner
              "\u2060",  # Word Joiner
              "\u00ad",  # Soft Hyphen
              "\u200e",  # LRM
              "\u200f",  # RLM
              "\u202a",  # LRE
              "\u202b",  # RLE
              "\u202c",  # PDF
              "\u202d",  # LRO
              "\u202e",  # RLO
              "\u2066",  # LRI
              "\u2067",  # RLI
              "\u2068",  # FSI
              "\u2069",  # PDI
          }


          def clean_unicode(text: str) -> str:
              for char in HIDDEN_CHARS:
                  text = text.replace(char, "")
              return text


          # ======================================================
          # Remove comments
          #
          # 保持与原 Workflow 的目的：
          #
          # abc.com # comment
          #
          # ->
          #
          # abc.com
          # ======================================================

          def remove_comment(line: str) -> str:
              return re.sub(r"\s*#.*$", "", line)


          # ======================================================
          # Parse rule
          # ======================================================

          def parse_rule(line: str):
              line = clean_unicode(line)
              line = line.replace("\r", "")
              line = remove_comment(line).strip()

              if not line:
                  return None

              parts = [item.strip() for item in line.split(",")]

              if len(parts) < 2:
                  return None

              rule_type = parts[0].upper()
              value = parts[1].strip()

              if rule_type not in ALLOWED_TYPES:
                  return None

              if not value:
                  return None

              # --------------------------------------------------
              # Remove unsupported trailing parameters.
              #
              # 最终统一输出：
              #
              # TYPE,value
              # --------------------------------------------------

              value = value.lower()
              value = value.strip(".")

              if not value:
                  return None

              # --------------------------------------------------
              # 防止隐藏字符 / 空白进入最终结果
              # --------------------------------------------------

              if any(char in value for char in HIDDEN_CHARS):
                  return None

              if any(char.isspace() for char in value):
                  return None

              return rule_type, value


          # ======================================================
          # Strict domain normalization
          #
          # 这里只用于 DOMAIN-SUFFIX 父子关系判断。
          #
          # 不参与 DOMAIN / KEYWORD / DOMAIN-SET。
          # ======================================================

          def normalize_domain(value: str):
              value = value.lower().strip().rstrip(".")

              if not value:
                  return None

              # IP / CIDR 不进行域名父子判断
              if "/" in value:
                  return None

              if ":" in value:
                  return None

              # IPv4
              if re.fullmatch(
                  r"(?:\d{1,3}\.){3}\d{1,3}",
                  value,
              ):
                  return None

              if " " in value:
                  return None

              return value


          # ======================================================
          # Check whether child is covered by parent
          #
          # www.example.com
          # example.com
          #
          # True
          #
          # notexample.com
          # example.com
          #
          # False
          # ======================================================

          def is_subdomain(child: str, parent: str) -> bool:
              if child == parent:
                  return False

              return child.endswith("." + parent)


          # ======================================================
          # Read sources
          # ======================================================

          parsed_rules = []

          total_input_lines = 0
          total_accepted = 0

          source_statistics = {}


          for source in SOURCES:

              print()
              print("=" * 60)
              print(f"Reading: {source}")
              print("=" * 60)

              lines = source.read_text(
                  encoding="utf-8",
                  errors="replace",
              ).splitlines()

              total_input_lines += len(lines)

              accepted = 0

              for line in lines:

                  result = parse_rule(line)

                  if result is None:
                      continue

                  parsed_rules.append(result)
                  accepted += 1

              total_accepted += accepted

              source_statistics[source.name] = (
                  len(lines),
                  accepted,
              )

              print(f"Input lines : {len(lines)}")
              print(f"Accepted    : {accepted}")


          # ======================================================
          # Exact duplicate removal
          #
          # 保留第一次出现。
          #
          # DOMAIN,example.com
          # DOMAIN-SUFFIX,example.com
          #
          # 是两个不同规则，不会互相删除。
          # ======================================================

          exact_seen = set()
          unique_rules = []

          exact_removed = 0

          for rule in parsed_rules:

              if rule in exact_seen:
                  exact_removed += 1
                  continue

              exact_seen.add(rule)
              unique_rules.append(rule)


          # ======================================================
          # DOMAIN-SUFFIX parent/child deduplication
          #
          # 只有 DOMAIN-SUFFIX 参与。
          #
          # DOMAIN-SUFFIX,example.com
          # DOMAIN-SUFFIX,www.example.com
          #
          # ->
          #
          # DOMAIN-SUFFIX,example.com
          #
          # 但：
          #
          # DOMAIN,example.com
          # DOMAIN,www.example.com
          #
          # 两者全部保留。
          # ======================================================

          suffix_domains = {
              value
              for rule_type, value in unique_rules
              if rule_type == "DOMAIN-SUFFIX"
          }


          suffix_removed = 0
          final_rules = []


          for rule_type, value in unique_rules:

              if rule_type != "DOMAIN-SUFFIX":

                  final_rules.append(
                      (rule_type, value)
                  )

                  continue

              domain = normalize_domain(value)

              if domain is None:

                  final_rules.append(
                      (rule_type, value)
                  )

                  continue

              labels = domain.split(".")

              covered = False

              # --------------------------------------------------
              # 从最近的父域开始：
              #
              # a.b.example.com
              #
              # b.example.com
              # example.com
              # --------------------------------------------------

              for index in range(1, len(labels) - 1):

                  parent = ".".join(
                      labels[index:]
                  )

                  if parent in suffix_domains:

                      covered = True
                      break

              if covered:

                  suffix_removed += 1
                  continue

              final_rules.append(
                  (rule_type, value)
              )


          # ======================================================
          # Stable sorting
          #
          # 按：
          #
          # TYPE
          # VALUE
          #
          # 排序。
          #
          # 这样每天运行不会因为输入顺序变化产生无意义 diff。
          # ======================================================

          final_rules.sort(
              key=lambda item: (
                  item[0],
                  item[1],
              )
          )


          if not final_rules:
              raise SystemExit(
                  "ERROR: final rules are empty"
              )


          # ======================================================
          # Generate Surge
          #
          # 保留完整规则类型。
          #
          # DOMAIN,example.com
          # DOMAIN-SUFFIX,example.com
          # DOMAIN-KEYWORD,example
          # DOMAIN-SET,example.com
          # ======================================================

          surge_lines = [
              f"# Auto merged Surge rules ({os.environ['DATE']})"
          ]

          for rule_type, value in final_rules:

              surge_lines.append(
                  f"{rule_type},{value}"
              )


          OUTPUT_SURGE.write_text(
              "\n".join(surge_lines) + "\n",
              encoding="utf-8",
          )


          # ======================================================
          # Generate MosDNS
          #
          # DOMAIN-SUFFIX
          #     domain:
          #
          # DOMAIN
          #     full:
          #
          # DOMAIN-KEYWORD
          #     keyword:
          #
          # DOMAIN-SET
          #     full:
          # ======================================================

          mosdns_lines = []

          for rule_type, value in final_rules:

              if rule_type == "DOMAIN-SUFFIX":

                  mosdns_lines.append(
                      "domain:" + value
                  )

              elif rule_type == "DOMAIN":

                  mosdns_lines.append(
                      "full:" + value
                  )

              elif rule_type == "DOMAIN-KEYWORD":

                  mosdns_lines.append(
                      "keyword:" + value
                  )

              elif rule_type == "DOMAIN-SET":

                  mosdns_lines.append(
                      "full:" + value
                  )


          # 保持稳定排序 + 去重
          mosdns_lines = sorted(set(mosdns_lines))


          if not mosdns_lines:
              raise SystemExit(
                  "ERROR: ads-mosdns.txt is empty"
              )


          OUTPUT_MOSDNS.write_text(
              "\n".join(mosdns_lines) + "\n",
              encoding="utf-8",
          )


          # ======================================================
          # Generate Quantumult X
          # ======================================================

          qx_lines = []

          for rule_type, value in final_rules:

              if rule_type == "DOMAIN-SUFFIX":

                  qx_lines.append(
                      f"host-suffix,{value},reject"
                  )

              elif rule_type == "DOMAIN":

                  qx_lines.append(
                      f"host,{value},reject"
                  )

              elif rule_type == "DOMAIN-KEYWORD":

                  qx_lines.append(
                      f"host-keyword,{value},reject"
                  )

              elif rule_type == "DOMAIN-SET":

                  qx_lines.append(
                      f"host,{value},reject"
                  )


          # 稳定排序 + 去重
          qx_lines = sorted(set(qx_lines))


          if not qx_lines:
              raise SystemExit(
                  "ERROR: ads-qx.snippet is empty"
              )


          OUTPUT_QX.write_text(
              "\n".join(qx_lines) + "\n",
              encoding="utf-8",
          )


          # ======================================================
          # Statistics
          # ======================================================

          type_count = {}

          for rule_type, _ in final_rules:

              type_count[rule_type] = (
                  type_count.get(rule_type, 0) + 1
              )


          print()
          print("=" * 60)
          print("RULE PROCESSING")
          print("=" * 60)

          print(
              f"Source lines             : {total_input_lines}"
          )

          print(
              f"Accepted rules           : {total_accepted}"
          )

          print(
              f"Exact duplicates removed : {exact_removed}"
          )

          print(
              f"Parent domains removed   : {suffix_removed}"
          )

          print(
              "CIDR containment removed : 0"
          )

          print(
              f"Final rules              : {len(final_rules)}"
          )

          print()
          print("Rule types:")

          for rule_type in sorted(type_count):

              print(
                  f"{type_count[rule_type]:8d} {rule_type}"
              )

          print()
          print("Generated:")

          print(
              f"  {OUTPUT_SURGE}: "
              f"{len(surge_lines) - 1}"
          )

          print(
              f"  {OUTPUT_MOSDNS}: "
              f"{len(mosdns_lines)}"
          )

          print(
              f"  {OUTPUT_QX}: "
              f"{len(qx_lines)}"
          )


          # ======================================================
          # Internal validation
          # ======================================================

          for output in (
              OUTPUT_SURGE,
              OUTPUT_MOSDNS,
              OUTPUT_QX,
          ):

              if not output.exists():
                  raise SystemExit(
                      f"ERROR: missing output: {output}"
                  )

              if output.stat().st_size == 0:
                  raise SystemExit(
                      f"ERROR: empty output: {output}"
                  )


          print()
          print("Python processing completed successfully.")
          PY

      # ==========================================================
      # 5. Validate normalized/generated Surge rules
      #
      # ads-latest.txt：
      #
      # DOMAIN,example.com
      # DOMAIN-SUFFIX,example.com
      # DOMAIN-KEYWORD,example
      # DOMAIN-SET,example.com
      # ==========================================================
      - name: Validate Surge rules
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Validate Surge rules"
          echo "========================================"

          if [ ! -s ads-latest.txt ]; then
            echo "ERROR: ads-latest.txt is empty or missing"
            exit 1
          fi

          echo
          echo "Checking hidden / non-ASCII characters..."

          if LC_ALL=C grep -n '[^ -~]' ads-latest.txt; then
            echo
            echo "ERROR: ads-latest.txt contains non-ASCII/invisible characters"
            exit 1
          fi

          echo "OK"

          echo
          echo "Checking rule format..."

          INVALID=$(
            grep -vE \
              '^#|^$|^(DOMAIN|DOMAIN-SUFFIX|DOMAIN-KEYWORD|DOMAIN-SET),[^,[:space:]]+$' \
              ads-latest.txt \
              || true
          )

          if [ -n "$INVALID" ]; then
            echo
            echo "ERROR: invalid Surge rules:"
            echo "$INVALID"
            exit 1
          fi

          echo "OK"

          echo
          echo "Checking empty values..."

          if grep -qE \
            '^(DOMAIN|DOMAIN-SUFFIX|DOMAIN-KEYWORD|DOMAIN-SET),$' \
            ads-latest.txt; then

            echo "ERROR: empty domain value detected"
            exit 1
          fi

          echo "OK"

          echo
          echo "Checking duplicate rules..."

          RULE_LINES=$(grep -vE '^#|^$' ads-latest.txt | wc -l)
          UNIQUE_LINES=$(grep -vE '^#|^$' ads-latest.txt | sort -u | wc -l)

          if [ "$RULE_LINES" -ne "$UNIQUE_LINES" ]; then
            echo "ERROR: duplicate rules detected"
            exit 1
          fi

          echo "OK"

          echo
          echo "Valid Surge rules:"
          echo "$RULE_LINES"

      # ==========================================================
      # 6. Validate MosDNS
      # ==========================================================
      - name: Validate MosDNS rules
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Validate MosDNS rules"
          echo "========================================"

          if [ ! -s ads-mosdns.txt ]; then
            echo "ERROR: ads-mosdns.txt is empty or missing"
            exit 1
          fi

          echo "Checking hidden / non-ASCII characters..."

          if LC_ALL=C grep -n '[^ -~]' ads-mosdns.txt; then
            echo
            echo "ERROR: ads-mosdns.txt contains non-ASCII/invisible characters"
            exit 1
          fi

          echo "OK"

          echo
          echo "Checking rule format..."

          INVALID=$(
            grep -vE \
              '^(domain|full|keyword):[^[:space:]]+$' \
              ads-mosdns.txt \
              || true
          )

          if [ -n "$INVALID" ]; then
            echo
            echo "ERROR: invalid MosDNS rules:"
            echo "$INVALID"
            exit 1
          fi

          echo "OK"

          echo
          echo "Checking duplicates..."

          TOTAL=$(wc -l < ads-mosdns.txt)
          UNIQUE=$(sort -u ads-mosdns.txt | wc -l)

          if [ "$TOTAL" -ne "$UNIQUE" ]; then
            echo "ERROR: duplicate MosDNS rules detected"
            exit 1
          fi

          echo "OK"

          echo
          echo "Valid MosDNS rules:"
          echo "$TOTAL"

      # ==========================================================
      # 7. Validate Quantumult X
      # ==========================================================
      - name: Validate Quantumult X rules
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Validate Quantumult X rules"
          echo "========================================"

          if [ ! -s ads-qx.snippet ]; then
            echo "ERROR: ads-qx.snippet is empty or missing"
            exit 1
          fi

          echo "Checking hidden / non-ASCII characters..."

          if LC_ALL=C grep -n '[^ -~]' ads-qx.snippet; then
            echo
            echo "ERROR: ads-qx.snippet contains non-ASCII/invisible characters"
            exit 1
          fi

          echo "OK"

          echo
          echo "Checking rule format..."

          INVALID=$(
            grep -vE \
              '^host(-suffix|-keyword)?,[^,[:space:]]+,reject$' \
              ads-qx.snippet \
              || true
          )

          if [ -n "$INVALID" ]; then
            echo
            echo "ERROR: invalid Quantumult X rules:"
            echo "$INVALID"
            exit 1
          fi

          echo "OK"

          echo
          echo "Checking duplicates..."

          TOTAL=$(wc -l < ads-qx.snippet)
          UNIQUE=$(sort -u ads-qx.snippet | wc -l)

          if [ "$TOTAL" -ne "$UNIQUE" ]; then
            echo "ERROR: duplicate Quantumult X rules detected"
            exit 1
          fi

          echo "OK"

          echo
          echo "Valid Quantumult X rules:"
          echo "$TOTAL"

      # ==========================================================
      # 8. Show statistics
      # ==========================================================
      - name: Show statistics
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "========================================"
          echo "ADS RULES BUILD"
          echo "========================================"

          echo
          echo "Surge:"
          grep -vE '^#|^$' ads-latest.txt | wc -l

          echo
          echo "Surge rule types:"
          grep -vE '^#|^$' ads-latest.txt \
            | cut -d',' -f1 \
            | sort \
            | uniq -c

          echo
          echo "MosDNS:"
          wc -l ads-mosdns.txt

          echo
          echo "Quantumult X:"
          wc -l ads-qx.snippet

          echo
          echo "Generated files:"
          ls -lh \
            ads-latest.txt \
            ads-mosdns.txt \
            ads-qx.snippet

          echo
          echo "NOT generated:"
          echo "  ads-clash.yaml"
          echo "  ads-singbox.json"
          echo "  *.mrs"
          echo "  *.srs"

      # ==========================================================
      # 9. Preview
      # ==========================================================
      - name: Preview generated rules
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "========================================"
          echo "Surge first 20 rules"
          echo "========================================"

          head -n 21 ads-latest.txt

          echo
          echo "========================================"
          echo "MosDNS first 20 rules"
          echo "========================================"

          head -n 20 ads-mosdns.txt

          echo
          echo "========================================"
          echo "Quantumult X first 20 rules"
          echo "========================================"

          head -n 20 ads-qx.snippet

      # ==========================================================
      # 10. Cleanup
      # ==========================================================
      - name: Cleanup
        shell: bash
        run: |
          set -euo pipefail

          rm -f \
            source-olocn.txt \
            source-awa.txt

      # ==========================================================
      # 11. Commit and push
      # ==========================================================
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            ads-latest.txt \
            ads-mosdns.txt \
            ads-qx.snippet

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          echo
          echo "Changes detected:"
          git diff --cached --stat

          git commit \
            -m "chore: update ads rules ${DATE}"

          git push
