name: IP-ASN Rules

on:
  schedule:
    - cron: '0 22 * * *' # 每天北京时间 06:00 自动运行
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and Convert ASN Rules
        run: |
          # 抓取 bgp.he.net CN 页面，提取所有 AS 号并转成指定格式
          curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://bgp.he.net/country/CN" | \
          grep -oE 'AS[0-9]+' | \
          sed -E 's/AS([0-9]+)/ip-asn, \1, direct/' | \
          sort -V | uniq > ip-asn.snippet

          # 预览和统计
          echo "=== 转换成功，样例预览 ==="
          head -n 5 ip-asn.snippet
          echo "========================"
          echo "总计规则条数: $(wc -l < ip-asn.snippet)"

          # 输出到 qx 目录
          mkdir -p qx
          mv -f ip-asn.snippet qx/ip-asn.snippet

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 检查 qx/ip-asn.snippet 是否有更新，有变化才提交
          if [ -n "$(git status --porcelain qx/ip-asn.snippet)" ]; then
            git add qx/ip-asn.snippet
            git commit -m "chore: auto-update China IP-ASN rules $(date +'%Y-%m-%d')"
            git push
          else
            echo "规则未发生变化，跳过提交。"
          fi
