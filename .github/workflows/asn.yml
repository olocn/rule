name: IP-ASN Rules

on:
  schedule:
    - cron: '0 22 * * *' # 每天北京时间 06:00 自动运行
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch, Merge and Convert ASN Rules
        run: |
          # 1. 抓取 bgp.he.net CN 页面提取 ASN 规则
          curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://bgp.he.net/country/CN" | \
          grep -oE 'AS[0-9]+' | \
          sed -E 's/AS([0-9]+)/ip-asn, \1, direct/' > online_asn.tmp

          # 2. 下载自定义的 asn-my.snippet 规则
          curl -sSL "https://raw.githubusercontent.com/olocn/rule/refs/heads/master/qx/asn-my.snippet" > my_asn.tmp

          # 3. 合并在线规则和自定义规则，去重并按版本/数字自然排序
          cat online_asn.tmp my_asn.tmp | grep -v '^[[:space:]]*$' | sort -V | uniq > asn.snippet

          # 清理临时文件
          rm -f online_asn.tmp my_asn.tmp

          # 4. 预览和统计
          echo "=== 处理完成，样例预览 ==="
          head -n 5 asn.snippet
          echo "========================"
          echo "总计规则条数: $(wc -l < asn.snippet)"

          # 5. 输出到 qx 目录并命名为 asn.snippet
          mkdir -p qx
          mv -f asn.snippet qx/asn.snippet

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 检查 qx/asn.snippet 是否有更新，有变化才提交
          if [ -n "$(git status --porcelain qx/asn.snippet)" ]; then
            git add qx/asn.snippet
            git commit -m "chore: auto-update China IP-ASN rules $(date +'%Y-%m-%d')"
            git push
          else
            echo "规则未发生变化，跳过提交。"
          fi
