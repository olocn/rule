name: Deduplicate QX Rules

on:
  workflow_dispatch:

  push:
    paths:
      - 'qx/**/*.snippet'

  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: deduplicate-qx-rules
  cancel-in-progress: false

jobs:
  dedupe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deduplicate QX rules
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "qx" ]]; then
            echo "Directory 'qx' does not exist."
            exit 0
          fi

          changed=0

          while IFS= read -r -d '' filepath; do

            echo
            echo "========================================"
            echo "Processing: $filepath"
            echo "========================================"

            tmp="${filepath}.tmp"

            awk '
            # =====================================================
            # 基础函数
            # =====================================================

            function trim(s) {
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", s)
                return s
            }

            function lower(s) {
                return tolower(trim(s))
            }

            function normalize_domain(s) {
                s = lower(s)
                sub(/\.$/, "", s)
                return s
            }

            function get_type(s, p) {
                split(s, p, ",")
                return lower(p[1])
            }

            function get_value(s, p) {
                split(s, p, ",")
                return trim(p[2])
            }

            # =====================================================
            # 判断 host-keyword 是否匹配域名
            # =====================================================

            function keyword_match(domain, keyword) {
                return index(lower(domain), lower(keyword)) > 0
            }

            # =====================================================
            # 判断 suffix 是否覆盖域名
            # =====================================================

            function suffix_match(domain, suffix) {

                domain = normalize_domain(domain)
                suffix = normalize_domain(suffix)

                if (domain == suffix) {
                    return 1
                }

                if (domain ~ ("\\." suffix "$")) {
                    return 1
                }

                return 0
            }

            # =====================================================
            # 规范化规则
            # =====================================================

            function rule_key(line, t, v) {

                t = get_type(line)
                v = get_value(line)

                if (t == "host" || t == "host-suffix" || t == "host-keyword") {
                    v = normalize_domain(v)
                } else {
                    v = lower(v)
                }

                return t "," v
            }

            # =====================================================
            # 空行
            # =====================================================

            /^[[:space:]]*$/ {
                line[++total] = $0
                type[total] = "blank"
                next
            }

            # =====================================================
            # 注释
            # =====================================================

            /^[[:space:]]*#/ {
                line[++total] = $0
                type[total] = "comment"
                next
            }

            /^[[:space:]]*;/ {
                line[++total] = $0
                type[total] = "comment"
                next
            }

            /^[[:space:]]*\/\// {
                line[++total] = $0
                type[total] = "comment"
                next
            }

            # =====================================================
            # 规则
            # =====================================================

            {
                current = $0

                t = get_type(current)
                v = get_value(current)
                key = rule_key(current)

                # -----------------------------------------------
                # 完全重复规则
                # -----------------------------------------------

                if (key in seen) {
                    duplicate_count++
                    next
                }

                seen[key] = 1

                # -----------------------------------------------
                # 保存原始内容
                # -----------------------------------------------

                line[++total] = current
                type[total] = t
                value[total] = v

                # -----------------------------------------------
                # host-keyword
                # -----------------------------------------------

                if (t == "host-keyword") {
                    keyword[++keyword_count] = normalize_domain(v)
                    next
                }

                # -----------------------------------------------
                # host-suffix
                # -----------------------------------------------

                if (t == "host-suffix") {
                    suffix[++suffix_count] = normalize_domain(v)
                    next
                }
            }

            END {

                # =================================================
                # 第二遍：
                # 判断哪些规则应该删除
                # =================================================

                for (i = 1; i <= total; i++) {

                    t = type[i]

                    if (t == "blank" || t == "comment") {
                        continue
                    }

                    v = normalize_domain(value[i])

                    # =================================================
                    # 1. host / host-suffix 被 host-keyword 覆盖
                    # =================================================

                    if (t == "host" || t == "host-suffix") {

                        for (k = 1; k <= keyword_count; k++) {

                            if (keyword_match(v, keyword[k])) {
                                remove[i] = 1
                                keyword_removed++
                                break
                            }
                        }
                    }

                    # =================================================
                    # 2. host-suffix 被更高层级 suffix 覆盖
                    # =================================================

                    if (t == "host-suffix" && !remove[i]) {

                        for (k = 1; k <= suffix_count; k++) {

                            parent = suffix[k]

                            if (parent == v) {
                                continue
                            }

                            if (suffix_match(v, parent)) {
                                remove[i] = 1
                                suffix_removed++
                                break
                            }
                        }
                    }

                    # =================================================
                    # 3. host 被 host-suffix 覆盖
                    # =================================================

                    if (t == "host" && !remove[i]) {

                        for (k = 1; k <= suffix_count; k++) {

                            if (suffix_match(v, suffix[k])) {
                                remove[i] = 1
                                host_removed++
                                break
                            }
                        }
                    }
                }

                # =================================================
                # 按原始顺序输出
                # =================================================

                for (i = 1; i <= total; i++) {

                    if (!remove[i]) {
                        print line[i]
                    }
                }

                # =================================================
                # 统计
                # =================================================

                removed_total = duplicate_count + keyword_removed + suffix_removed + host_removed

                print "Removed duplicate: " duplicate_count > "/dev/stderr"
                print "Removed by keyword: " keyword_removed > "/dev/stderr"
                print "Removed by suffix: " suffix_removed > "/dev/stderr"
                print "Removed host: " host_removed > "/dev/stderr"
                print "Removed total: " removed_total > "/dev/stderr"
            }
            ' "$filepath" > "$tmp"

            # =====================================================
            # 只有内容发生变化才替换
            # =====================================================

            if ! cmp -s "$filepath" "$tmp"; then
              mv "$tmp" "$filepath"
              changed=1
              echo "Changed: $filepath"
            else
              rm -f "$tmp"
              echo "Unchanged: $filepath"
            fi

          done < <(
            find qx \
              -type f \
              -name '*.snippet' \
              -print0
          )

          echo
          echo "========================================"

          if [[ "$changed" == "1" ]]; then
            echo "Deduplication completed: files changed."
          else
            echo "Deduplication completed: no changes."
          fi

          echo "========================================"

      - name: Show changes
        run: |
          git status --short

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: deduplicate qx rules [skip ci]"
          branch: ${{ github.ref_name }}
          file_pattern: "qx/**/*.snippet"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
