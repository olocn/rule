name: Deduplicate QX Rules

on:
  workflow_dispatch:

  push:
    paths:
      - 'qx/*.snippet'
      - '.github/workflows/deduplicate-qx-rules.yml'

  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: deduplicate-qx-rules
  cancel-in-progress: false

jobs:
  deduplicate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ============================================================
      # 每个文件内部处理
      # ============================================================

      - name: Deduplicate rules inside each file
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob

          for file in qx/*.snippet; do

            echo
            echo "========================================"
            echo "Processing: $file"
            echo "========================================"

            tmp="${file}.dedup.tmp"

            # --------------------------------------------------------
            # 第一阶段：
            # 只做完全重复规则删除
            # --------------------------------------------------------

            if ! awk '
            function trim(s) {
              gsub(/^[ \t]+/, "", s)
              gsub(/[ \t]+$/, "", s)
              return s
            }

            function normalize(s) {
              s = trim(s)
              gsub(/[ \t]*,[ \t]*/, ",", s)
              return tolower(s)
            }

            {
              raw = $0

              # 空行
              if (raw ~ /^[ \t]*$/) {
                print raw
                next
              }

              # #
              if (raw ~ /^[ \t]*#/) {
                print raw
                next
              }

              # ;
              if (raw ~ /^[ \t]*;/) {
                print raw
                next
              }

              # //
              if (raw ~ /^[ \t]*\/\//) {
                print raw
                next
              }

              key = normalize(raw)

              if (key in seen) {
                duplicate++
                next
              }

              seen[key] = 1

              print raw
            }

            END {
              print duplicate + 0 > "/tmp/qx_internal_duplicate"
            }

            ' "$file" > "$tmp"; then

              echo "ERROR: awk failed while processing $file"
              echo "Original file was NOT modified."

              rm -f "$tmp"
              exit 1
            fi

            duplicate=$(cat /tmp/qx_internal_duplicate 2>/dev/null || echo 0)

            echo "  Duplicate removed: $duplicate"

            # --------------------------------------------------------
            # 第二阶段：
            # host-suffix 覆盖 host / host-suffix
            #
            # 单独运行，避免复杂的 END 逻辑
            # --------------------------------------------------------

            tmp2="${file}.suffix.tmp"

            if ! awk '
            function trim(s) {
              gsub(/^[ \t]+/, "", s)
              gsub(/[ \t]+$/, "", s)
              return s
            }

            function domain(s) {
              s = trim(s)
              s = tolower(s)
              sub(/\.$/, "", s)
              return s
            }

            function is_subdomain(child, parent, n) {

              if (child == "" || parent == "") {
                return 0
              }

              if (length(child) <= length(parent)) {
                return 0
              }

              n = length(child) - length(parent)

              if (substr(child, n) == "." parent) {
                return 1
              }

              return 0
            }

            # --------------------------------------------------------
            # 第一遍：
            # 只收集 host-suffix
            # --------------------------------------------------------

            {
              raw = $0

              if (raw ~ /^[ \t]*$/ ||
                  raw ~ /^[ \t]*#/ ||
                  raw ~ /^[ \t]*;/ ||
                  raw ~ /^[ \t]*\/\//) {
                next
              }

              line[++count] = raw

              split(raw, p, ",")

              type = tolower(trim(p[1]))

              if (type == "host-suffix" && length(p) >= 2) {

                d = domain(p[2])

                if (d != "") {
                  suffix[++suffix_count] = d
                }
              }
            }

            END {

              # ------------------------------------------------------
              # 第二遍输出
              # ------------------------------------------------------

              for (i = 1; i <= count; i++) {

                raw = line[i]

                split(raw, p, ",")

                type = tolower(trim(p[1]))

                # ----------------------------------------------
                # 只处理 host 和 host-suffix
                # ----------------------------------------------

                if (type != "host" && type != "host-suffix") {
                  print raw
                  continue
                }

                if (length(p) < 2) {
                  print raw
                  continue
                }

                d = domain(p[2])

                if (d == "") {
                  print raw
                  continue
                }

                covered = 0

                # ----------------------------------------------
                # host-suffix
                #
                # 父域覆盖子域
                # ----------------------------------------------

                if (type == "host-suffix") {

                  for (j = 1; j <= suffix_count; j++) {

                    parent = suffix[j]

                    if (parent == d) {
                      continue
                    }

                    if (is_subdomain(d, parent)) {
                      covered = 1
                      break
                    }
                  }
                }

                # ----------------------------------------------
                # host
                #
                # host-suffix,example.com
                #
                # 覆盖：
                # host,example.com
                # host,a.example.com
                # ----------------------------------------------

                if (type == "host") {

                  for (j = 1; j <= suffix_count; j++) {

                    parent = suffix[j]

                    if (d == parent) {
                      covered = 1
                      break
                    }

                    if (is_subdomain(d, parent)) {
                      covered = 1
                      break
                    }
                  }
                }

                if (covered) {
                  removed++
                  continue
                }

                print raw
              }

              print removed + 0 > "/tmp/qx_suffix_removed"
            }

            ' "$tmp" > "$tmp2"; then

              echo "ERROR: awk suffix processing failed for $file"
              echo "Original file was NOT modified."

              rm -f "$tmp" "$tmp2"
              exit 1
            fi

            removed=$(cat /tmp/qx_suffix_removed 2>/dev/null || echo 0)

            echo "  Covered rules removed: $removed"

            # --------------------------------------------------------
            # 安全检查
            # --------------------------------------------------------

            original_size=$(wc -c < "$file")
            result_size=$(wc -c < "$tmp2")

            if [ "$original_size" -gt 0 ] && [ "$result_size" -eq 0 ]; then

              echo "  WARNING: generated file is empty."
              echo "  Original file preserved."
              echo "  Changed: NO"

              rm -f "$tmp" "$tmp2"
              continue
            fi

            # --------------------------------------------------------
            # 最终替换
            # --------------------------------------------------------

            if cmp -s "$file" "$tmp2"; then

              echo "  Changed: NO"

            else

              mv "$tmp2" "$file"

              echo "  Changed: YES"

            fi

            rm -f "$tmp"
            rm -f "$tmp2"

          done

      # ============================================================
      # 跨文件精确去重
      #
      # register > proxy
      # direct   > system
      #
      # apple 不参与
      # ============================================================

      - name: Cross-file deduplication
        shell: bash
        run: |
          set -euo pipefail

          deduplicate_pair() {

            keep="$1"
            remove="$2"

            echo
            echo "========================================"
            echo "Cross-file deduplication"
            echo "Keep : $keep"
            echo "Clean: $remove"
            echo "========================================"

            if [ ! -f "$keep" ]; then
              echo "  Keep file does not exist. Skip."
              return
            fi

            if [ ! -f "$remove" ]; then
              echo "  Remove file does not exist. Skip."
              return
            fi

            tmp="${remove}.cross.tmp"

            if ! awk '
            function trim(s) {
              gsub(/^[ \t]+/, "", s)
              gsub(/[ \t]+$/, "", s)
              return s
            }

            function normalize(s) {
              s = trim(s)
              gsub(/[ \t]*,[ \t]*/, ",", s)
              return tolower(s)
            }

            # --------------------------------------------------------
            # 第一个文件：优先保留
            # --------------------------------------------------------

            FNR == NR {

              raw = $0

              if (raw !~ /^[ \t]*$/ &&
                  raw !~ /^[ \t]*#/ &&
                  raw !~ /^[ \t]*;/ &&
                  raw !~ /^[ \t]*\/\//) {

                keep_rule[normalize(raw)] = 1
              }

              next
            }

            # --------------------------------------------------------
            # 第二个文件
            # --------------------------------------------------------

            {

              raw = $0

              # 注释、空行保留
              if (raw ~ /^[ \t]*$/ ||
                  raw ~ /^[ \t]*#/ ||
                  raw ~ /^[ \t]*;/ ||
                  raw ~ /^[ \t]*\/\//) {

                print raw
                next
              }

              key = normalize(raw)

              if (key in keep_rule) {
                removed++
                next
              }

              print raw
            }

            END {
              print removed + 0 > "/tmp/qx_cross_removed"
            }

            ' "$keep" "$remove" > "$tmp"; then

              echo "ERROR: cross-file awk failed."
              echo "Original file was NOT modified."

              rm -f "$tmp"
              exit 1
            fi

            removed=$(cat /tmp/qx_cross_removed 2>/dev/null || echo 0)

            # --------------------------------------------------------
            # 安全检查
            # --------------------------------------------------------

            original_size=$(wc -c < "$remove")
            result_size=$(wc -c < "$tmp")

            if [ "$original_size" -gt 0 ] && [ "$result_size" -eq 0 ]; then

              echo "  WARNING: generated file is empty."
              echo "  Original file preserved."
              echo "  Removed: $removed"
              echo "  Changed: NO"

              rm -f "$tmp"
              return
            fi

            if cmp -s "$remove" "$tmp"; then

              echo "  Removed: $removed"
              echo "  Changed: NO"

              rm -f "$tmp"

            else

              mv "$tmp" "$remove"

              echo "  Removed: $removed"
              echo "  Changed: YES"

            fi
          }

          # register 优先于 proxy
          deduplicate_pair \
            "qx/register.snippet" \
            "qx/proxy.snippet"

          # direct 优先于 system
          deduplicate_pair \
            "qx/direct.snippet" \
            "qx/system.snippet"

      # ============================================================
      # 自动提交
      # ============================================================

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: deduplicate QX rules"
          file_pattern: "qx/*.snippet"
