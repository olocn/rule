name: Deduplicate QX Rules

on:
  workflow_dispatch:

  push:
    paths:
      - 'qx/*.snippet'
      - '.github/workflows/deduplicate-qx-rules.yml'

  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: deduplicate-qx-rules
  cancel-in-progress: false

jobs:
  deduplicate:
    runs-on: ubuntu-latest

    steps:
      # ========================================
      # Checkout
      # ========================================
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ========================================
      # Deduplicate QX Rules
      # ========================================
      - name: Deduplicate QX Rules
        shell: bash
        run: |
          set -euo pipefail

          ROOT="qx"

          total_duplicate=0
          total_suffix=0
          total_host=0
          total_cross_file=0

          mapfile -t files < <(
            find "$ROOT" -maxdepth 1 -type f -name "*.snippet" | sort
          )

          echo "========================================"
          echo "QX Rule Deduplication"
          echo "========================================"
          echo "Found ${#files[@]} snippet files"

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No .snippet files found."
            exit 0
          fi

          # ============================================================
          # 1. 文件内部完全重复规则去重
          # ============================================================

          for file in "${files[@]}"; do
            tmp="${file}.tmp"
            count_file="${file}.count"

            awk '
              /^[[:space:]]*$/ ||
              /^[[:space:]]*#/ ||
              /^[[:space:]]*;/ ||
              /^[[:space:]]*\/\// {
                print
                next
              }

              {
                key=tolower($0)
                gsub(/[[:space:]]*,[[:space:]]*/, ",", key)

                if (seen[key]++) {
                  duplicate++
                  next
                }

                print
              }

              END {
                print duplicate+0 > count_file
              }
            ' count_file="$count_file" "$file" > "$tmp"

            count=$(cat "$count_file")
            rm -f "$count_file"

            if ! cmp -s "$file" "$tmp"; then
              mv "$tmp" "$file"
              changed="YES"
            else
              rm -f "$tmp"
              changed="NO"
            fi

            echo
            echo "$file"
            echo "  Duplicate removed: $count"
            echo "  Changed: $changed"

            total_duplicate=$((total_duplicate + count))
          done


          # ============================================================
          # 2. host-suffix 父域覆盖子域
          #
          # 例如：
          #
          # host-suffix,example.com
          # host-suffix,a.example.com
          #
          # 删除：
          # host-suffix,a.example.com
          #
          # host-keyword 完全不参与
          # ============================================================

          for file in "${files[@]}"; do
            tmp="${file}.tmp"
            count_file="${file}.count"

            awk '
              {
                line[NR]=$0

                if (
                  $0 ~ /^[[:space:]]*$/ ||
                  $0 ~ /^[[:space:]]*#/ ||
                  $0 ~ /^[[:space:]]*;/ ||
                  $0 ~ /^[[:space:]]*\/\//
                ) {
                  next
                }

                type=$1
                domain=$2

                gsub(/^[[:space:]]+|[[:space:]]+$/, "", type)
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", domain)

                type=tolower(type)
                domain=tolower(domain)
                sub(/\.$/, "", domain)

                if (type == "host-suffix")
                  suffix[NR]=domain

                if (type == "host")
                  host[NR]=domain
              }

              END {
                # --------------------------------------------
                # host-suffix：父域覆盖子域
                # --------------------------------------------
                for (i in suffix) {
                  for (j in suffix) {
                    if (i == j)
                      continue

                    if (
                      suffix[i] != suffix[j] &&
                      suffix[i] ~ ("\\." suffix[j] "$")
                    ) {
                      remove_suffix[i]=1
                      break
                    }
                  }
                }

                # --------------------------------------------
                # host：被 host-suffix 覆盖
                # --------------------------------------------
                for (i in host) {
                  for (j in suffix) {
                    if (
                      host[i] == suffix[j] ||
                      host[i] ~ ("\\." suffix[j] "$")
                    ) {
                      remove_host[i]=1
                      break
                    }
                  }
                }

                # --------------------------------------------
                # 输出
                # --------------------------------------------
                for (i=1; i<=NR; i++) {
                  if (remove_suffix[i]) {
                    suffix_count++
                    continue
                  }

                  if (remove_host[i]) {
                    host_count++
                    continue
                  }

                  print line[i]
                }

                print suffix_count+0 > count_file
                print host_count+0 >> count_file
              }
            ' FS=',' OFS=',' count_file="$count_file" "$file" > "$tmp"

            suffix_count=$(sed -n '1p' "$count_file")
            host_count=$(sed -n '2p' "$count_file")

            rm -f "$count_file"

            if ! cmp -s "$file" "$tmp"; then
              mv "$tmp" "$file"
              changed="YES"
            else
              rm -f "$tmp"
              changed="NO"
            fi

            echo
            echo "$file"
            echo "  Suffix removed: $suffix_count"
            echo "  Host removed:   $host_count"
            echo "  Changed:        $changed"

            total_suffix=$((total_suffix + suffix_count))
            total_host=$((total_host + host_count))
          done


          # ============================================================
          # 3. 跨文件去重
          #
          # register > proxy
          # direct   > system
          #
          # 只删除低优先级文件中完全相同的规则
          # ============================================================

          deduplicate_pair() {
            keep="$ROOT/$1"
            remove="$ROOT/$2"

            if [ ! -f "$keep" ] || [ ! -f "$remove" ]; then
              echo
              echo "Skip: $keep / $remove"
              return
            fi

            tmp="${remove}.tmp"
            count_file="${remove}.count"

            awk '
              FNR==NR {
                if (
                  $0 !~ /^[[:space:]]*$/ &&
                  $0 !~ /^[[:space:]]*#/ &&
                  $0 !~ /^[[:space:]]*;/ &&
                  $0 !~ /^[[:space:]]*\/\//
                ) {
                  key=tolower($0)
                  gsub(/[[:space:]]*,[[:space:]]*/, ",", key)
                  keep[key]=1
                }
                next
              }

              {
                if (
                  $0 ~ /^[[:space:]]*$/ ||
                  $0 ~ /^[[:space:]]*#/ ||
                  $0 ~ /^[[:space:]]*;/ ||
                  $0 ~ /^[[:space:]]*\/\//
                ) {
                  print
                  next
                }

                key=tolower($0)
                gsub(/[[:space:]]*,[[:space:]]*/, ",", key)

                if (keep[key]) {
                  removed++
                  next
                }

                print
              }

              END {
                print removed+0 > count_file
              }
            ' count_file="$count_file" "$keep" "$remove" > "$tmp"

            count=$(cat "$count_file")
            rm -f "$count_file"

            if ! cmp -s "$remove" "$tmp"; then
              mv "$tmp" "$remove"
              changed="YES"
            else
              rm -f "$tmp"
              changed="NO"
            fi

            echo
            echo "$1 > $2"
            echo "  Cross-file removed: $count"
            echo "  Changed: $changed"

            total_cross_file=$((total_cross_file + count))
          }


          deduplicate_pair "register.snippet" "proxy.snippet"
          deduplicate_pair "direct.snippet" "system.snippet"


          # ============================================================
          # 4. 总统计
          # ============================================================

          total=$(
            awk \
              -v a="$total_duplicate" \
              -v b="$total_suffix" \
              -v c="$total_host" \
              -v d="$total_cross_file" \
              'BEGIN { print a+b+c+d }'
          )

          echo
          echo "========================================"
          echo "TOTAL"
          echo "========================================"
          echo "Duplicate removed : $total_duplicate"
          echo "Suffix removed    : $total_suffix"
          echo "Host removed      : $total_host"
          echo "Cross-file removed: $total_cross_file"
          echo "----------------------------------------"
          echo "Total removed     : $total"


      # ========================================
      # Check changes
      # ========================================
      - name: Check changes
        shell: bash
        run: |
          echo "========================================"
          echo "Git Status"
          echo "========================================"

          git status --short

          echo
          echo "========================================"
          echo "Git Diff"
          echo "========================================"

          git diff -- qx/*.snippet


      # ========================================
      # Auto Commit
      # ========================================
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: deduplicate QX rules"
          file_pattern: "qx/*.snippet"
