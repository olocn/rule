name: Deduplicate QX Rules

on:
  workflow_dispatch:
  push:
    paths:
      - 'qx/**'
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # 抓取完整历史记录，防止分支分支分叉时合并失败
          fetch-depth: 0

      - name: Pull latest changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 防止并发提交导致的冲突，采用 rebase 变基合并
          git pull origin ${{ github.ref_name }} --rebase || true

      - name: Run deduplication shell script
        run: |
          if [ ! -d "qx" ]; then
            echo "Directory 'qx' does not exist."
            exit 0
          fi

          # 逐个独立处理文件
          find qx -type f | while IFS= read -r filepath; do
            echo "Processing: $filepath"
            
            awk '
              BEGIN { 
                delete seen
                delete suffixes
              }

              # 1. 空行或注释行 (#, ;, // 开头) 直接原样保留
              /^[[:space:]]*$/ || /^[[:space:]]*([#;/]|\/\/)/ {
                print $0
                next
              }

              {
                # 2. 基础整行完全重复清理
                if (seen[$0]++) next

                # 3. host-suffix 子域名冗余判定
                line_lower = tolower($0)
                if (line_lower ~ /^[[:space:]]*host-suffix[[:space:]]*,/) {
                  split($0, parts, ",")
                  
                  # 提取域名部分并清理首尾空格与大小写
                  domain = parts[2]
                  gsub(/^[[:space:]]+|[[:space:]]+$/, "", domain)
                  domain = tolower(domain)

                  # 检查当前域名是否已被已有的父域名涵盖
                  is_subdomain = 0
                  for (s in suffixes) {
                    if (domain ~ ("\\." s "$")) {
                      is_subdomain = 1
                      break
                    }
                  }

                  # 如果是子域名，则丢弃该行
                  if (is_subdomain) next

                  # 记录当前 host-suffix 的根/父域名
                  suffixes[domain] = 1
                }

                print $0
              }
            ' "$filepath" > "$filepath.tmp"

            mv "$filepath.tmp" "$filepath"
          done

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto deduplicate qx rules independently [skip ci]"
          branch: ${{ github.ref_name }}
