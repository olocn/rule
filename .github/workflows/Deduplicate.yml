name: Deduplicate QX Rules

on:
  workflow_dispatch:

  push:
    paths:
      - 'qx/**/*.snippet'

  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: deduplicate-qx-rules
  cancel-in-progress: false

jobs:
  dedupe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deduplicate QX rules
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "qx" ]]; then
            echo "Directory 'qx' does not exist."
            exit 0
          fi

          changed=0

          while IFS= read -r -d '' filepath; do

            echo
            echo "========================================"
            echo "Processing: $filepath"
            echo "========================================"

            tmp="${filepath}.tmp"

            awk '
              # ==================================================
              # 去除首尾空格
              # ==================================================
              function trim(s) {
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", s)
                return s
              }

              # ==================================================
              # 小写
              # ==================================================
              function lower(s) {
                return tolower(trim(s))
              }

              # ==================================================
              # 规范化域名
              # ==================================================
              function domain_normalize(s) {
                s = lower(s)
                sub(/\.$/, "", s)
                return s
              }

              # ==================================================
              # 获取规则类型
              # ==================================================
              function rule_type(line, p) {
                split(line, p, ",")
                if (length(p[1]) == 0)
                  return ""
                return lower(p[1])
              }

              # ==================================================
              # 获取规则值
              # ==================================================
              function rule_value(line, p) {
                split(line, p, ",")
                if (length(p[2]) == 0)
                  return ""
                return trim(p[2])
              }

              # ==================================================
              # 生成规范化 Key
              # ==================================================
              function rule_key(line, type, value) {

                type = rule_type(line)
                value = rule_value(line)

                if (
                  type == "host" ||
                  type == "host-suffix" ||
                  type == "host-keyword"
                ) {
                  value = domain_normalize(value)
                } else {
                  value = lower(value)
                }

                return type "," value
              }

              # ==================================================
              # 判断 domain 是否被 suffix 覆盖
              # ==================================================
              function suffix_match(domain, suffix) {

                domain = domain_normalize(domain)
                suffix = domain_normalize(suffix)

                if (domain == suffix)
                  return 1

                if (domain ~ ("\\." suffix "$"))
                  return 1

                return 0
              }

              # ==================================================
              # 判断 keyword 是否匹配 domain
              # ==================================================
              function keyword_match(domain, keyword) {

                domain = lower(domain)
                keyword = lower(keyword)

                return index(domain, keyword) > 0
              }

              # ==================================================
              # 空行
              # ==================================================
              /^[[:space:]]*$/ {
                line[++total] = $0
                type[total] = "blank"
                position[total] = NR
                next
              }

              # ==================================================
              # 注释
              # ==================================================
              /^[[:space:]]*(#|;|\/\/)/ {
                line[++total] = $0
                type[total] = "comment"
                position[total] = NR
                next
              }

              # ==================================================
              # 正常规则
              # ==================================================
              {
                current = $0

                t = rule_type(current)
                v = rule_value(current)
                k = rule_key(current)

                # ----------------------------------------------
                # 完全重复
                # ----------------------------------------------
                if (k in seen) {
                  duplicate_count++
                  next
                }

                seen[k] = 1

                # ----------------------------------------------
                # 保存原始行
                # ----------------------------------------------
                total++

                line[total] = current
                type[total] = t
                value[total] = v
                position[total] = NR

                # ----------------------------------------------
                # host-keyword
                # ----------------------------------------------
                if (t == "host-keyword") {

                  keyword_count++

                  keyword[keyword_count] = domain_normalize(v)

                  next
                }

                # ----------------------------------------------
                # host-suffix
                # ----------------------------------------------
                if (t == "host-suffix") {

                  suffix_count++

                  suffix[suffix_count] = domain_normalize(v)

                  next
                }

                # ----------------------------------------------
                # host
                # ----------------------------------------------
                if (t == "host") {

                  host_count++

                  host[host_count] = domain_normalize(v)

                  next
                }
              }

              END {

                # ==================================================
                # 第二遍判断哪些规则需要删除
                # ==================================================

                for (i = 1; i <= total; i++) {

                  t = type[i]

                  # 空行、注释绝对不删除
                  if (t == "blank" || t == "comment")
                    continue

                  v = domain_normalize(value[i])

                  # =================================================
                  # 1. host / host-suffix 被 host-keyword 覆盖
                  # =================================================

                  if (t == "host" || t == "host-suffix") {

                    for (k = 1; k <= keyword_count; k++) {

                      if (keyword_match(v, keyword[k])) {

                        remove[i] = 1
                        keyword_removed++

                        break
                      }
                    }
                  }

                  # =================================================
                  # 2. host-suffix 被父级 host-suffix 覆盖
                  # =================================================

                  if (t == "host-suffix" && !remove[i]) {

                    for (k = 1; k <= suffix_count; k++) {

                      parent = suffix[k]

                      if (parent == v)
                        continue

                      if (suffix_match(v, parent)) {

                        remove[i] = 1
                        suffix_removed++

                        break
                      }
                    }
                  }

                  # =================================================
                  # 3. host 被 host-suffix 覆盖
                  # =================================================

                  if (t == "host" && !remove[i]) {

                    for (k = 1; k <= suffix_count; k++) {

                      parent = suffix[k]

                      if (suffix_match(v, parent)) {

                        remove[i] = 1
                        host_removed++

                        break
                      }
                    }
                  }
                }

                # ==================================================
                # 最终按照原始顺序输出
                # ==================================================

                for (i = 1; i <= total; i++) {

                  if (remove[i])
                    continue

                  print line[i]
                }

                # ==================================================
                # 统计
                # ==================================================

                removed_total =
                  duplicate_count +
                  keyword_removed +
                  suffix_removed +
                  host_removed

                if (removed_total > 0) {

                  print \
                    "Removed: " removed_total \
                    " (duplicate=" duplicate_count \
                    ", keyword=" keyword_removed \
                    ", suffix=" suffix_removed \
                    ", host=" host_removed ")" \
                    > "/dev/stderr"
                }
              }
            ' "$filepath" > "$tmp"

            # ====================================================
            # 只有真正变化才替换
            # ====================================================

            if ! cmp -s "$filepath" "$tmp"; then

              mv "$tmp" "$filepath"

              changed=1

              echo "Changed: $filepath"

            else

              rm -f "$tmp"

              echo "Unchanged: $filepath"

            fi

          done < <(
            find qx \
              -type f \
              -name '*.snippet' \
              -print0
          )

          echo
          echo "========================================"

          if [[ "$changed" == "1" ]]; then
            echo "Deduplication completed: files changed."
          else
            echo "Deduplication completed: no changes."
          fi

          echo "========================================"

      - name: Show changes
        run: |
          git status --short

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: deduplicate qx rules [skip ci]"
          branch: ${{ github.ref_name }}
          file_pattern: "qx/**/*.snippet"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
