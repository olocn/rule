name: Deduplicate QX Rules

on:
  workflow_dispatch:

  push:
    paths:
      - 'qx/*.snippet'
      - '.github/workflows/deduplicate-qx-rules.yml'

  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: deduplicate-qx-rules
  cancel-in-progress: false

jobs:
  deduplicate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ============================================================
      # 每个文件内部去重
      #
      # 规则：
      # 1. 完全相同的规则只保留第一次
      # 2. 比较时忽略大小写
      # 3. 比较时忽略逗号两侧空格
      # 4. 注释、空行原样保留
      #
      # host-suffix：
      #   host-suffix,example.com
      #       覆盖 host-suffix,a.example.com
      #
      #   host-suffix,example.com
      #       覆盖 host,example.com
      #       覆盖 host,a.example.com
      #
      # host-keyword：
      #   不做任何特殊覆盖处理
      # ============================================================

      - name: Deduplicate rules inside each file
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob

          for file in qx/*.snippet; do

            echo
            echo "========================================"
            echo "Processing: $file"
            echo "========================================"

            tmp=$(mktemp)
            stats=$(mktemp)

            # 保存原文件
            cp "$file" "$file.backup"

            awk '
            function trim(s) {
                gsub(/^[ \t]+/, "", s)
                gsub(/[ \t]+$/, "", s)
                return s
            }

            function normalize(s) {
                s = trim(s)

                # 逗号两边的空格不参与比较
                gsub(/[ \t]*,[ \t]*/, ",", s)

                # 不区分大小写
                return tolower(s)
            }

            function domain_normalize(s) {
                s = trim(s)
                s = tolower(s)

                # 删除末尾 .
                while (length(s) > 0 && substr(s, length(s), 1) == ".") {
                    s = substr(s, 1, length(s) - 1)
                }

                return s
            }

            # 判断 child 是否是 parent 的真正子域
            #
            # example:
            # a.example.com -> example.com   YES
            # b.a.example.com -> example.com  YES
            # example.com -> example.com      NO
            # badexample.com -> example.com   NO
            #
            function is_subdomain(child, parent, n) {

                if (child == "" || parent == "") {
                    return 0
                }

                if (length(child) <= length(parent)) {
                    return 0
                }

                n = length(child) - length(parent)

                return (
                    substr(child, n) == "." parent
                )
            }

            {
                raw = $0

                # ------------------------------------------------
                # 空行
                # ------------------------------------------------
                if (raw ~ /^[ \t]*$/) {
                    output[++count] = raw
                    next
                }

                # ------------------------------------------------
                # 注释
                # ------------------------------------------------
                if (raw ~ /^[ \t]*#/ ||
                    raw ~ /^[ \t]*;/ ||
                    raw ~ /^[ \t]*\/\//) {

                    output[++count] = raw
                    next
                }

                # ------------------------------------------------
                # 完全重复规则
                # ------------------------------------------------
                key = normalize(raw)

                if (key in seen) {
                    duplicate++
                    next
                }

                seen[key] = 1

                # ------------------------------------------------
                # 保存规则
                # ------------------------------------------------
                output[++count] = raw
                output_key[count] = key

                # ------------------------------------------------
                # 只识别 host / host-suffix
                #
                # host-keyword 不进入这里
                # ------------------------------------------------
                split(key, part, ",")

                rule_type = part[1]

                if (rule_type == "host" ||
                    rule_type == "host-suffix") {

                    if (length(part) >= 2) {

                        domain = domain_normalize(part[2])

                        # 空域名绝对不能参与覆盖
                        if (domain != "") {

                            if (rule_type == "host-suffix") {
                                suffix[++suffix_count] = domain
                            }

                        }
                    }
                }
            }

            END {

                # ==================================================
                # 第二阶段
                #
                # 注意：
                # 这里只删除明确被 host-suffix 覆盖的 host
                # 和 host-suffix。
                #
                # 其他规则全部原样输出。
                # ==================================================

                covered = 0

                for (i = 1; i <= count; i++) {

                    raw = output[i]

                    # 空行和注释直接输出
                    if (raw ~ /^[ \t]*$/ ||
                        raw ~ /^[ \t]*#/ ||
                        raw ~ /^[ \t]*;/ ||
                        raw ~ /^[ \t]*\/\//) {

                        print raw
                        continue
                    }

                    key = output_key[i]

                    split(key, part, ",")

                    rule_type = part[1]

                    # ------------------------------------------------
                    # 只有 host 和 host-suffix 才进行覆盖判断
                    #
                    # host-keyword 在这里完全不会进入
                    # ------------------------------------------------
                    if (rule_type != "host" &&
                        rule_type != "host-suffix") {

                        print raw
                        continue
                    }

                    if (length(part) < 2) {
                        print raw
                        continue
                    }

                    domain = domain_normalize(part[2])

                    if (domain == "") {
                        print raw
                        continue
                    }

                    is_covered = 0

                    # ------------------------------------------------
                    # host-suffix
                    #
                    # 父 suffix 覆盖子 suffix
                    #
                    # example.com
                    #   └── a.example.com
                    #       └── b.a.example.com
                    # ------------------------------------------------
                    if (rule_type == "host-suffix") {

                        for (j = 1; j <= suffix_count; j++) {

                            parent = suffix[j]

                            # 自己不能覆盖自己
                            if (parent == domain) {
                                continue
                            }

                            if (is_subdomain(domain, parent)) {
                                is_covered = 1
                                break
                            }
                        }
                    }

                    # ------------------------------------------------
                    # host
                    #
                    # host-suffix,example.com
                    #
                    # 覆盖：
                    #
                    # host,example.com
                    # host,a.example.com
                    # host,b.a.example.com
                    # ------------------------------------------------
                    if (rule_type == "host") {

                        for (j = 1; j <= suffix_count; j++) {

                            parent = suffix[j]

                            if (domain == parent ||
                                is_subdomain(domain, parent)) {

                                is_covered = 1
                                break
                            }
                        }
                    }

                    if (is_covered) {
                        covered++
                        next
                    }

                    print raw
                }

                print duplicate > "/tmp/qx_duplicate"
                print covered > "/tmp/qx_covered"
            }

            ' "$file" > "$tmp"

            # ========================================================
            # 安全检查
            #
            # 如果原文件有内容，而结果变成 0 字节：
            # 不修改原文件。
            # ========================================================

            original_size=$(wc -c < "$file")
            result_size=$(wc -c < "$tmp")

            duplicate=$(cat /tmp/qx_duplicate 2>/dev/null || echo 0)
            covered=$(cat /tmp/qx_covered 2>/dev/null || echo 0)

            if [ "$original_size" -gt 0 ] && [ "$result_size" -eq 0 ]; then

              echo "WARNING: Generated result is empty."
              echo "WARNING: Original file will NOT be modified."
              echo "WARNING: $file"

              rm -f "$tmp"
              cp "$file.backup" "$file"

              echo "  Duplicate removed: $duplicate"
              echo "  Covered rules removed: $covered"
              echo "  Changed: NO"

              continue
            fi

            # ========================================================
            # 比较文件
            # ========================================================

            if cmp -s "$file" "$tmp"; then

              echo "  Duplicate removed: $duplicate"
              echo "  Covered rules removed: $covered"
              echo "  Changed: NO"

              rm -f "$tmp"

            else

              mv "$tmp" "$file"

              echo "  Duplicate removed: $duplicate"
              echo "  Covered rules removed: $covered"
              echo "  Changed: YES"

            fi

            rm -f "$file.backup"

          done

      # ============================================================
      # 跨文件去重
      #
      # register > proxy
      # direct   > system
      #
      # apple 不参与
      #
      # 这里只做“完全相同规则”的去重。
      # 不做 host-suffix 覆盖。
      # ============================================================

      - name: Cross-file deduplication
        shell: bash
        run: |
          set -euo pipefail

          deduplicate_pair() {

            local keep="$1"
            local remove="$2"

            echo
            echo "========================================"
            echo "Cross-file:"
            echo "  Keep : $keep"
            echo "  Clean: $remove"
            echo "========================================"

            if [ ! -f "$keep" ]; then
              echo "  $keep does not exist."
              echo "  Skip."
              return
            fi

            if [ ! -f "$remove" ]; then
              echo "  $remove does not exist."
              echo "  Skip."
              return
            fi

            local tmp
            tmp=$(mktemp)

            awk '
            function trim(s) {
                gsub(/^[ \t]+/, "", s)
                gsub(/[ \t]+$/, "", s)
                return s
            }

            function normalize(s) {
                s = trim(s)

                # 忽略逗号两侧空格
                gsub(/[ \t]*,[ \t]*/, ",", s)

                # 忽略大小写
                return tolower(s)
            }

            # ========================================================
            # 第一个文件：优先保留
            # ========================================================

            FNR == NR {

                raw = $0

                # 注释和空行不参与跨文件比较
                if (raw !~ /^[ \t]*$/ &&
                    raw !~ /^[ \t]*#/ &&
                    raw !~ /^[ \t]*;/ &&
                    raw !~ /^[ \t]*\/\//) {

                    keep_rule[normalize(raw)] = 1
                }

                next
            }

            # ========================================================
            # 第二个文件
            # ========================================================

            {

                raw = $0

                # 注释和空行永远保留
                if (raw ~ /^[ \t]*$/ ||
                    raw ~ /^[ \t]*#/ ||
                    raw ~ /^[ \t]*;/ ||
                    raw ~ /^[ \t]*\/\//) {

                    print raw
                    next
                }

                key = normalize(raw)

                if (key in keep_rule) {
                    removed++
                    next
                }

                print raw
            }

            END {
                print removed + 0 > "/tmp/qx_cross_removed"
            }

            ' "$keep" "$remove" > "$tmp"

            local removed
            removed=$(cat /tmp/qx_cross_removed 2>/dev/null || echo 0)

            # ========================================================
            # 安全检查
            # ========================================================

            local original_size
            local result_size

            original_size=$(wc -c < "$remove")
            result_size=$(wc -c < "$tmp")

            if [ "$original_size" -gt 0 ] && [ "$result_size" -eq 0 ]; then

              echo "  WARNING: result is empty."
              echo "  Original file will NOT be modified."
              echo "  Removed: $removed"
              echo "  Changed: NO"

              rm -f "$tmp"
              return
            fi

            if cmp -s "$remove" "$tmp"; then

              echo "  Removed: $removed"
              echo "  Changed: NO"

              rm -f "$tmp"

            else

              mv "$tmp" "$remove"

              echo "  Removed: $removed"
              echo "  Changed: YES"

            fi
          }

          # ============================================================
          # register 优先
          # ============================================================

          deduplicate_pair \
            "qx/register.snippet" \
            "qx/proxy.snippet"

          # ============================================================
          # direct 优先
          # ============================================================

          deduplicate_pair \
            "qx/direct.snippet" \
            "qx/system.snippet"

      # ============================================================
      # 自动提交
      # ============================================================

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: deduplicate QX rules"
          file_pattern: "qx/*.snippet"
