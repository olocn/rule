name: Deduplicate QX Rules
on:
  workflow_dispatch:
  push:
    paths:
      - 'qx/**/*.snippet'
  schedule:
    - cron: '0 0 * * *'
permissions:
  contents: write
concurrency:
  group: deduplicate-qx-rules
  cancel-in-progress: false
jobs:
  deduplicate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Deduplicate QX rules
        shell: python
        run: |
          from pathlib import Path
          ROOT = Path("qx")
          total_duplicate = 0
          total_keyword = 0
          total_suffix = 0
          total_host = 0
          def normalize_domain(value):
              return value.strip().lower().rstrip(".")
          def parse_rule(line):
              text = line.strip()
              if not text:
                  return None
              if text.startswith("#") or text.startswith(";") or text.startswith("//"):
                  return None
              parts = [x.strip() for x in text.split(",")]
              if not parts:
                  return None
              rule_type = parts[0].lower()
              if len(parts) < 2:
                  return rule_type, None, parts
              return rule_type, normalize_domain(parts[1]), parts
          def is_comment_or_blank(line):
              s = line.strip()
              return (
                  not s
                  or s.startswith("#")
                  or s.startswith(";")
                  or s.startswith("//")
              )
          for path in sorted(ROOT.rglob("*.snippet")):
              print()
              print("=" * 50)
              print(f"Processing: {path}")
              print("=" * 50)
              original = path.read_text(encoding="utf-8")
              original_lines = original.splitlines(keepends=True)
              parsed = []
              seen = set()
              keywords = []
              suffixes = []
              duplicate_count = 0
              # ----------------------------------------
              # 第一阶段：
              # 保留顺序 + 删除完全重复规则
              # ----------------------------------------
              for line in original_lines:
                  if is_comment_or_blank(line):
                      parsed.append({
                          "line": line,
                          "type": None,
                          "domain": None,
                          "key": None,
                      })
                      continue
                  result = parse_rule(line)
                  if result is None:
                      parsed.append({
                          "line": line,
                          "type": None,
                          "domain": None,
                          "key": None,
                      })
                      continue
                  rule_type, domain, parts = result
                  # 完整规则字段作为重复判断依据
                  key = tuple(
                      x.strip().lower()
                      for x in parts
                  )
                  if key in seen:
                      duplicate_count += 1
                      continue
                  seen.add(key)
                  parsed.append({
                      "line": line,
                      "type": rule_type,
                      "domain": domain,
                      "key": key,
                  })
                  if rule_type == "host-keyword" and domain:
                      keywords.append(domain)
                  elif rule_type == "host-suffix" and domain:
                      suffixes.append(domain)
              # ----------------------------------------
              # 第二阶段：
              # host-keyword 优先
              # ----------------------------------------
              removed_keyword = set()
              for i, item in enumerate(parsed):
                  rule_type = item["type"]
                  domain = item["domain"]
                  if rule_type not in ("host", "host-suffix"):
                      continue
                  if not domain:
                      continue
                  for keyword in keywords:
                      if keyword in domain:
                          removed_keyword.add(i)
                          break
              # ----------------------------------------
              # 第三阶段：
              # host-suffix 覆盖子域
              # ----------------------------------------
              removed_suffix = set()
              # 去掉重复 suffix，避免自己匹配自己
              unique_suffixes = sorted(
                  set(suffixes),
                  key=len
              )
              for i, item in enumerate(parsed):
                  if i in removed_keyword:
                      continue
                  if item["type"] != "host-suffix":
                      continue
                  domain = item["domain"]
                  if not domain:
                      continue
                  for suffix in unique_suffixes:
                      if domain == suffix:
                          continue
                      if domain.endswith("." + suffix):
                          removed_suffix.add(i)
                          break
              # ----------------------------------------
              # 第四阶段：
              # host 被 host-suffix 覆盖
              # ----------------------------------------
              removed_host = set()
              for i, item in enumerate(parsed):
                  if i in removed_keyword:
                      continue
                  if item["type"] != "host":
                      continue
                  domain = item["domain"]
                  if not domain:
                      continue
                  for suffix in unique_suffixes:
                      if domain == suffix or domain.endswith("." + suffix):
                          removed_host.add(i)
                          break
              # ----------------------------------------
              # 最终输出
              # ----------------------------------------
              output = []
              for i, item in enumerate(parsed):
                  if i in removed_keyword:
                      continue
                  if i in removed_suffix:
                      continue
                  if i in removed_host:
                      continue
                  output.append(item["line"])
              new_content = "".join(output)
              # ----------------------------------------
              # 强制检查并写回
              # ----------------------------------------
              changed = new_content != original
              print(f"Original lines : {len(original_lines)}")
              print(f"New lines      : {len(output)}")
              print(f"Removed duplicate: {duplicate_count}")
              print(f"Removed by keyword: {len(removed_keyword)}")
              print(f"Removed by suffix: {len(removed_suffix)}")
              print(f"Removed host: {len(removed_host)}")
              print(f"Changed: {changed}")
              if changed:
                  path.write_text(
                      new_content,
                      encoding="utf-8",
                      newline=""
                  )
                  # 写回后立即验证
                  verify = path.read_text(encoding="utf-8")
                  if verify != new_content:
                      raise RuntimeError(
                          f"Write verification failed: {path}"
                      )
                  print(f"UPDATED: {path}")
              else:
                  print(f"UNCHANGED: {path}")
              total_duplicate += duplicate_count
              total_keyword += len(removed_keyword)
              total_suffix += len(removed_suffix)
              total_host += len(removed_host)
          print()
          print("=" * 50)
          print("TOTAL")
          print("=" * 50)
          print(f"Removed duplicate : {total_duplicate}")
          print(f"Removed keyword  : {total_keyword}")
          print(f"Removed suffix   : {total_suffix}")
          print(f"Removed host     : {total_host}")
          print(
              f"Removed total    : "
              f"{total_duplicate + total_keyword + total_suffix + total_host}"
          )
      - name: Check changes
        run: |
          echo "===== Git Status ====="
          git status --short
          echo
          echo "===== Git Diff ====="
          git diff -- qx/
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: deduplicate QX rules"
          file_pattern: "qx/**/*.snippet"
