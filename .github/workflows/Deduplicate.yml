name: Deduplicate QX Rules

on:
  workflow_dispatch:

  push:
    paths:
      - 'qx/**/*.snippet'

  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: deduplicate-qx-rules
  cancel-in-progress: false

jobs:
  dedupe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deduplicate QX rules
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d "qx" ]]; then
            echo "Directory 'qx' does not exist."
            exit 0
          fi

          changed=0

          while IFS= read -r -d '' filepath; do
            echo
            echo "========================================"
            echo "Processing: $filepath"
            echo "========================================"

            tmp="${filepath}.tmp"

            awk '
              BEGIN {
                IGNORECASE = 1
              }

              # ==================================================
              # 删除字符串首尾空白
              # ==================================================
              function trim(s) {
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", s)
                return s
              }

              # ==================================================
              # 规范化域名
              # ==================================================
              function normalize_domain(s) {
                s = trim(s)
                s = tolower(s)

                # 去掉末尾 .
                sub(/\.$/, "", s)

                return s
              }

              # ==================================================
              # 生成规则规范化 Key
              #
              # 用于识别：
              #
              # host-suffix,example.com
              # HOST-SUFFIX, example.com
              # host-suffix, example.com.
              #
              # 为同一条规则
              # ==================================================
              function normalize_rule(s,    n,prefix,value) {

                s = trim(s)

                n = split(s, parts, ",")

                if (n < 2) {
                  return tolower(s)
                }

                prefix = tolower(trim(parts[1]))
                value  = trim(parts[2])

                # ----------------------------------------------
                # 域名类规则
                # ----------------------------------------------
                if (
                  prefix == "host" ||
                  prefix == "host-suffix" ||
                  prefix == "host-keyword" ||
                  prefix == "host-wildcard" ||
                  prefix == "domain" ||
                  prefix == "domain-suffix" ||
                  prefix == "domain-keyword" ||
                  prefix == "domain-regex"
                ) {
                  value = normalize_domain(value)
                }

                return prefix "," tolower(value)
              }

              # ==================================================
              # 空行
              # ==================================================
              /^[[:space:]]*$/ {
                print
                next
              }

              # ==================================================
              # 注释
              # ==================================================
              /^[[:space:]]*(#|;|\/\/)/ {
                print
                next
              }

              {
                line = $0

                # =================================================
                # 1. 生成规范化 Key
                # =================================================
                key = normalize_rule(line)

                # =================================================
                # 2. 普通规则完全去重
                # =================================================
                if (key in seen) {
                  duplicate_count++
                  next
                }

                seen[key] = 1

                # =================================================
                # 3. host-suffix 单独记录
                #
                # 最后统一判断父子关系
                # =================================================
                n = split(line, parts, ",")

                if (
                  n >= 2 &&
                  tolower(trim(parts[1])) == "host-suffix"
                ) {

                  domain = normalize_domain(parts[2])

                  # 已经存在完全相同的 host-suffix
                  if (domain in suffix_seen) {
                    duplicate_count++
                    next
                  }

                  suffix_seen[domain] = 1

                  suffix_domain[++suffix_count] = domain
                  suffix_line[suffix_count] = line
                  suffix_key[suffix_count] = key

                  # 记录原始位置
                  suffix_position[suffix_count] = NR

                  next
                }

                # =================================================
                # 4. 普通规则记录
                # =================================================
                normal_line[++normal_count] = line
                normal_position[normal_count] = NR
              }

              END {

                # ==================================================
                # 5. 判断 host-suffix 是否被父域名覆盖
                # ==================================================
                for (i = 1; i <= suffix_count; i++) {

                  child = suffix_domain[i]
                  covered = 0

                  for (j = 1; j <= suffix_count; j++) {

                    if (i == j) {
                      continue
                    }

                    parent = suffix_domain[j]

                    # --------------------------------------------
                    # 完全相同已经在前面去重
                    # --------------------------------------------

                    # --------------------------------------------
                    # child 是 parent 的子域名
                    #
                    # a.example.com
                    #       ↓
                    # example.com
                    # --------------------------------------------
                    if (child ~ ("\\." parent "$")) {
                      covered = 1
                      break
                    }
                  }

                  if (!covered) {
                    keep_suffix[i] = 1
                  }
                }

                # ==================================================
                # 6. 合并普通规则 + host-suffix
                #    按原始文件行号恢复顺序
                # ==================================================

                for (i = 1; i <= normal_count; i++) {

                  output_position[++total] = normal_position[i]
                  output_line[total] = normal_line[i]
                }

                for (i = 1; i <= suffix_count; i++) {

                  if (keep_suffix[i]) {

                    output_position[++total] = suffix_position[i]
                    output_line[total] = suffix_line[i]
                  }
                }

                # ==================================================
                # 7. 按原始位置排序
                # ==================================================
                for (i = 1; i <= total; i++) {

                  for (j = i + 1; j <= total; j++) {

                    if (output_position[j] < output_position[i]) {

                      tmp_pos = output_position[i]
                      output_position[i] = output_position[j]
                      output_position[j] = tmp_pos

                      tmp_line = output_line[i]
                      output_line[i] = output_line[j]
                      output_line[j] = tmp_line
                    }
                  }
                }

                # ==================================================
                # 8. 输出
                # ==================================================
                for (i = 1; i <= total; i++) {
                  print output_line[i]
                }

                if (duplicate_count > 0) {
                  print \
                    "Removed duplicate/redundant rules: " \
                    duplicate_count \
                    > "/dev/stderr"
                }
              }
            ' "$filepath" > "$tmp"

            # ====================================================
            # 只有真正发生变化才替换
            # ====================================================
            if ! cmp -s "$filepath" "$tmp"; then
              mv "$tmp" "$filepath"
              changed=1
              echo "Changed: $filepath"
            else
              rm -f "$tmp"
              echo "Unchanged: $filepath"
            fi

          done < <(
            find qx \
              -type f \
              -name '*.snippet' \
              -print0
          )

          echo
          echo "========================================"
          if [[ "$changed" == "1" ]]; then
            echo "Deduplication completed: files changed."
          else
            echo "Deduplication completed: no changes."
          fi
          echo "========================================"

      - name: Show changes
        run: |
          git status --short

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: deduplicate qx rules [skip ci]"
          branch: ${{ github.ref_name }}
          file_pattern: "qx/**/*.snippet"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
