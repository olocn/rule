name: Deduplicate QX Rules

on:
  workflow_dispatch:

  push:
    paths:
      - 'qx/*.snippet'
      - '.github/workflows/deduplicate-qx-rules.yml'

  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: deduplicate-qx-rules
  cancel-in-progress: false

jobs:
  deduplicate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ============================================================
      # 文件内部去重
      #
      # 规则：
      # 1. 普通规则完全重复 → 删除后面的
      # 2. 比较时忽略大小写
      # 3. 忽略逗号两侧空格
      # 4. 注释和空行原样保留
      #
      # host-suffix：
      #   父域覆盖子域
      #
      # host-suffix,example.com
      #   ↓
      # host-suffix,a.example.com
      #
      # host-suffix,example.com
      #   ↓
      # host,example.com
      # host,a.example.com
      #
      # host-keyword 不参与任何覆盖判断
      # ============================================================

      - name: Deduplicate rules inside each file
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob

          for file in qx/*.snippet; do

            echo
            echo "========================================"
            echo "Processing: $file"
            echo "========================================"

            tmp=$(mktemp)

            # --------------------------------------------------------
            # 保存原文件
            # --------------------------------------------------------

            cp "$file" "$file.backup"

            awk '
            function trim(s) {
              gsub(/^[ \t]+/, "", s)
              gsub(/[ \t]+$/, "", s)
              return s
            }

            function normalize(s) {
              s = trim(s)
              gsub(/[ \t]*,[ \t]*/, ",", s)
              return tolower(s)
            }

            function domain_normalize(s) {
              s = trim(s)
              s = tolower(s)
              sub(/\.$/, "", s)
              return s
            }

            # child 是否是 parent 的子域
            function is_subdomain(child, parent, n) {

              if (child == "" || parent == "") {
                return 0
              }

              if (length(child) <= length(parent)) {
                return 0
              }

              n = length(child) - length(parent)

              if (substr(child, n) == "." parent) {
                return 1
              }

              return 0
            }

            {
              raw = $0

              # ------------------------------------------------------
              # 空行
              # ------------------------------------------------------

              if (raw ~ /^[ \t]*$/) {
                line[++count] = raw
                line_type[count] = "comment"
                next
              }

              # ------------------------------------------------------
              # 注释
              # ------------------------------------------------------

              if (raw ~ /^[ \t]*#/ ||
                  raw ~ /^[ \t]*;/ ||
                  raw ~ /^[ \t]*\/\//) {

                line[++count] = raw
                line_type[count] = "comment"
                next
              }

              # ------------------------------------------------------
              # 标准化规则
              # ------------------------------------------------------

              key = normalize(raw)

              # ------------------------------------------------------
              # 文件内部完全重复
              # ------------------------------------------------------

              if (key in seen) {
                duplicate++
                next
              }

              seen[key] = 1

              # ------------------------------------------------------
              # 保存
              # ------------------------------------------------------

              line[++count] = raw
              line_key[count] = key
              line_type[count] = "rule"

              # ------------------------------------------------------
              # 只收集 host-suffix
              #
              # host-keyword 完全不处理
              # ------------------------------------------------------

              split(key, part, ",")

              if (part[1] == "host-suffix" && length(part) >= 2) {

                domain = domain_normalize(part[2])

                if (domain != "") {
                  suffix[++suffix_count] = domain
                }
              }
            }

            END {

              # ------------------------------------------------------
              # 第二阶段
              # ------------------------------------------------------

              for (i = 1; i <= count; i++) {

                raw = line[i]

                # ----------------------------------------------------
                # 注释、空行
                # ----------------------------------------------------

                if (line_type[i] == "comment") {
                  print raw
                  continue
                }

                key = line_key[i]

                split(key, part, ",")

                rule_type = part[1]

                # ----------------------------------------------------
                # 非 host / host-suffix 规则
                #
                # 包括：
                # host-keyword
                # host-wildcard
                # geoip
                # user-agent
                # process-name
                # 等等
                #
                # 全部原样保留
                # ----------------------------------------------------

                if (rule_type != "host" && rule_type != "host-suffix") {
                  print raw
                  continue
                }

                if (length(part) < 2) {
                  print raw
                  continue
                }

                domain = domain_normalize(part[2])

                if (domain == "") {
                  print raw
                  continue
                }

                covered = 0

                # ----------------------------------------------------
                # host-suffix
                #
                # 父 suffix 覆盖子 suffix
                # ----------------------------------------------------

                if (rule_type == "host-suffix") {

                  for (j = 1; j <= suffix_count; j++) {

                    parent = suffix[j]

                    if (parent == domain) {
                      continue
                    }

                    if (is_subdomain(domain, parent)) {
                      covered = 1
                      break
                    }
                  }
                }

                # ----------------------------------------------------
                # host
                #
                # host-suffix,example.com
                # 覆盖：
                #
                # host,example.com
                # host,a.example.com
                # ----------------------------------------------------

                if (rule_type == "host") {

                  for (j = 1; j <= suffix_count; j++) {

                    parent = suffix[j]

                    if (domain == parent) {
                      covered = 1
                      break
                    }

                    if (is_subdomain(domain, parent)) {
                      covered = 1
                      break
                    }
                  }
                }

                if (covered) {
                  covered_count++
                  next
                }

                print raw
              }

              print duplicate > "/tmp/qx_duplicate_count"
              print covered_count > "/tmp/qx_covered_count"
            }

            ' "$file" > "$tmp"

            # --------------------------------------------------------
            # 读取统计
            # --------------------------------------------------------

            duplicate=$(cat /tmp/qx_duplicate_count 2>/dev/null || echo 0)
            covered=$(cat /tmp/qx_covered_count 2>/dev/null || echo 0)

            duplicate=${duplicate:-0}
            covered=${covered:-0}

            # --------------------------------------------------------
            # 安全检查
            #
            # 原文件有内容，结果却变成空文件：
            # 不修改原文件。
            # --------------------------------------------------------

            original_size=$(wc -c < "$file")
            result_size=$(wc -c < "$tmp")

            if [ "$original_size" -gt 0 ] && [ "$result_size" -eq 0 ]; then

              echo "WARNING: generated file is empty."
              echo "WARNING: original file preserved."
              echo "  Duplicate removed: $duplicate"
              echo "  Covered rules removed: $covered"
              echo "  Changed: NO"

              rm -f "$tmp"
              rm -f "$file.backup"

              continue
            fi

            # --------------------------------------------------------
            # 判断是否修改
            # --------------------------------------------------------

            if cmp -s "$file" "$tmp"; then

              echo "  Duplicate removed: $duplicate"
              echo "  Covered rules removed: $covered"
              echo "  Changed: NO"

              rm -f "$tmp"

            else

              mv "$tmp" "$file"

              echo "  Duplicate removed: $duplicate"
              echo "  Covered rules removed: $covered"
              echo "  Changed: YES"

            fi

            rm -f "$file.backup"

          done

      # ============================================================
      # 跨文件去重
      #
      # register > proxy
      # direct   > system
      #
      # apple 不参与
      #
      # 这里只进行“完全相同规则”的删除。
      # 不进行 host-suffix 覆盖。
      # ============================================================

      - name: Cross-file deduplication
        shell: bash
        run: |
          set -euo pipefail

          deduplicate_pair() {

            local keep="$1"
            local remove="$2"

            echo
            echo "========================================"
            echo "Cross-file deduplication"
            echo "Keep   : $keep"
            echo "Clean  : $remove"
            echo "========================================"

            if [ ! -f "$keep" ]; then
              echo "  $keep does not exist, skip."
              return
            fi

            if [ ! -f "$remove" ]; then
              echo "  $remove does not exist, skip."
              return
            fi

            local tmp
            tmp=$(mktemp)

            awk '
            function trim(s) {
              gsub(/^[ \t]+/, "", s)
              gsub(/[ \t]+$/, "", s)
              return s
            }

            function normalize(s) {
              s = trim(s)
              gsub(/[ \t]*,[ \t]*/, ",", s)
              return tolower(s)
            }

            # --------------------------------------------------------
            # 第一个文件：优先文件
            # --------------------------------------------------------

            FNR == NR {

              raw = $0

              if (raw !~ /^[ \t]*$/ &&
                  raw !~ /^[ \t]*#/ &&
                  raw !~ /^[ \t]*;/ &&
                  raw !~ /^[ \t]*\/\//) {

                keep_rule[normalize(raw)] = 1
              }

              next
            }

            # --------------------------------------------------------
            # 第二个文件
            # --------------------------------------------------------

            {

              raw = $0

              # 注释、空行永远保留
              if (raw ~ /^[ \t]*$/ ||
                  raw ~ /^[ \t]*#/ ||
                  raw ~ /^[ \t]*;/ ||
                  raw ~ /^[ \t]*\/\//) {

                print raw
                next
              }

              key = normalize(raw)

              if (key in keep_rule) {
                removed++
                next
              }

              print raw
            }

            END {
              print removed + 0 > "/tmp/qx_cross_removed"
            }

            ' "$keep" "$remove" > "$tmp"

            local removed
            removed=$(cat /tmp/qx_cross_removed 2>/dev/null || echo 0)

            # --------------------------------------------------------
            # 安全检查
            # --------------------------------------------------------

            local original_size
            local result_size

            original_size=$(wc -c < "$remove")
            result_size=$(wc -c < "$tmp")

            if [ "$original_size" -gt 0 ] && [ "$result_size" -eq 0 ]; then

              echo "  WARNING: generated file is empty."
              echo "  Original file preserved."
              echo "  Removed: $removed"
              echo "  Changed: NO"

              rm -f "$tmp"
              return
            fi

            if cmp -s "$remove" "$tmp"; then

              echo "  Removed: $removed"
              echo "  Changed: NO"

              rm -f "$tmp"

            else

              mv "$tmp" "$remove"

              echo "  Removed: $removed"
              echo "  Changed: YES"

            fi
          }

          # ----------------------------------------------------------
          # register 优先于 proxy
          # ----------------------------------------------------------

          deduplicate_pair \
            "qx/register.snippet" \
            "qx/proxy.snippet"

          # ----------------------------------------------------------
          # direct 优先于 system
          # ----------------------------------------------------------

          deduplicate_pair \
            "qx/direct.snippet" \
            "qx/system.snippet"

      # ============================================================
      # 自动提交
      # ============================================================

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: deduplicate QX rules"
          file_pattern: "qx/*.snippet"
