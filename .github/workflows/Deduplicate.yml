name: Deduplicate QX Rules

on:
  workflow_dispatch:

  push:
    paths:
      - 'qx/*.snippet'
      - '.github/workflows/deduplicate-qx-rules.yml'

  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: deduplicate-qx-rules
  cancel-in-progress: false

jobs:
  deduplicate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 1. 每个 snippet 内部去重
      # 2. host-suffix 父域覆盖子域
      # 3. host-suffix 覆盖 host
      # ------------------------------------------------------------
      - name: Deduplicate rules inside each file
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob

          for file in qx/*.snippet; do
            echo "Processing: $file"

            tmp="${file}.tmp"
            backup="${file}.bak"

            cp "$file" "$backup"

            awk '
            function trim(s) {
              gsub(/^[ \t]+|[ \t]+$/, "", s)
              return s
            }

            function normalize_rule(s,    a,i) {
              s = trim(s)

              # 去掉逗号两侧空格
              gsub(/[ \t]*,[ \t]*/, ",", s)

              # 规则比较不区分大小写
              return tolower(s)
            }

            function normalize_domain(s) {
              s = trim(s)
              s = tolower(s)

              # 删除末尾的 .
              sub(/\.$/, "", s)

              return s
            }

            # child 是否为 parent 的真正子域
            function is_subdomain(child, parent) {
              return (
                length(child) > length(parent) &&
                substr(child, length(child) - length(parent)) == "." parent
              )
            }

            {
              raw = $0

              # --------------------------------------------------
              # 注释、空行原样保留
              # --------------------------------------------------
              if (raw ~ /^[ \t]*$/ ||
                  raw ~ /^[ \t]*#/ ||
                  raw ~ /^[ \t]*;/ ||
                  raw ~ /^[ \t]*\/\//) {
                print raw
                next
              }

              rule = normalize_rule(raw)

              # --------------------------------------------------
              # 普通规则精确去重
              # --------------------------------------------------
              if (seen[rule]++) {
                duplicate++
                next
              }

              # --------------------------------------------------
              # host / host-suffix 收集
              # --------------------------------------------------
              split(rule, p, ",")

              type = p[1]
              domain = ""

              if (type == "host" || type == "host-suffix") {
                if (length(p) >= 2) {
                  domain = normalize_domain(p[2])
                }

                # 空域名绝对不能参与覆盖判断
                if (domain != "") {
                  if (type == "host-suffix") {
                    suffix[++suffix_count] = domain
                  } else if (type == "host") {
                    host[++host_count] = domain
                  }
                }
              }

              line[++line_count] = raw
              line_rule[line_count] = rule
            }

            END {
              # --------------------------------------------------
              # 第二阶段：
              # 根据 host-suffix 判断哪些 host / host-suffix
              # 被前面的父域覆盖
              # --------------------------------------------------

              for (i = 1; i <= line_count; i++) {
                rule = line_rule[i]

                split(rule, p, ",")
                type = p[1]

                if (type != "host" && type != "host-suffix") {
                  print line[i]
                  continue
                }

                if (length(p) < 2) {
                  print line[i]
                  continue
                }

                domain = normalize_domain(p[2])

                if (domain == "") {
                  print line[i]
                  continue
                }

                covered = 0

                # ----------------------------------------------
                # host-suffix：
                # 如果存在更大的父域，则当前 suffix 被覆盖
                # ----------------------------------------------
                if (type == "host-suffix") {
                  for (j = 1; j <= suffix_count; j++) {
                    parent = suffix[j]

                    if (parent == domain) {
                      continue
                    }

                    if (is_subdomain(domain, parent)) {
                      covered = 1
                      break
                    }
                  }
                }

                # ----------------------------------------------
                # host：
                # host-suffix,example.com
                # 覆盖：
                # host,example.com
                # host,a.example.com
                # ----------------------------------------------
                if (type == "host") {
                  for (j = 1; j <= suffix_count; j++) {
                    parent = suffix[j]

                    if (domain == parent ||
                        is_subdomain(domain, parent)) {
                      covered = 1
                      break
                    }
                  }
                }

                if (covered) {
                  covered_count++
                  next
                }

                print line[i]
              }

              print "__QX_STATS__" > "/dev/stderr"
              print duplicate, covered_count, line_count > "/dev/stderr"
            }
            ' "$file" > "$tmp" 2> "${tmp}.stats"

            # ------------------------------------------------------
            # 保护机制
            # ------------------------------------------------------

            # 原文件大小
            original_size=$(wc -c < "$file")
            result_size=$(wc -c < "$tmp")

            # 如果原文件非空，而结果完全为空：
            # 绝对不覆盖原文件
            if [ "$original_size" -gt 0 ] && [ "$result_size" -eq 0 ]; then
              echo "ERROR: $file generated an empty result."
              echo "Original file has been preserved."
              rm -f "$tmp" "${tmp}.stats"
              cp "$backup" "$file"
              exit 1
            fi

            # 删除统计信息中的临时输出
            stats=$(cat "${tmp}.stats" || true)

            duplicate=$(echo "$stats" | tail -n 1 | awk '{print $1}')
            covered=$(echo "$stats" | tail -n 1 | awk '{print $2}')

            duplicate=${duplicate:-0}
            covered=${covered:-0}

            # ------------------------------------------------------
            # 比较是否发生变化
            # ------------------------------------------------------
            if cmp -s "$file" "$tmp"; then
              echo "  Duplicate removed: $duplicate"
              echo "  Covered rules removed: $covered"
              echo "  Changed: NO"

              rm -f "$tmp"
            else
              mv "$tmp" "$file"

              echo "  Duplicate removed: $duplicate"
              echo "  Covered rules removed: $covered"
              echo "  Changed: YES"
            fi

            rm -f "${tmp}.stats" "$backup"
          done

      # ------------------------------------------------------------
      # 跨文件精确去重
      #
      # register > proxy
      # direct   > system
      #
      # apple 完全不参与
      # ------------------------------------------------------------
      - name: Deduplicate between selected files
        shell: bash
        run: |
          set -euo pipefail

          deduplicate_pair() {
            local keep="$1"
            local remove="$2"

            echo
            echo "Cross-file deduplication:"
            echo "  Keep : $keep"
            echo "  Remove duplicates from: $remove"

            [ -f "$keep" ] || {
              echo "  $keep does not exist, skip."
              return
            }

            [ -f "$remove" ] || {
              echo "  $remove does not exist, skip."
              return
            }

            local tmp="${remove}.tmp"

            awk '
            function trim(s) {
              gsub(/^[ \t]+|[ \t]+$/, "", s)
              return s
            }

            function normalize(s) {
              s = trim(s)
              gsub(/[ \t]*,[ \t]*/, ",", s)
              return tolower(s)
            }

            # 读取优先级文件
            FILENAME == ARGV[1] {
              if ($0 !~ /^[ \t]*$/ &&
                  $0 !~ /^[ \t]*#/ &&
                  $0 !~ /^[ \t]*;/ &&
                  $0 !~ /^[ \t]*\/\//) {
                keep_rule[normalize($0)] = 1
              }
              next
            }

            # 处理低优先级文件
            {
              raw = $0

              # 注释、空行永远保留
              if (raw ~ /^[ \t]*$/ ||
                  raw ~ /^[ \t]*#/ ||
                  raw ~ /^[ \t]*;/ ||
                  raw ~ /^[ \t]*\/\//) {
                print raw
                next
              }

              rule = normalize(raw)

              if (rule in keep_rule) {
                removed++
                next
              }

              print raw
            }

            END {
              print "__QX_CROSS_STATS__ " removed > "/dev/stderr"
            }
            ' "$keep" "$remove" > "$tmp" 2> "${tmp}.stats"

            local removed
            removed=$(awk '{print $2}' "${tmp}.stats" | tail -n 1)
            removed=${removed:-0}

            if cmp -s "$remove" "$tmp"; then
              echo "  Removed: $removed"
              echo "  Changed: NO"
              rm -f "$tmp"
            else
              mv "$tmp" "$remove"

              echo "  Removed: $removed"
              echo "  Changed: YES"
            fi

            rm -f "${tmp}.stats"
          }

          # register 优先于 proxy
          deduplicate_pair \
            "qx/register.snippet" \
            "qx/proxy.snippet"

          # direct 优先于 system
          deduplicate_pair \
            "qx/direct.snippet" \
            "qx/system.snippet"

      # ------------------------------------------------------------
      # Git 自动提交
      # ------------------------------------------------------------
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: deduplicate QX rules"
          file_pattern: "qx/*.snippet"
