name: Deduplicate QX Rules

on:
  workflow_dispatch:

  push:
    paths:
      - 'qx/*.snippet'
      - '.github/workflows/deduplicate-qx-rules.yml'

  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: deduplicate-qx-rules
  cancel-in-progress: false

jobs:
  deduplicate:
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # Checkout
      # ========================================
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # ========================================
      # Deduplicate QX Rules
      # ========================================
      - name: Deduplicate QX Rules
        shell: bash
        run: |
          set -euo pipefail

          ROOT="qx"

          total_duplicate=0
          total_suffix=0
          total_host=0
          total_cross_file=0

          mapfile -t files < <(
            find "$ROOT" \
              -maxdepth 1 \
              -type f \
              -name "*.snippet" \
              | sort
          )

          echo "========================================"
          echo "QX Rule Deduplication"
          echo "========================================"
          echo "Found ${#files[@]} snippet files"


          if [ "${#files[@]}" -eq 0 ]; then
            echo "No .snippet files found."
            exit 0
          fi


          # ============================================================
          # 1. 文件内部：完全相同规则去重
          #
          # host-keyword 不参与覆盖
          # ============================================================

          for file in "${files[@]}"; do

            tmp="${file}.tmp"
            count_file="${file}.count"

            awk '
              /^[[:space:]]*$/ {
                print
                next
              }

              /^[[:space:]]*#/ {
                print
                next
              }

              /^[[:space:]]*;/ {
                print
                next
              }

              /^[[:space:]]*\/\// {
                print
                next
              }

              {
                key=tolower($0)
                gsub(/[[:space:]]*,[[:space:]]*/, ",", key)

                if (seen[key]++) {
                  duplicate++
                  next
                }

                print
              }

              END {
                print duplicate + 0 > count_file
              }
            ' count_file="$count_file" "$file" > "$tmp"

            count=$(cat "$count_file")
            rm -f "$count_file"

            # 防止异常情况下生成空文件覆盖原文件
            if [ ! -s "$tmp" ] && [ -s "$file" ]; then
              echo "ERROR: generated empty file, keeping original: $file"
              rm -f "$tmp"
              exit 1
            fi

            if ! cmp -s "$file" "$tmp"; then
              mv "$tmp" "$file"
              changed="YES"
            else
              rm -f "$tmp"
              changed="NO"
            fi

            echo
            echo "$file"
            echo "  Duplicate removed: $count"
            echo "  Changed: $changed"

            total_duplicate=$((total_duplicate + count))

          done


          # ============================================================
          # 2. host-suffix / host 覆盖
          #
          # host-keyword 完全不参与
          #
          # host-suffix 父域：
          #
          # example.com
          #
          # 覆盖：
          #
          # a.example.com
          # b.a.example.com
          #
          # 同时 host：
          #
          # example.com
          # a.example.com
          #
          # 也会被 suffix 覆盖
          # ============================================================

          for file in "${files[@]}"; do

            tmp="${file}.tmp"
            count_file="${file}.count"

            awk '
              {
                lines[NR]=$0

                if ($0 ~ /^[[:space:]]*$/)
                  next

                if ($0 ~ /^[[:space:]]*#/)
                  next

                if ($0 ~ /^[[:space:]]*;/)
                  next

                if ($0 ~ /^[[:space:]]*\/\//)
                  next

                n=split($0, f, ",")

                type=f[1]
                domain=f[2]

                gsub(/^[[:space:]]+|[[:space:]]+$/, "", type)
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", domain)

                type=tolower(type)
                domain=tolower(domain)

                sub(/\.$/, "", domain)

                if (type == "host-suffix" && domain != "")
                  suffix[NR]=domain

                if (type == "host" && domain != "")
                  hosts[NR]=domain
              }

              END {

                # ------------------------------------------------------
                # host-suffix 父域覆盖子域
                # ------------------------------------------------------

                for (i in suffix) {

                  child=suffix[i]

                  for (j in suffix) {

                    if (i == j)
                      continue

                    parent=suffix[j]

                    if (child == parent)
                      continue

                    # child 必须是：
                    # xxx.parent
                    #
                    # 直接使用 substr 判断结尾
                    suffix_part=substr(
                      child,
                      length(child)-length(parent)+1
                    )

                    if (
                      length(child) > length(parent) &&
                      suffix_part == "." parent
                    ) {
                      remove_suffix[i]=1
                      break
                    }
                  }
                }


                # ------------------------------------------------------
                # host 被 host-suffix 覆盖
                # ------------------------------------------------------

                for (i in hosts) {

                  domain=hosts[i]

                  for (j in suffix) {

                    parent=suffix[j]

                    if (domain == parent) {
                      remove_host[i]=1
                      break
                    }

                    if (length(domain) > length(parent)) {

                      suffix_part=substr(
                        domain,
                        length(domain)-length(parent)+1
                      )

                      if (suffix_part == "." parent) {
                        remove_host[i]=1
                        break
                      }
                    }
                  }
                }


                # ------------------------------------------------------
                # 输出
                # ------------------------------------------------------

                for (i=1; i<=NR; i++) {

                  if (remove_suffix[i]) {
                    suffix_count++
                    continue
                  }

                  if (remove_host[i]) {
                    host_count++
                    continue
                  }

                  print lines[i]
                }

                print suffix_count + 0 > count_file
                print host_count + 0 >> count_file
              }
            ' count_file="$count_file" "$file" > "$tmp"

            suffix_count=$(sed -n '1p' "$count_file")
            host_count=$(sed -n '2p' "$count_file")

            rm -f "$count_file"

            # ========================================================
            # 极其重要：
            # 如果原文件有内容，但处理结果为空，直接终止 Workflow
            # 防止规则文件被错误清空
            # ========================================================

            if [ ! -s "$tmp" ] && [ -s "$file" ]; then
              echo
              echo "ERROR: safety check failed!"
              echo "Generated empty file: $file"
              echo "Original file will NOT be modified."
              rm -f "$tmp"
              exit 1
            fi

            if ! cmp -s "$file" "$tmp"; then
              mv "$tmp" "$file"
              changed="YES"
            else
              rm -f "$tmp"
              changed="NO"
            fi

            echo
            echo "$file"
            echo "  Suffix removed: $suffix_count"
            echo "  Host removed:   $host_count"
            echo "  Changed:        $changed"

            total_suffix=$((total_suffix + suffix_count))
            total_host=$((total_host + host_count))

          done


          # ============================================================
          # 3. 跨文件完全重复规则
          #
          # 只有下面两组：
          #
          # register > proxy
          # direct   > system
          #
          # 其他文件绝对不参与
          # ============================================================

          deduplicate_pair() {

            keep="$ROOT/$1"
            remove="$ROOT/$2"

            echo
            echo "========================================"
            echo "Cross-file: $1 > $2"
            echo "========================================"

            if [ ! -f "$keep" ]; then
              echo "Skip: $keep not found"
              return
            fi

            if [ ! -f "$remove" ]; then
              echo "Skip: $remove not found"
              return
            fi

            tmp="${remove}.tmp"
            count_file="${remove}.count"

            awk '
              FNR == NR {

                if ($0 ~ /^[[:space:]]*$/)
                  next

                if ($0 ~ /^[[:space:]]*#/)
                  next

                if ($0 ~ /^[[:space:]]*;/)
                  next

                if ($0 ~ /^[[:space:]]*\/\//)
                  next

                key=tolower($0)
                gsub(/[[:space:]]*,[[:space:]]*/, ",", key)

                keep_rule[key]=1

                next
              }

              {
                if ($0 ~ /^[[:space:]]*$/) {
                  print
                  next
                }

                if ($0 ~ /^[[:space:]]*#/) {
                  print
                  next
                }

                if ($0 ~ /^[[:space:]]*;/) {
                  print
                  next
                }

                if ($0 ~ /^[[:space:]]*\/\//) {
                  print
                  next
                }

                key=tolower($0)
                gsub(/[[:space:]]*,[[:space:]]*/, ",", key)

                if (keep_rule[key]) {
                  removed++
                  next
                }

                print
              }

              END {
                print removed + 0 > count_file
              }
            ' count_file="$count_file" "$keep" "$remove" > "$tmp"

            count=$(cat "$count_file")
            rm -f "$count_file"

            # ========================================================
            # 安全检查
            # ========================================================

            if [ ! -s "$tmp" ] && [ -s "$remove" ]; then
              echo
              echo "ERROR: cross-file processing generated empty file!"
              echo "File: $remove"
              echo "Original file will NOT be modified."
              rm -f "$tmp"
              exit 1
            fi

            if ! cmp -s "$remove" "$tmp"; then
              mv "$tmp" "$remove"
              changed="YES"
            else
              rm -f "$tmp"
              changed="NO"
            fi

            echo "Cross-file removed: $count"
            echo "Changed: $changed"

            total_cross_file=$((total_cross_file + count))
          }


          # register 优先于 proxy
          deduplicate_pair \
            "register.snippet" \
            "proxy.snippet"


          # direct 优先于 system
          deduplicate_pair \
            "direct.snippet" \
            "system.snippet"


          # ============================================================
          # 4. 总统计
          # ============================================================

          total=$(
            awk \
              -v a="$total_duplicate" \
              -v b="$total_suffix" \
              -v c="$total_host" \
              -v d="$total_cross_file" \
              'BEGIN { print a+b+c+d }'
          )

          echo
          echo "========================================"
          echo "TOTAL"
          echo "========================================"
          echo "Duplicate removed : $total_duplicate"
          echo "Suffix removed    : $total_suffix"
          echo "Host removed      : $total_host"
          echo "Cross-file removed: $total_cross_file"
          echo "----------------------------------------"
          echo "Total removed     : $total"


      # ========================================
      # Check changes
      # ========================================
      - name: Check changes
        shell: bash
        run: |
          echo "========================================"
          echo "Git Status"
          echo "========================================"

          git status --short

          echo
          echo "========================================"
          echo "Git Diff"
          echo "========================================"

          git diff -- qx/*.snippet


      # ========================================
      # Auto Commit
      # ========================================
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: deduplicate QX rules"
          file_pattern: "qx/*.snippet"
