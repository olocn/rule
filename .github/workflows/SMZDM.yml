name: SMZDM Price Monitor

on:
  schedule:
    # 北京时间 06:30 - 22:30，每 2 小时触发一次
    - cron: '30 0,2,4,6,8,10,12,14,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install requests beautifulsoup4

      - name: 运行内嵌监控脚本
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SMZDM_COOKIE: ${{ secrets.SMZDM_COOKIE }}
        run: |
          python - << 'EOF'
          import os
          import re
          import sys
          import time
          from urllib.parse import quote
          import requests
          from bs4 import BeautifulSoup

          # 监控配置
          WATCH_LIST = [
              {"keyword": "AirPods Pro 2", "max_price": 1399.0},
          ]
          FETCH_PAGES = 2
          CACHE_FILE = "seen_deals.txt"

          BARK_KEY = os.getenv("BARK_KEY", "").strip()
          WECOM_WEBHOOK = os.getenv("WECOM_WEBHOOK", "").strip()
          SMZDM_COOKIE = os.getenv("SMZDM_COOKIE", "").strip()

          def load_seen():
              if os.path.exists(CACHE_FILE):
                  with open(CACHE_FILE, "r", encoding="utf-8") as f:
                      return set(line.strip() for line in f if line.strip())
              return set()

          def save_seen(seen_set):
              recent = list(seen_set)[-500:]
              with open(CACHE_FILE, "w", encoding="utf-8") as f:
                  f.write("\n".join(recent))

          def extract_price(price_str: str):
              clean_str = price_str.replace(",", "")
              match = re.search(r"(\d+(?:\.\d+)?)", clean_str)
              return float(match.group(1)) if match else None

          def push_notification(title: str, price: str, url: str, extras: str):
              if BARK_KEY:
                  try:
                      requests.post(
                          f"https://api.day.app/{BARK_KEY}",
                          json={
                              "title": f"好价: {price}",
                              "body": f"{title}\n{extras}",
                              "url": url,
                              "group": "什么值得买",
                              "icon": "https://res.smzdm.com/images/favicon.ico",
                          },
                          timeout=8,
                      )
                  except Exception as e:
                      print(f"[Bark] 推送失败: {e}")

              if WECOM_WEBHOOK:
                  try:
                      requests.post(
                          WECOM_WEBHOOK,
                          json={
                              "msgtype": "markdown",
                              "markdown": {
                                  "content": (
                                      f"### 🔔 什么值得买好价提醒\n"
                                      f"> **商品**：[{title}]({url})\n"
                                      f"> **价格**：<font color=\"warning\">{price}</font>\n"
                                      f"> **标签/渠道**：{extras or '站内爆料'}"
                                  )
                              },
                          },
                          timeout=8,
                      )
                  except Exception as e:
                      print(f"[企微] 推送失败: {e}")

          def fetch_deals_by_keyword(keyword: str, pages: int = 2):
              deals = []
              headers = {
                  "User-Agent": (
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
                  ),
                  "Referer": "https://www.smzdm.com/",
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                  "Accept-Language": "zh-CN,zh;q=0.9",
              }
              if SMZDM_COOKIE:
                  headers["Cookie"] = SMZDM_COOKIE

              for page in range(1, pages + 1):
                  url = f"https://search.smzdm.com/?c=home&s={quote(keyword)}&order=time&v=a&mx_v=a&p={page}"
                  try:
                      resp = requests.get(url, headers=headers, timeout=12)
                      if resp.status_code == 403:
                          print("⚠️ 遇到 HTTP 403 阻断，建议在 GitHub Secrets 配置 SMZDM_COOKIE。")
                          break
                      if resp.status_code != 200:
                          break
                  except Exception:
                      break

                  soup = BeautifulSoup(resp.text, "html.parser")
                  rows = soup.select(".feed-row-wide") or soup.select(".feed-row")
                  if not rows:
                      break

                  for row in rows:
                      title_block = row.select_one(".feed-block-title")
                      if not title_block:
                          continue
                      links = title_block.find_all("a")
                      if not links:
                          continue

                      link = links[0].get("href", "")
                      if link.startswith("//"):
                          link = "https:" + link

                      price_el = row.select_one(".z-highlight") or (links[1] if len(links) > 1 else None)
                      price_str = price_el.get_text(strip=True) if price_el else ""
                      extras_el = row.select_one(".feed-block-extras")
                      extras = extras_el.get_text(separator=" ", strip=True) if extras_el else ""

                      deals.append({
                          "title": links[0].get_text(strip=True),
                          "price_str": price_str,
                          "link": link,
                          "extras": extras,
                      })
                  time.sleep(1)
              return deals

          seen_ids = load_seen()
          is_initial_run = (len(seen_ids) == 0)
          new_found = False

          for item in WATCH_LIST:
              keyword = item["keyword"]
              max_price = item.get("max_price")
              deals = fetch_deals_by_keyword(keyword, pages=FETCH_PAGES)

              for deal in reversed(deals):
                  deal_id = deal["link"]
                  if not deal_id or deal_id in seen_ids:
                      continue

                  seen_ids.add(deal_id)
                  new_found = True

                  if is_initial_run:
                      continue

                  price_num = extract_price(deal["price_str"])
                  if max_price is not None and (price_num is None or price_num > max_price):
                      continue

                  push_notification(deal["title"], deal["price_str"], deal["link"], deal["extras"])

          if new_found:
              save_seen(seen_ids)
          EOF

      # 使用原生 Git 命令提交，不依赖任何第三方插件
      - name: 自动保存排重缓存
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_deals.txt
          # 仅当文件发生变动时才提交，避免报空提交错误
          git diff --staged --quiet || (git commit -m "chore: update seen deals cache [skip ci]" && git push)
