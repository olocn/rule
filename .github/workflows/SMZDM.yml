name: SMZDM Price

on:
  schedule:
    # 北京时间 06:30 - 22:30，每 2 小时触发一次（23:00 至次日 06:30 静默）
    # 对应 UTC: 22:30(前日), 00:30, 02:30, 04:30, 06:30, 08:30, 10:30, 12:30, 14:30
    - cron: '30 0,2,4,6,8,10,12,14,22 * * *'
  workflow_dispatch: # 支持网页手动点击运行

permissions:
  contents: write    # 赋予工作流自动提交去重记录文件的写权限

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装网络与解析依赖
        run: |
          pip install requests beautifulsoup4

      - name: 运行内嵌监控脚本
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SMZDM_COOKIE: ${{ secrets.SMZDM_COOKIE }}
        run: |
          python - << 'EOF'
          import os
          import re
          import sys
          import time
          from urllib.parse import quote
          import requests
          from bs4 import BeautifulSoup

          # ==================== 监控商品与阈值 ====================
          # 在此配置想要监控的商品及心理入手价（支持添加多款）
          WATCH_LIST = [
              {"keyword": "AirPods Pro 2", "max_price": 1399.0},
              # {"keyword": "索尼 WH-1000XM5", "max_price": 1799.0},
              # {"keyword": "Switch OLED", "max_price": 1400.0},
          ]
          FETCH_PAGES = 2                 # 每次巡检查看前 2 页，避免漏掉热门好价
          CACHE_FILE = "seen_deals.txt"   # 排重文件名

          # 从 GitHub Secrets 读取凭据
          BARK_KEY = os.getenv("BARK_KEY", "").strip()
          WECOM_WEBHOOK = os.getenv("WECOM_WEBHOOK", "").strip()
          SMZDM_COOKIE = os.getenv("SMZDM_COOKIE", "").strip()
          # ========================================================


          def load_seen():
              if os.path.exists(CACHE_FILE):
                  with open(CACHE_FILE, "r", encoding="utf-8") as f:
                      return set(line.strip() for line in f if line.strip())
              return set()


          def save_seen(seen_set):
              recent = list(seen_set)[-500:]  # 仅保留最近 500 条记录防止文件过大
              with open(CACHE_FILE, "w", encoding="utf-8") as f:
                  f.write("\n".join(recent))


          def extract_price(price_str: str):
              # 过滤可能存在的千分位逗号并提取数字
              clean_str = price_str.replace(",", "")
              match = re.search(r"(\d+(?:\.\d+)?)", clean_str)
              return float(match.group(1)) if match else None


          def push_notification(title: str, price: str, url: str, extras: str):
              # 1. iOS Bark 推送
              if BARK_KEY:
                  try:
                      requests.post(
                          f"https://api.day.app/{BARK_KEY}",
                          json={
                              "title": f"好价: {price}",
                              "body": f"{title}\n{extras}",
                              "url": url,
                              "group": "什么值得买",
                              "icon": "https://res.smzdm.com/images/favicon.ico",
                          },
                          timeout=8,
                      )
                  except Exception as e:
                      print(f"[Bark] 推送失败: {e}")

              # 2. 企业微信机器人推送
              if WECOM_WEBHOOK:
                  try:
                      requests.post(
                          WECOM_WEBHOOK,
                          json={
                              "msgtype": "markdown",
                              "markdown": {
                                  "content": (
                                      f"### 🔔 什么值得买好价提醒\n"
                                      f"> **商品**：[{title}]({url})\n"
                                      f"> **价格**：<font color=\"warning\">{price}</font>\n"
                                      f"> **标签/渠道**：{extras or '站内爆料'}"
                                  )
                              },
                          },
                          timeout=8,
                      )
                  except Exception as e:
                      print(f"[企微] 推送失败: {e}")


          def fetch_deals_by_keyword(keyword: str, pages: int = 2):
              deals = []
              headers = {
                  "User-Agent": (
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
                  ),
                  "Referer": "https://www.smzdm.com/",
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                  "Accept-Language": "zh-CN,zh;q=0.9",
              }
              if SMZDM_COOKIE:
                  headers["Cookie"] = SMZDM_COOKIE

              for page in range(1, pages + 1):
                  url = f"https://search.smzdm.com/?c=home&s={quote(keyword)}&order=time&v=a&mx_v=a&p={page}"
                  try:
                      resp = requests.get(url, headers=headers, timeout=12)
                      if resp.status_code == 403:
                          print("⚠️ 访问遇到 HTTP 403 阻断，建议在 GitHub Secrets 配置 SMZDM_COOKIE。")
                          break
                      if resp.status_code != 200:
                          print(f"[{keyword}] 第 {page} 页拉取异常: HTTP {resp.status_code}")
                          break
                  except Exception as e:
                      print(f"[{keyword}] 请求超时: {e}")
                      break

                  soup = BeautifulSoup(resp.text, "html.parser")
                  rows = soup.select(".feed-row-wide") or soup.select(".feed-row")
                  if not rows:
                      break

                  for row in rows:
                      title_block = row.select_one(".feed-block-title")
                      if not title_block:
                          continue

                      links = title_block.find_all("a")
                      if not links:
                          continue

                      title = links[0].get_text(strip=True)
                      link = links[0].get("href", "")
                      if link.startswith("//"):
                          link = "https:" + link

                      price_el = row.select_one(".z-highlight") or (links[1] if len(links) > 1 else None)
                      price_str = price_el.get_text(strip=True) if price_el else ""

                      extras_el = row.select_one(".feed-block-extras")
                      extras = extras_el.get_text(separator=" ", strip=True) if extras_el else ""

                      deals.append({
                          "title": title,
                          "price_str": price_str,
                          "link": link,
                          "extras": extras,
                      })

                  time.sleep(1)

              return deals


          def main():
              seen_ids = load_seen()
              is_initial_run = (len(seen_ids) == 0)
              new_found = False

              print(f"[{time.strftime('%Y-%m-%d %H:%M:%S')}] 巡检开始...")

              for item in WATCH_LIST:
                  keyword = item["keyword"]
                  max_price = item.get("max_price")
                  deals = fetch_deals_by_keyword(keyword, pages=FETCH_PAGES)
                  print(f"关键词「{keyword}」共解析出 {len(deals)} 条内容")

                  for deal in reversed(deals):
                      deal_id = deal["link"]
                      if not deal_id or deal_id in seen_ids:
                          continue

                      seen_ids.add(deal_id)
                      new_found = True

                      # 初次启动收录当前历史，不触发旧好价轰炸
                      if is_initial_run:
                          continue

                      price_num = extract_price(deal["price_str"])
                      if max_price is not None:
                          if price_num is None or price_num > max_price:
                              continue

                      print(f"🎯 命中目标价: {deal['title']} | {deal['price_str']}")
                      push_notification(
                          title=deal["title"],
                          price=deal["price_str"],
                          url=deal["link"],
                          extras=deal["extras"],
                      )

              if is_initial_run:
                  print("初始化成功：已将当前商品收录至基线库，后续出现新低价将即时推送。")

              if new_found:
                  save_seen(seen_ids)


          if __name__ == "__main__":
              main()
          EOF

      - name: 保存排重记录（自动提交更改）
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update seen deals cache [skip ci]"
          file_pattern: "seen_deals.txt"
          skip_dirty_check: false

      - name: 防止 GitHub 60 天无提交导致 Action 休眠
        uses: gautamkrishnar/keepalive-workflow@v2
