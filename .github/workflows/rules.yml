name: Convert Rules to Surge and QX

on:
  push:
    branches:
      - master
    paths:
      - 'direct.txt'
      - 'proxy.txt'
      - 'ad.txt'
    paths-ignore:
      - 'surge/**'
      - 'qx/**'
  # 保留手动触发按钮，方便调试或初次运行
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create output directories
        run: |
          mkdir -p surge qx

      - name: Convert rules
        run: |
          convert_list() {
            local src="$1"
            local surge_out="$2"
            local qx_out="$3"

            [ ! -f "$src" ] && return 0

            > "$surge_out"
            > "$qx_out"

            while IFS= read -r line || [ -n "$line" ]; do
              # 清洗回车与首尾空格
              line="$(echo "$line" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

              # 保留空行及注释 (#, //, ;)
              if [[ -z "$line" || "$line" =~ ^(#|//|;) ]]; then
                echo "$line" >> "$surge_out"
                echo "$line" >> "$qx_out"
                continue
              fi

              # 去除行首的通配符前缀 (如 +.google.com 或 .google.com)
              line="$(echo "$line" | sed -E 's/^(\+\.|\.)//')"

              # 1. IPv4 (支持 1.1.1.1 或 1.1.1.1/24)
              if [[ "$line" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}(/[0-9]{1,2})?$ ]]; then
                if [[ ! "$line" =~ / ]]; then
                  target_ip="${line}/32"
                else
                  target_ip="$line"
                fi
                echo "IP-CIDR,$target_ip,no-resolve" >> "$surge_out"
                echo "IP-CIDR,$target_ip" >> "$qx_out"

              # 2. IPv6
              elif [[ "$line" =~ : ]]; then
                echo "IP-CIDR6,$line,no-resolve" >> "$surge_out"
                echo "IP6-CIDR,$line" >> "$qx_out"

              # 3. 裸域名：转为后缀匹配
              else
                echo "DOMAIN-SUFFIX,$line" >> "$surge_out"
                echo "HOST-SUFFIX,$line" >> "$qx_out"
              fi
            done < "$src"
          }

          convert_list "direct.txt" "surge/direct.list" "qx/direct.list"
          convert_list "proxy.txt"  "surge/proxy.list"  "qx/proxy.list"
          convert_list "ad.txt"     "surge/ad.list"     "qx/ad.list"

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add surge/ qx/
          # 检查是否有内容产生变化，仅在有变化时提交
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "Auto convert rules [skip ci]"
            git push origin master
          fi
