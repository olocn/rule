name: Convert sing-box json & Mihomo yaml

on:
  push:
    paths:
      - "qx/**"
      - ".github/workflows/convert-rules.yml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: convert-rules
  cancel-in-progress: false

jobs:

  convert:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # ============================================================
      # 2. Install dependencies
      # ============================================================

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            jq \
            curl


      # ============================================================
      # 3. Prepare directories
      # ============================================================

      - name: Prepare directories
        run: |
          set -euo pipefail

          mkdir -p qx
          mkdir -p singbox
          mkdir -p mihomo


      # ============================================================
      # 4. Convert QX Rules
      # ============================================================

      - name: Convert QX Rules
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "========================================"
          echo "QX → Sing-box JSON + Mihomo YAML"
          echo "========================================"

          shopt -s nullglob

          QX_FILES=(qx/*)


          if [ ${#QX_FILES[@]} -eq 0 ]; then

            echo "No files found in qx/."

            exit 0

          fi


          # ========================================================
          # 清理之前自动生成的文件
          # ========================================================

          rm -f singbox/*.srs
          rm -f singbox/*.json

          rm -f mihomo/*.mrs
          rm -f mihomo/*.yaml
          rm -f mihomo/*-keyword.list


          # ========================================================
          # 遍历 QX 文件
          # ========================================================

          for FILE in "${QX_FILES[@]}"; do

            if [ ! -f "$FILE" ]; then
              continue
            fi


            BASENAME="$(basename "$FILE")"

            NAME="${BASENAME%.*}"


            echo
            echo "----------------------------------------"
            echo "Processing: $FILE"
            echo "Output name: $NAME"
            echo "----------------------------------------"


            # ======================================================
            # 临时目录
            # ======================================================

            TMP="$(mktemp -d)"

            CLEAN_FILE="$TMP/clean.txt"

            DOMAIN_FILE="$TMP/domain.txt"

            SUFFIX_FILE="$TMP/suffix.txt"

            KEYWORD_FILE="$TMP/keyword.txt"

            IP_FILE="$TMP/ip.txt"


            touch \
              "$DOMAIN_FILE" \
              "$SUFFIX_FILE" \
              "$KEYWORD_FILE" \
              "$IP_FILE"


            # ======================================================
            # 清理 QX
            #
            # 删除：
            # - 空行
            # - #
            # - ;
            # ======================================================

            sed \
              -E \
              's/[#;].*$//' \
              "$FILE" |
            sed \
              -E \
              '/^[[:space:]]*$/d' |
            sed \
              -E \
              's/^[[:space:]]+//' |
            sed \
              -E \
              's/[[:space:]]+$//' \
              > "$CLEAN_FILE"


            # ======================================================
            # HOST
            # ======================================================

            awk -F',' '
              BEGIN {
                IGNORECASE=1
              }

              /^HOST,/ {

                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)

                if ($2 != "")
                  print $2

              }
            ' "$CLEAN_FILE" |
            sort -u \
              > "$DOMAIN_FILE"


            # ======================================================
            # HOST-SUFFIX
            # ======================================================

            awk -F',' '
              BEGIN {
                IGNORECASE=1
              }

              /^HOST-SUFFIX,/ {

                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)

                if ($2 != "")
                  print $2

              }
            ' "$CLEAN_FILE" |
            sort -u \
              > "$SUFFIX_FILE"


            # ======================================================
            # DOMAIN
            # ======================================================

            awk -F',' '
              BEGIN {
                IGNORECASE=1
              }

              /^DOMAIN,/ {

                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)

                if ($2 != "")
                  print $2

              }
            ' "$CLEAN_FILE" |
            sort -u \
              >> "$DOMAIN_FILE"


            # ======================================================
            # HOST-KEYWORD
            # ======================================================

            awk -F',' '
              BEGIN {
                IGNORECASE=1
              }

              /^HOST-KEYWORD,/ {

                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)

                if ($2 != "")
                  print $2

              }
            ' "$CLEAN_FILE" |
            sort -u |
            sed 's/^/DOMAIN-KEYWORD,/' \
              > "$KEYWORD_FILE"


            # ======================================================
            # IP-CIDR
            # IP-CIDR6
            # IP6-CIDR
            #
            # 内部统一保存纯 CIDR
            # ======================================================

            awk -F',' '
              BEGIN {
                IGNORECASE=1
              }

              /^IP-CIDR,/ {

                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)

                if ($2 != "")
                  print $2

              }

              /^IP-CIDR6,/ {

                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)

                if ($2 != "")
                  print $2

              }

              /^IP6-CIDR,/ {

                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)

                if ($2 != "")
                  print $2

              }

            ' "$CLEAN_FILE" |
            sort -u \
              > "$IP_FILE"


            # ======================================================
            # 再次去重
            # ======================================================

            sort -u \
              "$DOMAIN_FILE" \
              -o "$DOMAIN_FILE"

            sort -u \
              "$SUFFIX_FILE" \
              -o "$SUFFIX_FILE"

            sort -u \
              "$IP_FILE" \
              -o "$IP_FILE"


            # ======================================================
            # 统计
            # ======================================================

            DOMAIN_COUNT="$(
              grep -c . "$DOMAIN_FILE" || true
            )"

            SUFFIX_COUNT="$(
              grep -c . "$SUFFIX_FILE" || true
            )"

            KEYWORD_COUNT="$(
              grep -c . "$KEYWORD_FILE" || true
            )"

            IP_COUNT="$(
              grep -c . "$IP_FILE" || true
            )"


            TOTAL_DOMAIN=$((DOMAIN_COUNT + SUFFIX_COUNT))


            echo
            echo "Detected:"
            echo "  DOMAIN       : $DOMAIN_COUNT"
            echo "  HOST-SUFFIX  : $SUFFIX_COUNT"
            echo "  KEYWORD      : $KEYWORD_COUNT"
            echo "  IP-CIDR      : $IP_COUNT"


            # ======================================================
            # 5. 生成 Sing-box Source JSON
            #
            # 当前最新 Source Format：
            #
            # {
            #   "version": 5,
            #   "rules": [...]
            # }
            #
            # 不再编译 SRS
            # ======================================================

            SINGBOX_OUT="singbox/${NAME}.json"


            # ------------------------------------------------------
            # DOMAIN
            # ------------------------------------------------------

            jq -R -s '
              split("\n")
              | map(select(length > 0))
              | map({
                  domain: .
                })
            ' "$DOMAIN_FILE" \
              > "$TMP/domain.json"


            # ------------------------------------------------------
            # DOMAIN-SUFFIX
            # ------------------------------------------------------

            jq -R -s '
              split("\n")
              | map(select(length > 0))
              | map({
                  domain_suffix: .
                })
            ' "$SUFFIX_FILE" \
              > "$TMP/suffix.json"


            # ------------------------------------------------------
            # DOMAIN-KEYWORD
            # ------------------------------------------------------

            awk -F',' '
              /^DOMAIN-KEYWORD,/ {
                print $2
              }
            ' "$KEYWORD_FILE" |
            jq -R -s '
              split("\n")
              | map(select(length > 0))
              | map({
                  domain_keyword: .
                })
            ' \
              > "$TMP/keyword.json"


            # ------------------------------------------------------
            # IP-CIDR
            # ------------------------------------------------------

            jq -R -s '
              split("\n")
              | map(select(length > 0))
              | map({
                  ip_cidr: .
                })
            ' "$IP_FILE" \
              > "$TMP/ip.json"


            # ------------------------------------------------------
            # 组装 Sing-box Source Format
            # ------------------------------------------------------

            jq -n \
              --slurpfile domain "$TMP/domain.json" \
              --slurpfile suffix "$TMP/suffix.json" \
              --slurpfile keyword "$TMP/keyword.json" \
              --slurpfile ip "$TMP/ip.json" \
              '
              {
                version: 5,
                rules:
                  (
                    $domain[0]
                    +
                    $suffix[0]
                    +
                    $keyword[0]
                    +
                    $ip[0]
                  )
              }
              ' \
              > "$SINGBOX_OUT"


            # ======================================================
            # 6. 检查 Sing-box JSON
            # ======================================================

            echo
            echo "Sing-box JSON validation:"

            jq empty "$SINGBOX_OUT"


            SINGBOX_RULE_COUNT="$(
              jq '.rules | length' "$SINGBOX_OUT"
            )"


            echo
            echo "Sing-box rule count:"
            echo "$SINGBOX_RULE_COUNT"


            if [ "$SINGBOX_RULE_COUNT" -eq 0 ]; then

              echo
              echo "ERROR: Sing-box JSON contains no rules."

              exit 1

            fi


            echo
            echo "Sing-box output:"
            echo "  $SINGBOX_OUT"


            # ======================================================
            # 7. 生成 Mihomo YAML
            #
            # 格式：
            #
            # payload:
            #   - DOMAIN,example.com
            #   - DOMAIN-SUFFIX,example.org
            #   - DOMAIN-KEYWORD,google
            #   - IP-CIDR,1.2.3.0/24
            # ======================================================

            MIHOMO_OUT="mihomo/${NAME}.yaml"


            echo
            echo "Mihomo output: YAML"

            echo "Output:"
            echo "  $MIHOMO_OUT"


            {
              echo "payload:"


              # ----------------------------------------------------
              # DOMAIN
              # ----------------------------------------------------

              if [ -s "$DOMAIN_FILE" ]; then

                while IFS= read -r DOMAIN; do

                  [ -z "$DOMAIN" ] && continue

                  printf '  - DOMAIN,%s\n' "$DOMAIN"

                done < "$DOMAIN_FILE"

              fi


              # ----------------------------------------------------
              # DOMAIN-SUFFIX
              # ----------------------------------------------------

              if [ -s "$SUFFIX_FILE" ]; then

                while IFS= read -r DOMAIN; do

                  [ -z "$DOMAIN" ] && continue

                  printf '  - DOMAIN-SUFFIX,%s\n' "$DOMAIN"

                done < "$SUFFIX_FILE"

              fi


              # ----------------------------------------------------
              # DOMAIN-KEYWORD
              # ----------------------------------------------------

              if [ -s "$KEYWORD_FILE" ]; then

                while IFS= read -r RULE; do

                  [ -z "$RULE" ] && continue

                  KEYWORD="${RULE#DOMAIN-KEYWORD,}"

                  [ -z "$KEYWORD" ] && continue

                  printf '  - DOMAIN-KEYWORD,%s\n' "$KEYWORD"

                done < "$KEYWORD_FILE"

              fi


              # ----------------------------------------------------
              # IP-CIDR
              # ----------------------------------------------------

              if [ -s "$IP_FILE" ]; then

                while IFS= read -r CIDR; do

                  [ -z "$CIDR" ] && continue

                  printf '  - IP-CIDR,%s\n' "$CIDR"

                done < "$IP_FILE"

              fi

            } > "$MIHOMO_OUT"


            # ======================================================
            # 8. 检查 Mihomo YAML
            # ======================================================

            if [ ! -s "$MIHOMO_OUT" ]; then

              echo
              echo "ERROR: Empty Mihomo YAML."

              exit 1

            fi


            MIHOMO_RULE_COUNT="$(
              grep -c '^[[:space:]]*-[[:space:]]' \
              "$MIHOMO_OUT" || true
            )"


            echo
            echo "Mihomo rule count:"
            echo "$MIHOMO_RULE_COUNT"


            if [ "$MIHOMO_RULE_COUNT" -eq 0 ]; then

              echo
              echo "ERROR: Mihomo YAML contains no rules."

              exit 1

            fi


            echo
            echo "Mihomo YAML preview:"

            head -n 20 "$MIHOMO_OUT"


            # ======================================================
            # 9. 检查输出
            # ======================================================

            echo
            echo "Generated files:"

            find singbox mihomo \
              -maxdepth 1 \
              -type f \
              \( \
                -name "${NAME}.json" \
                -o \
                -name "${NAME}.yaml" \
              \) \
              -printf "  %p  %s bytes\n"


            # ======================================================
            # 10. 检查旧格式是否残留
            # ======================================================

            if [ -f "singbox/${NAME}.srs" ]; then

              echo
              echo "ERROR: Unexpected SRS file exists:"
              echo "singbox/${NAME}.srs"

              exit 1

            fi


            if [ -f "mihomo/${NAME}.mrs" ]; then

              echo
              echo "ERROR: Unexpected MRS file exists:"
              echo "mihomo/${NAME}.mrs"

              exit 1

            fi


            if [ -f "mihomo/${NAME}-cidr.mrs" ]; then

              echo
              echo "ERROR: Unexpected MRS file exists:"
              echo "mihomo/${NAME}-cidr.mrs"

              exit 1

            fi


            if [ -f "mihomo/${NAME}-keyword.list" ]; then

              echo
              echo "ERROR: Unexpected keyword list exists:"
              echo "mihomo/${NAME}-keyword.list"

              exit 1

            fi


            # ======================================================
            # 11. 删除临时目录
            # ======================================================

            rm -rf "$TMP"


          done


      # ============================================================
      # 12. 最终验证
      # ============================================================

      - name: Validate generated files
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "========================================"
          echo "Final validation"
          echo "========================================"


          # ========================================================
          # Sing-box JSON
          # ========================================================

          echo
          echo "Sing-box JSON:"

          find singbox \
            -maxdepth 1 \
            -type f \
            -name "*.json" \
            -exec ls -lh {} \;


          for FILE in singbox/*.json; do

            [ -f "$FILE" ] || continue

            echo
            echo "Validating:"
            echo "$FILE"

            jq empty "$FILE"

            VERSION="$(
              jq -r '.version' "$FILE"
            )"

            if [ "$VERSION" != "5" ]; then

              echo
              echo "ERROR: Invalid Sing-box rule-set version:"
              echo "$VERSION"

              exit 1

            fi

            RULE_COUNT="$(
              jq '.rules | length' "$FILE"
            )"

            if [ "$RULE_COUNT" -eq 0 ]; then

              echo
              echo "ERROR: Empty Sing-box rule-set:"
              echo "$FILE"

              exit 1

            fi

            echo "  version: $VERSION"
            echo "  rules  : $RULE_COUNT"

          done


          # ========================================================
          # Mihomo YAML
          # ========================================================

          echo
          echo "Mihomo YAML:"

          find mihomo \
            -maxdepth 1 \
            -type f \
            -name "*.yaml" \
            -exec ls -lh {} \;


          for FILE in mihomo/*.yaml; do

            [ -f "$FILE" ] || continue

            echo
            echo "Validating:"
            echo "$FILE"

            if ! grep -q '^payload:$' "$FILE"; then

              echo
              echo "ERROR: Mihomo YAML missing payload:"
              echo "$FILE"

              exit 1

            fi

            RULE_COUNT="$(
              grep -c '^[[:space:]]*-[[:space:]]' \
              "$FILE" || true
            )"

            if [ "$RULE_COUNT" -eq 0 ]; then

              echo
              echo "ERROR: Empty Mihomo YAML:"
              echo "$FILE"

              exit 1

            fi

            echo "  rules: $RULE_COUNT"

          done


          # ========================================================
          # 确保没有旧格式
          # ========================================================

          echo
          echo "Checking for old SRS files:"

          if find singbox \
              -maxdepth 1 \
              -type f \
              -name "*.srs" |
              grep -q .; then

            echo
            echo "ERROR: SRS files found."

            find singbox \
              -maxdepth 1 \
              -type f \
              -name "*.srs"

            exit 1

          fi


          echo "  OK"


          echo
          echo "Checking for old MRS files:"

          if find mihomo \
              -maxdepth 1 \
              -type f \
              -name "*.mrs" |
              grep -q .; then

            echo
            echo "ERROR: MRS files found."

            find mihomo \
              -maxdepth 1 \
              -type f \
              -name "*.mrs"

            exit 1

          fi


          echo "  OK"


          echo
          echo "Checking for old keyword list files:"

          if find mihomo \
              -maxdepth 1 \
              -type f \
              -name "*-keyword.list" |
              grep -q .; then

            echo
            echo "ERROR: Keyword list files found."

            find mihomo \
              -maxdepth 1 \
              -type f \
              -name "*-keyword.list"

            exit 1

          fi


          echo "  OK"


          echo
          echo "========================================"
          echo "Validation OK."
          echo "========================================"


      # ============================================================
      # 13. Git commit
      # ============================================================

      - name: Commit generated rules
        shell: bash
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            qx \
            singbox \
            mihomo


          if git diff --cached --quiet; then

            echo "No changes to commit."

            exit 0

          fi


          git commit \
            -m "auto: convert QX rules to sing-box JSON and Mihomo YAML"


      # ============================================================
      # 14. Push
      # ============================================================

      - name: Push changes
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin master

          git rebase origin/master

          git push \
            origin \
            HEAD:master
