name: Convert srs & mrs

on:
  schedule:
    # 每天北京时间 08:00（UTC 00:00）
    - cron: '0 0 * * *'

  push:
    paths:
      - 'qx/**'

  workflow_dispatch:

permissions:
  contents: write

# 防止定时任务和手动运行同时修改仓库
concurrency:
  group: convert-rules
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ============================================================
      # 2. 安装基础依赖
      # ============================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -y
          sudo apt-get install -y \
            jq \
            curl \
            wget \
            tar \
            gzip

      # ============================================================
      # 3. 安装最新版 Sing-box
      # ============================================================
      - name: Install latest Sing-box
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "获取最新版 Sing-box"
          echo "=========================================="

          RELEASE_JSON=$(curl -fsSL \
            https://api.github.com/repos/SagerNet/sing-box/releases/latest)

          SING_BOX_TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name')

          echo "Sing-box version: ${SING_BOX_TAG}"

          # 自动寻找 linux amd64 tar.gz
          SING_BOX_URL=$(echo "$RELEASE_JSON" | jq -r '
            .assets[]
            | select(
                (.name | test("linux-amd64\\.tar\\.gz$"))
              )
            | .browser_download_url
          ' | head -n 1)

          if [ -z "$SING_BOX_URL" ] || [ "$SING_BOX_URL" = "null" ]; then
            echo "错误：没有找到 Sing-box Linux amd64 安装包"

            echo "当前 Release Assets:"
            echo "$RELEASE_JSON" | jq -r '.assets[].name'

            exit 1
          fi

          echo "下载:"
          echo "$SING_BOX_URL"

          wget -q \
            "$SING_BOX_URL" \
            -O sing-box.tar.gz

          tar -xzf sing-box.tar.gz

          SING_BOX_BIN=$(find . \
            -type f \
            -name sing-box \
            | head -n 1)

          if [ -z "$SING_BOX_BIN" ]; then
            echo "错误：解压后没有找到 sing-box"
            exit 1
          fi

          sudo install \
            -m 755 \
            "$SING_BOX_BIN" \
            /usr/local/bin/sing-box

          rm -rf \
            sing-box.tar.gz \
            sing-box-*

          echo ""
          echo "Sing-box 安装完成:"
          sing-box version

      # ============================================================
      # 4. 安装最新版 Mihomo
      # ============================================================
      - name: Install latest Mihomo
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "获取最新版 Mihomo"
          echo "=========================================="

          RELEASE_JSON=$(curl -fsSL \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest)

          MIHOMO_TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name')

          echo "Mihomo version: ${MIHOMO_TAG}"

          # 自动寻找 Linux amd64 gzip
          MIHOMO_URL=$(echo "$RELEASE_JSON" | jq -r '
            .assets[]
            | select(
                (.name | test("linux-amd64.*\\.gz$"))
              )
            | .browser_download_url
          ' | head -n 1)

          if [ -z "$MIHOMO_URL" ] || [ "$MIHOMO_URL" = "null" ]; then
            echo "错误：没有找到 Mihomo Linux amd64 .gz"

            echo "当前 Release Assets:"
            echo "$RELEASE_JSON" | jq -r '.assets[].name'

            exit 1
          fi

          echo "下载:"
          echo "$MIHOMO_URL"

          wget -q \
            "$MIHOMO_URL" \
            -O mihomo.gz

          echo "解压 Mihomo..."

          gunzip -f mihomo.gz

          if [ ! -f mihomo ]; then
            echo "错误：解压后没有找到 mihomo"
            exit 1
          fi

          sudo install \
            -m 755 \
            mihomo \
            /usr/local/bin/mihomo

          rm -f mihomo

          echo ""
          echo "Mihomo 安装完成:"
          mihomo -v

      # ============================================================
      # 5. 转换 QX → SRS + MRS
      # ============================================================
      - name: Convert QX rules
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p singbox
          mkdir -p mihomo

          echo ""
          echo "=========================================="
          echo "开始转换 QX 规则"
          echo "=========================================="

          # ----------------------------------------------------------
          # 清理以前生成的文件
          #
          # 防止 qx/xxx.list 删除后，singbox/xxx.srs
          # 或 mihomo/xxx.mrs 仍然残留
          # ----------------------------------------------------------

          rm -f singbox/*.srs
          rm -f mihomo/*.mrs
          rm -f mihomo/*-keyword.list

          shopt -s nullglob

          files=(qx/*)

          if [ ${#files[@]} -eq 0 ]; then
            echo "错误：qx 目录为空"
            exit 1
          fi

          # ==========================================================
          # 遍历所有 QX 文件
          # ==========================================================

          for filepath in "${files[@]}"; do

            [ -f "$filepath" ] || continue

            filename=$(basename "$filepath")
            basename="${filename%.*}"

            echo ""
            echo "============================================================"
            echo "处理: $filepath"
            echo "============================================================"

            # --------------------------------------------------------
            # 清理规则
            #
            # 删除：
            # ; 注释
            # # 注释
            # 空行
            # 前后空格
            # --------------------------------------------------------

            sed \
              's/[;#].*//' \
              "$filepath" \
              | sed \
                  's/^[[:space:]]*//;s/[[:space:]]*$//' \
              | grep -v '^$' \
              > raw_rules.txt || true

            # --------------------------------------------------------
            # DOMAIN
            # --------------------------------------------------------

            grep -i '^HOST,' raw_rules.txt \
              | cut -d',' -f2 \
              | tr -d ' ' \
              | sed 's/\.$//' \
              | sort -u \
              > domain.txt || true

            # --------------------------------------------------------
            # DOMAIN-SUFFIX
            # --------------------------------------------------------

            grep -i '^HOST-SUFFIX,' raw_rules.txt \
              | cut -d',' -f2 \
              | tr -d ' ' \
              | sed 's/\.$//' \
              | sort -u \
              > suffix.txt || true

            # --------------------------------------------------------
            # DOMAIN-KEYWORD
            #
            # 单独保存
            # --------------------------------------------------------

            grep -i '^HOST-KEYWORD,' raw_rules.txt \
              | cut -d',' -f2 \
              | tr -d ' ' \
              | sort -u \
              > keyword.txt || true

            # --------------------------------------------------------
            # IP-CIDR / IP-CIDR6 / IP6-CIDR
            # --------------------------------------------------------

            grep -Ei \
              '^(IP-CIDR|IP-CIDR6|IP6-CIDR),' \
              raw_rules.txt \
              | cut -d',' -f2 \
              | tr -d ' ' \
              | sort -u \
              > ip.txt || true

            # ========================================================
            # 统计
            # ========================================================

            DOMAIN_COUNT=$(wc -l < domain.txt)
            SUFFIX_COUNT=$(wc -l < suffix.txt)
            KEYWORD_COUNT=$(wc -l < keyword.txt)
            IP_COUNT=$(wc -l < ip.txt)

            DOMAIN_TOTAL=$((DOMAIN_COUNT + SUFFIX_COUNT))

            echo ""
            echo "规则统计:"
            echo "  DOMAIN         : ${DOMAIN_COUNT}"
            echo "  DOMAIN-SUFFIX  : ${SUFFIX_COUNT}"
            echo "  DOMAIN-KEYWORD : ${KEYWORD_COUNT}"
            echo "  IP-CIDR        : ${IP_COUNT}"

            # ========================================================
            # A. Sing-box
            # ========================================================

            echo ""
            echo "生成 Sing-box SRS..."

            SUFFIX_JSON=$(
              jq -R . < suffix.txt | jq -s .
            )

            DOMAIN_JSON=$(
              jq -R . < domain.txt | jq -s .
            )

            KEYWORD_JSON=$(
              jq -R . < keyword.txt | jq -s .
            )

            IP_JSON=$(
              jq -R . < ip.txt | jq -s .
            )

            jq -n \
              --argjson suffix "$SUFFIX_JSON" \
              --argjson domain "$DOMAIN_JSON" \
              --argjson keyword "$KEYWORD_JSON" \
              --argjson ip "$IP_JSON" \
              '{
                "version": 2,
                "rules": [
                  (
                    {}
                    |
                    if ($domain | length) > 0
                    then .domain = $domain
                    else .
                    end
                    |
                    if ($suffix | length) > 0
                    then .domain_suffix = $suffix
                    else .
                    end
                    |
                    if ($keyword | length) > 0
                    then .domain_keyword = $keyword
                    else .
                    end
                    |
                    if ($ip | length) > 0
                    then .ip_cidr = $ip
                    else .
                    end
                  )
                ]
              }' \
              > "singbox/${basename}.json"

            sing-box rule-set compile \
              "singbox/${basename}.json" \
              -o "singbox/${basename}.srs"

            # 删除中间 JSON
            rm -f "singbox/${basename}.json"

            # ========================================================
            # B. Mihomo Domain MRS
            # ========================================================

            if [ "$DOMAIN_TOTAL" -gt 0 ]; then

              echo ""
              echo "生成 Mihomo Domain MRS..."

              {
                sed 's/^/DOMAIN,/' domain.txt
                sed 's/^/DOMAIN-SUFFIX,/' suffix.txt
              } \
              | sort -u \
              > mihomo-domain.txt

              mihomo convert-ruleset \
                domain \
                text \
                mihomo-domain.txt \
                "mihomo/${basename}.mrs"

            else

              echo "没有 DOMAIN / DOMAIN-SUFFIX"
              echo "跳过 mihomo/${basename}.mrs"

            fi

            # ========================================================
            # C. Mihomo IP-CIDR MRS
            # ========================================================

            if [ "$IP_COUNT" -gt 0 ]; then

              echo ""
              echo "生成 Mihomo IP-CIDR MRS..."

              sed 's/^/IP-CIDR,/' ip.txt \
                > mihomo-ip.txt

              mihomo convert-ruleset \
                ipcidr \
                text \
                mihomo-ip.txt \
                "mihomo/${basename}-cidr.mrs"

            else

              echo "没有 IP-CIDR"
              echo "跳过 ${basename}-cidr.mrs"

            fi

            # ========================================================
            # D. Mihomo DOMAIN-KEYWORD
            #
            # MRS 不支持 keyword，因此保留为普通 list
            # ========================================================

            if [ "$KEYWORD_COUNT" -gt 0 ]; then

              echo ""
              echo "提取 DOMAIN-KEYWORD..."

              sed 's/^/DOMAIN-KEYWORD,/' keyword.txt \
                > "mihomo/${basename}-keyword.list"

              echo "生成:"
              echo "mihomo/${basename}-keyword.list"

            else

              echo "没有 DOMAIN-KEYWORD"

            fi

            # ========================================================
            # E. 校验输出
            # ========================================================

            if [ "$DOMAIN_TOTAL" -gt 0 ]; then

              if [ ! -s "mihomo/${basename}.mrs" ]; then
                echo "错误：Domain MRS 生成失败"
                exit 1
              fi

            fi

            if [ "$IP_COUNT" -gt 0 ]; then

              if [ ! -s "mihomo/${basename}-cidr.mrs" ]; then
                echo "错误：CIDR MRS 生成失败"
                exit 1
              fi

            fi

            if [ ! -s "singbox/${basename}.srs" ]; then
              echo "错误：Sing-box SRS 生成失败"
              exit 1
            fi

            # ========================================================
            # F. 清理临时文件
            # ========================================================

            rm -f \
              raw_rules.txt \
              domain.txt \
              suffix.txt \
              keyword.txt \
              ip.txt \
              mihomo-domain.txt \
              mihomo-ip.txt

            echo ""
            echo "✓ ${basename} 转换完成"

          done

      # ============================================================
      # 6. 显示最终目录
      # ============================================================
      - name: Show generated rules
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "============================================================"
          echo "Sing-box SRS"
          echo "============================================================"

          find singbox \
            -maxdepth 1 \
            -type f \
            -name '*.srs' \
            -printf '%f  %s bytes\n' \
            | sort

          echo ""
          echo "============================================================"
          echo "Mihomo MRS"
          echo "============================================================"

          find mihomo \
            -maxdepth 1 \
            -type f \
            -printf '%f  %s bytes\n' \
            | sort

          echo ""
          echo "============================================================"
          echo "目录结构"
          echo "============================================================"

          tree -L 2 \
            singbox mihomo 2>/dev/null \
            || find singbox mihomo -maxdepth 2 -type f | sort

      # ============================================================
      # 7. Commit & Push
      # ============================================================
      - name: Commit and Push
        shell: bash
        run: |
          set -euo pipefail

          git config --local user.name \
            "github-actions[bot]"

          git config --local user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            singbox/ \
            mihomo/

          if git diff --staged --quiet; then

            echo "所有规则无变动，跳过推送。"

          else

            git commit \
              -m "Auto update rules [$(date +'%Y-%m-%d %H:%M')]"

            # 获取远程最新提交
            git fetch origin master

            # 如果远程有更新，则 rebase
            git rebase origin/master

            git push origin HEAD:master

          fi
