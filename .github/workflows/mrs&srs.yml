name: Convert srs & mrs
on:
  push:
    paths:
      - "qx/**"
      - ".github/workflows/convert-rules.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: convert-rules
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ============================================================
      # 2. 安装依赖
      # ============================================================
      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            jq \
            curl \
            wget \
            gzip \
            tar

      # ============================================================
      # 3. 创建目录
      # ============================================================
      - name: Prepare directories
        run: |
          set -euo pipefail

          mkdir -p qx
          mkdir -p singbox
          mkdir -p mihomo

      # ============================================================
      # 4. 安装最新版 Sing-box
      # ============================================================
      - name: Install latest sing-box
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Installing latest sing-box"
          echo "========================================"

          API="https://api.github.com/repos/SagerNet/sing-box/releases/latest"

          SINGBOX_URL="$(
            curl -fsSL "$API" |
            jq -r '
              .assets[]
              | select(.name | test("linux-amd64.*\\.tar\\.gz$"))
              | .browser_download_url
            ' |
            head -n 1
          )"

          if [ -z "${SINGBOX_URL:-}" ]; then
            echo "ERROR: Cannot find sing-box linux-amd64 asset"

            curl -fsSL "$API" |
              jq -r '.assets[].name'

            exit 1
          fi

          echo "Download:"
          echo "$SINGBOX_URL"

          wget -q --show-progress \
            "$SINGBOX_URL" \
            -O /tmp/sing-box.tar.gz

          mkdir -p /tmp/singbox

          tar -xzf /tmp/sing-box.tar.gz \
            -C /tmp/singbox

          SINGBOX_BIN="$(
            find /tmp/singbox \
              -type f \
              -name "sing-box" |
            head -n 1
          )"

          if [ -z "${SINGBOX_BIN:-}" ]; then
            echo "ERROR: sing-box binary not found"
            find /tmp/singbox -maxdepth 3 -type f
            exit 1
          fi

          sudo install -m 0755 \
            "$SINGBOX_BIN" \
            /usr/local/bin/sing-box

          echo "Sing-box version:"
          sing-box version

      # ============================================================
      # 5. 安装最新版 Mihomo
      #
      # 自动选择：
      #   amd64-v1
      #
      # 不直接写死版本号。
      # ============================================================
      - name: Install latest Mihomo
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Installing latest Mihomo"
          echo "========================================"

          API="https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"

          VERSION="$(
            curl -fsSL "$API" |
            jq -r '.tag_name'
          )"

          if [ -z "${VERSION:-}" ] || [ "$VERSION" = "null" ]; then
            echo "ERROR: Cannot determine Mihomo version"
            exit 1
          fi

          echo "Mihomo version: $VERSION"

          # --------------------------------------------------------
          # 优先使用 amd64-v1
          #
          # 官方命名类似：
          #
          # mihomo-linux-amd64-v1-v1.19.30.gz
          #
          # 这样兼容性最好。
          # --------------------------------------------------------
          MIHOMO_URL="$(
            curl -fsSL "$API" |
            jq -r '
              .assets[]
              | select(
                  .name
                  | test("^mihomo-linux-amd64-v1-.*\\.gz$")
                )
              | .browser_download_url
            ' |
            head -n 1
          )"

          # --------------------------------------------------------
          # 如果没有 v1，再尝试 compatible
          # --------------------------------------------------------
          if [ -z "${MIHOMO_URL:-}" ]; then
            echo "amd64-v1 asset not found, trying compatible..."

            MIHOMO_URL="$(
              curl -fsSL "$API" |
              jq -r '
                .assets[]
                | select(
                    .name
                    | test("^mihomo-linux-amd64-compatible-.*\\.gz$")
                  )
                | .browser_download_url
              ' |
              head -n 1
            )"
          fi

          # --------------------------------------------------------
          # 最后尝试普通 amd64
          # --------------------------------------------------------
          if [ -z "${MIHOMO_URL:-}" ]; then
            echo "compatible asset not found, trying generic amd64..."

            MIHOMO_URL="$(
              curl -fsSL "$API" |
              jq -r '
                .assets[]
                | select(
                    .name
                    | test("^mihomo-linux-amd64-[^v].*\\.gz$")
                  )
                | .browser_download_url
              ' |
              head -n 1
            )"
          fi

          # --------------------------------------------------------
          # 仍然没有找到 → 打印官方所有资产
          # --------------------------------------------------------
          if [ -z "${MIHOMO_URL:-}" ]; then
            echo "ERROR: Cannot find suitable Mihomo linux-amd64 asset."

            echo
            echo "Available assets:"
            curl -fsSL "$API" |
              jq -r '.assets[].name'

            exit 1
          fi

          echo "Download:"
          echo "$MIHOMO_URL"

          wget -q --show-progress \
            "$MIHOMO_URL" \
            -O /tmp/mihomo.gz

          gzip -dc \
            /tmp/mihomo.gz \
            > /tmp/mihomo

          chmod +x /tmp/mihomo

          sudo install -m 0755 \
            /tmp/mihomo \
            /usr/local/bin/mihomo

          echo
          echo "Mihomo version:"
          mihomo -v

      # ============================================================
      # 6. 转换 QX → Sing-box + Mihomo
      # ============================================================
      - name: Convert rules
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "========================================"
          echo "QX → Sing-box + Mihomo"
          echo "========================================"

          shopt -s nullglob

          QX_FILES=(qx/*)

          if [ ${#QX_FILES[@]} -eq 0 ]; then
            echo "No files found in qx/"
            exit 0
          fi

          # --------------------------------------------------------
          # 清理本次自动生成的文件
          # --------------------------------------------------------

          rm -f singbox/*.srs
          rm -f mihomo/*.mrs
          rm -f mihomo/*-keyword.list

          # ========================================================
          # 遍历 QX 文件
          # ========================================================
          for FILE in "${QX_FILES[@]}"; do

            if [ ! -f "$FILE" ]; then
              continue
            fi

            BASENAME="$(basename "$FILE")"
            NAME="${BASENAME%.*}"

            echo
            echo "----------------------------------------"
            echo "Processing: $FILE"
            echo "Output name: $NAME"
            echo "----------------------------------------"

            # ------------------------------------------------------
            # 临时目录
            # ------------------------------------------------------

            TMP="$(mktemp -d)"

            DOMAIN_FILE="$TMP/domain.txt"
            KEYWORD_FILE="$TMP/keyword.txt"
            IP_FILE="$TMP/ip.txt"

            touch \
              "$DOMAIN_FILE" \
              "$KEYWORD_FILE" \
              "$IP_FILE"

            # ======================================================
            # 1. 清理 QX 规则
            #
            # 去掉：
            # - 空行
            # - # 注释
            # - ; 注释
            # ======================================================

            CLEAN_FILE="$TMP/clean.txt"

            sed \
              -E \
              's/[#;].*$//' \
              "$FILE" |
            sed \
              -E \
              '/^[[:space:]]*$/d' |
            sed \
              -E \
              's/^[[:space:]]+//' |
            sed \
              -E \
              's/[[:space:]]+$//' \
              > "$CLEAN_FILE"

            # ======================================================
            # 2. HOST
            #
            # HOST,example.com
            #
            # → sing-box domain
            # → mihomo domain
            # ======================================================

            awk -F',' '
              BEGIN { IGNORECASE=1 }
              /^HOST,/ {
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)
                if ($2 != "")
                  print $2
              }
            ' "$CLEAN_FILE" >> "$DOMAIN_FILE"

            # ======================================================
            # 3. HOST-SUFFIX
            #
            # HOST-SUFFIX,example.com
            #
            # → sing-box domain_suffix
            # → mihomo domain
            # ======================================================

            awk -F',' '
              BEGIN { IGNORECASE=1 }
              /^HOST-SUFFIX,/ {
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)
                if ($2 != "")
                  print $2
              }
            ' "$CLEAN_FILE" >> "$DOMAIN_FILE"

            # ======================================================
            # 4. HOST-KEYWORD
            #
            # Mihomo MRS 不支持 keyword behavior，
            # 所以单独生成：
            #
            # mihomo/xxx-keyword.list
            #
            # 内容：
            # DOMAIN-KEYWORD,xxx
            # ======================================================

            awk -F',' '
              BEGIN { IGNORECASE=1 }
              /^HOST-KEYWORD,/ {
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)
                if ($2 != "")
                  print $2
              }
            ' "$CLEAN_FILE" |
            awk 'NF' |
            sort -u |
            sed 's/^/DOMAIN-KEYWORD,/' \
              > "$KEYWORD_FILE"

            # ======================================================
            # 5. IP-CIDR
            # 6. IP-CIDR6
            # 7. IP6-CIDR
            #
            # 注意：
            #
            # Mihomo ipcidr MRS 输入必须是：
            #
            # 203.205.254.0/23
            #
            # 不能是：
            #
            # IP-CIDR,203.205.254.0/23
            # ======================================================

            awk -F',' '
              BEGIN { IGNORECASE=1 }

              /^IP-CIDR,/ {
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)

                if ($2 != "")
                  print $2
              }

              /^IP-CIDR6,/ {
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)

                if ($2 != "")
                  print $2
              }

              /^IP6-CIDR,/ {
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)

                if ($2 != "")
                  print $2
              }
            ' "$CLEAN_FILE" |
            awk 'NF' |
            sort -u \
              > "$IP_FILE"

            # ======================================================
            # 8. 去重
            # ======================================================

            sort -u \
              "$DOMAIN_FILE" \
              -o "$DOMAIN_FILE"

            sort -u \
              "$IP_FILE" \
              -o "$IP_FILE"

            # ======================================================
            # 9. 统计
            # ======================================================

            DOMAIN_COUNT="$(
              grep -c . "$DOMAIN_FILE" || true
            )"

            KEYWORD_COUNT="$(
              grep -c . "$KEYWORD_FILE" || true
            )"

            IP_COUNT="$(
              grep -c . "$IP_FILE" || true
            )"

            echo
            echo "Detected:"
            echo "  Domain : $DOMAIN_COUNT"
            echo "  Keyword: $KEYWORD_COUNT"
            echo "  IP-CIDR: $IP_COUNT"

            # ======================================================
            # 10. 生成 Sing-box JSON
            # ======================================================

            SINGBOX_JSON="$TMP/singbox.json"

            jq -n \
              --argjson domains "$(
                jq -R -s '
                  split("\n")
                  | map(select(length > 0))
                  | map({
                      type: "domain",
                      domain: .
                    })
                ' "$DOMAIN_FILE"
              )" \
              --argjson keywords "$(
                jq -R -s '
                  split("\n")
                  | map(select(length > 0))
                  | map({
                      type: "domain_keyword",
                      domain_keyword: .
                    })
                ' <(
                  awk -F',' '
                    /^DOMAIN-KEYWORD,/ {
                      print $2
                    }
                  ' "$KEYWORD_FILE"
                )
              )" \
              --argjson ips "$(
                jq -R -s '
                  split("\n")
                  | map(select(length > 0))
                  | map({
                      type: "ip_cidr",
                      ip_cidr: .
                    })
                ' "$IP_FILE"
              )" \
              '
              (
                $domains
                +
                $keywords
                +
                $ips
              )
              ' \
              > "$SINGBOX_JSON"

            # ------------------------------------------------------
            # 注意：
            #
            # 上面的 domain 默认会统一成为 domain。
            #
            # 为了正确保留 HOST-SUFFIX / HOST，
            # 下面重新按 QX 类型构建 Sing-box。
            # ------------------------------------------------------

            DOMAIN_JSON="$TMP/domain.json"
            SUFFIX_JSON="$TMP/suffix.json"
            KEYWORD_JSON="$TMP/keyword.json"
            IP_JSON="$TMP/ip.json"

            awk -F',' '
              BEGIN { IGNORECASE=1 }
              /^HOST,/ {
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)
                if ($2 != "")
                  print $2
              }
            ' "$CLEAN_FILE" |
            jq -R -s '
              split("\n")
              | map(select(length > 0))
              | map({
                  type: "domain",
                  domain: .
                })
            ' > "$DOMAIN_JSON"

            awk -F',' '
              BEGIN { IGNORECASE=1 }
              /^HOST-SUFFIX,/ {
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)
                if ($2 != "")
                  print $2
              }
            ' "$CLEAN_FILE" |
            jq -R -s '
              split("\n")
              | map(select(length > 0))
              | map({
                  type: "domain_suffix",
                  domain_suffix: .
                })
            ' > "$SUFFIX_JSON"

            awk -F',' '
              /^DOMAIN-KEYWORD,/ {
                print $2
              }
            ' "$KEYWORD_FILE" |
            jq -R -s '
              split("\n")
              | map(select(length > 0))
              | map({
                  type: "domain_keyword",
                  domain_keyword: .
                })
            ' > "$KEYWORD_JSON"

            jq -R -s '
              split("\n")
              | map(select(length > 0))
              | map({
                  type: "ip_cidr",
                  ip_cidr: .
                })
            ' "$IP_FILE" \
              > "$IP_JSON"

            jq -n \
              --slurpfile domain "$DOMAIN_JSON" \
              --slurpfile suffix "$SUFFIX_JSON" \
              --slurpfile keyword "$KEYWORD_JSON" \
              --slurpfile ip "$IP_JSON" \
              '
              (
                $domain[0]
                +
                $suffix[0]
                +
                $keyword[0]
                +
                $ip[0]
              )
              ' \
              > "$SINGBOX_JSON"

            # ======================================================
            # 11. 编译 Sing-box MRS
            # ======================================================

            SINGBOX_OUT="singbox/${NAME}.srs"

            sing-box rule-set compile \
              "$SINGBOX_JSON" \
              -o "$SINGBOX_OUT"

            if [ ! -s "$SINGBOX_OUT" ]; then
              echo "ERROR: Sing-box output is empty:"
              echo "$SINGBOX_OUT"
              exit 1
            fi

            echo
            echo "Sing-box:"
            echo "  $SINGBOX_OUT"

            # ======================================================
            # 12. 生成 Mihomo MRS
            #
            # MRS 只有两种 behavior：
            #
            # domain
            # ipcidr
            #
            # 所以自动判断。
            # ======================================================

            # ------------------------------------------------------
            # 只有 DOMAIN
            # ------------------------------------------------------

            if [ "$DOMAIN_COUNT" -gt 0 ] && [ "$IP_COUNT" -eq 0 ]; then

              MIHOMO_OUT="mihomo/${NAME}.mrs"

              echo
              echo "Mihomo type: domain"
              echo "Output: $MIHOMO_OUT"

              mihomo convert-ruleset \
                domain \
                text \
                "$DOMAIN_FILE" \
                "$MIHOMO_OUT"

            # ------------------------------------------------------
            # 只有 IP-CIDR
            # ------------------------------------------------------

            elif [ "$DOMAIN_COUNT" -eq 0 ] && [ "$IP_COUNT" -gt 0 ]; then

              MIHOMO_OUT="mihomo/${NAME}.mrs"

              echo
              echo "Mihomo type: ipcidr"
              echo "Output: $MIHOMO_OUT"

              # 关键：
              # 这里直接传原始 CIDR
              #
              # 不能再 sed 成：
              # IP-CIDR,xxx
              #

              mihomo convert-ruleset \
                ipcidr \
                text \
                "$IP_FILE" \
                "$MIHOMO_OUT"

            # ------------------------------------------------------
            # DOMAIN + IP 混合
            #
            # 一个 MRS 不能同时作为 domain/ipcidr。
            #
            # 自动拆成：
            #
            # xxx.mrs
            # xxx-cidr.mrs
            # ------------------------------------------------------

            elif [ "$DOMAIN_COUNT" -gt 0 ] && [ "$IP_COUNT" -gt 0 ]; then

              MIHOMO_DOMAIN_OUT="mihomo/${NAME}.mrs"
              MIHOMO_IP_OUT="mihomo/${NAME}-cidr.mrs"

              echo
              echo "Mihomo type: mixed"
              echo "Domain output: $MIHOMO_DOMAIN_OUT"
              echo "IP output    : $MIHOMO_IP_OUT"

              mihomo convert-ruleset \
                domain \
                text \
                "$DOMAIN_FILE" \
                "$MIHOMO_DOMAIN_OUT"

              mihomo convert-ruleset \
                ipcidr \
                text \
                "$IP_FILE" \
                "$MIHOMO_IP_OUT"

            else

              echo
              echo "No DOMAIN/IP rules detected."

            fi

            # ======================================================
            # 13. 输出 HOST-KEYWORD
            # ======================================================

            if [ "$KEYWORD_COUNT" -gt 0 ]; then

              KEYWORD_OUT="mihomo/${NAME}-keyword.list"

              cp \
                "$KEYWORD_FILE" \
                "$KEYWORD_OUT"

              echo
              echo "Mihomo keyword:"
              echo "  $KEYWORD_OUT"

            fi

            # ======================================================
            # 14. 检查生成文件
            # ======================================================

            echo
            echo "Generated files:"

            find singbox mihomo \
              -maxdepth 1 \
              -type f \
              \( \
                -name "${NAME}*.srs" \
                -o \
                -name "${NAME}*.mrs" \
                -o \
                -name "${NAME}*-keyword.list" \
              \) \
              -printf "  %p  %s bytes\n"

            # ------------------------------------------------------
            # 清理临时目录
            # ------------------------------------------------------

            rm -rf "$TMP"

          done

      # ============================================================
      # 7. 最终检查
      # ============================================================
      - name: Validate generated files
        run: |
          set -euo pipefail

          echo
          echo "========================================"
          echo "Validation"
          echo "========================================"

          echo
          echo "Sing-box files:"
          find singbox \
            -maxdepth 1 \
            -type f \
            -name "*.srs" \
            -print \
            -exec ls -lh {} \;

          echo
          echo "Mihomo files:"
          find mihomo \
            -maxdepth 1 \
            -type f \
            \( \
              -name "*.mrs" \
              -o \
              -name "*-keyword.list" \
            \) \
            -print \
            -exec ls -lh {} \;

          # --------------------------------------------------------
          # 检查是否存在空 MRS
          # --------------------------------------------------------

          if find mihomo \
              -maxdepth 1 \
              -type f \
              -name "*.mrs" \
              -size 0 \
              | grep -q .; then

            echo
            echo "ERROR: Empty Mihomo MRS detected:"
            find mihomo \
              -maxdepth 1 \
              -type f \
              -name "*.mrs" \
              -size 0

            exit 1
          fi

          # --------------------------------------------------------
          # 检查是否存在空 Sing-box SRS
          # --------------------------------------------------------

          if find singbox \
              -maxdepth 1 \
              -type f \
              -name "*.srs" \
              -size 0 \
              | grep -q .; then

            echo
            echo "ERROR: Empty Sing-box SRS detected:"
            find singbox \
              -maxdepth 1 \
              -type f \
              -name "*.srs" \
              -size 0

            exit 1
          fi

          echo
          echo "Validation OK."

      # ============================================================
      # 8. Git 提交
      # ============================================================
      - name: Commit generated rules
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add qx singbox mihomo

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "auto: convert QX rules to sing-box and Mihomo"

      # ============================================================
      # 9. Push
      # ============================================================
      - name: Push changes
        run: |
          set -euo pipefail

          git fetch origin master

          git rebase origin/master

          git push origin HEAD:master
