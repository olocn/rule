name: Convert srs & mrs

on:
  push:
    paths:
      - "qx/**"
      - ".github/workflows/convert-rules.yml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: convert-rules
  cancel-in-progress: false

jobs:

  convert:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # ============================================================
      # 2. Install dependencies
      # ============================================================

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            jq \
            curl \
            wget \
            gzip \
            tar


      # ============================================================
      # 3. Prepare directories
      # ============================================================

      - name: Prepare directories
        run: |
          set -euo pipefail

          mkdir -p qx
          mkdir -p singbox
          mkdir -p mihomo


      # ============================================================
      # 4. Install latest Sing-box
      # ============================================================

      - name: Install latest Sing-box
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Installing latest Sing-box"
          echo "========================================"

          API="https://api.github.com/repos/SagerNet/sing-box/releases/latest"

          SINGBOX_URL="$(
            curl -fsSL "$API" |
            jq -r '
              .assets[]
              | select(
                  .name
                  | test("linux-amd64.*\\.tar\\.gz$")
                )
              | .browser_download_url
            ' |
            head -n 1
          )"

          if [ -z "${SINGBOX_URL:-}" ]; then

            echo "ERROR: Cannot find Sing-box linux-amd64 asset."

            echo
            echo "Available assets:"

            curl -fsSL "$API" |
              jq -r '.assets[].name'

            exit 1

          fi

          echo "Download:"
          echo "$SINGBOX_URL"

          wget -q --show-progress \
            "$SINGBOX_URL" \
            -O /tmp/sing-box.tar.gz

          rm -rf /tmp/singbox

          mkdir -p /tmp/singbox

          tar -xzf \
            /tmp/sing-box.tar.gz \
            -C /tmp/singbox

          SINGBOX_BIN="$(
            find /tmp/singbox \
              -type f \
              -name "sing-box" |
            head -n 1
          )"

          if [ -z "${SINGBOX_BIN:-}" ]; then

            echo "ERROR: sing-box binary not found."

            find /tmp/singbox \
              -maxdepth 3 \
              -type f

            exit 1

          fi

          sudo install \
            -m 0755 \
            "$SINGBOX_BIN" \
            /usr/local/bin/sing-box

          echo
          echo "Sing-box version:"

          sing-box version


      # ============================================================
      # 5. Install latest Mihomo
      # ============================================================

      - name: Install latest Mihomo
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Installing latest Mihomo"
          echo "========================================"

          API="https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"

          VERSION="$(
            curl -fsSL "$API" |
            jq -r '.tag_name'
          )"

          if [ -z "${VERSION:-}" ] || [ "$VERSION" = "null" ]; then

            echo "ERROR: Cannot determine Mihomo version."

            exit 1

          fi

          echo "Mihomo version: $VERSION"


          # ----------------------------------------------------------
          # 优先 amd64-v1
          # ----------------------------------------------------------

          MIHOMO_URL="$(
            curl -fsSL "$API" |
            jq -r '
              .assets[]
              | select(
                  .name
                  | test("^mihomo-linux-amd64-v1-.*\\.gz$")
                )
              | .browser_download_url
            ' |
            head -n 1
          )"


          # ----------------------------------------------------------
          # 第二选择 compatible
          # ----------------------------------------------------------

          if [ -z "${MIHOMO_URL:-}" ]; then

            echo "amd64-v1 asset not found."

            echo "Trying compatible..."

            MIHOMO_URL="$(
              curl -fsSL "$API" |
              jq -r '
                .assets[]
                | select(
                    .name
                    | test("^mihomo-linux-amd64-compatible-.*\\.gz$")
                  )
                | .browser_download_url
              ' |
              head -n 1
            )"

          fi


          # ----------------------------------------------------------
          # 第三选择普通 amd64
          # ----------------------------------------------------------

          if [ -z "${MIHOMO_URL:-}" ]; then

            echo "compatible asset not found."

            echo "Trying generic amd64..."

            MIHOMO_URL="$(
              curl -fsSL "$API" |
              jq -r '
                .assets[]
                | select(
                    .name
                    | test("^mihomo-linux-amd64-.*\\.gz$")
                  )
                | .browser_download_url
              ' |
              head -n 1
            )"

          fi


          # ----------------------------------------------------------
          # 最终仍找不到
          # ----------------------------------------------------------

          if [ -z "${MIHOMO_URL:-}" ]; then

            echo
            echo "ERROR: Cannot find suitable Mihomo asset."

            echo
            echo "Available assets:"

            curl -fsSL "$API" |
              jq -r '.assets[].name'

            exit 1

          fi


          echo
          echo "Download:"
          echo "$MIHOMO_URL"


          wget -q --show-progress \
            "$MIHOMO_URL" \
            -O /tmp/mihomo.gz


          gzip -dc \
            /tmp/mihomo.gz \
            > /tmp/mihomo


          chmod +x /tmp/mihomo


          sudo install \
            -m 0755 \
            /tmp/mihomo \
            /usr/local/bin/mihomo


          echo
          echo "Mihomo version:"

          mihomo -v


      # ============================================================
      # 6. Convert QX rules
      # ============================================================

      - name: Convert QX Rules
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "========================================"
          echo "QX → Sing-box + Mihomo"
          echo "========================================"

          shopt -s nullglob

          QX_FILES=(qx/*)


          if [ ${#QX_FILES[@]} -eq 0 ]; then

            echo "No files found in qx/."

            exit 0

          fi


          # ========================================================
          # 清理之前自动生成的文件
          # ========================================================

          rm -f singbox/*.srs
          rm -f mihomo/*.mrs
          rm -f mihomo/*-keyword.list


          # ========================================================
          # 遍历 QX 文件
          # ========================================================

          for FILE in "${QX_FILES[@]}"; do

            if [ ! -f "$FILE" ]; then
              continue
            fi


            BASENAME="$(basename "$FILE")"

            NAME="${BASENAME%.*}"


            echo
            echo "----------------------------------------"
            echo "Processing: $FILE"
            echo "Output name: $NAME"
            echo "----------------------------------------"


            # ======================================================
            # 临时目录
            # ======================================================

            TMP="$(mktemp -d)"


            CLEAN_FILE="$TMP/clean.txt"

            DOMAIN_FILE="$TMP/domain.txt"

            SUFFIX_FILE="$TMP/suffix.txt"

            KEYWORD_FILE="$TMP/keyword.txt"

            IP_FILE="$TMP/ip.txt"


            touch \
              "$DOMAIN_FILE" \
              "$SUFFIX_FILE" \
              "$KEYWORD_FILE" \
              "$IP_FILE"


            # ======================================================
            # 清理 QX
            #
            # 删除：
            # - 空行
            # - #
            # - ;
            # ======================================================

            sed \
              -E \
              's/[#;].*$//' \
              "$FILE" |
            sed \
              -E \
              '/^[[:space:]]*$/d' |
            sed \
              -E \
              's/^[[:space:]]+//' |
            sed \
              -E \
              's/[[:space:]]+$//' \
              > "$CLEAN_FILE"


            # ======================================================
            # HOST
            # ======================================================

            awk -F',' '
              BEGIN {
                IGNORECASE=1
              }

              /^HOST,/ {

                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)

                if ($2 != "")
                  print $2

              }
            ' "$CLEAN_FILE" |
            sort -u \
              > "$DOMAIN_FILE"


            # ======================================================
            # HOST-SUFFIX
            # ======================================================

            awk -F',' '
              BEGIN {
                IGNORECASE=1
              }

              /^HOST-SUFFIX,/ {

                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)

                if ($2 != "")
                  print $2

              }
            ' "$CLEAN_FILE" |
            sort -u \
              > "$SUFFIX_FILE"


            # ======================================================
            # DOMAIN
            #
            # 如果 QX 里面本身存在 DOMAIN，也兼容。
            # ======================================================

            awk -F',' '
              BEGIN {
                IGNORECASE=1
              }

              /^DOMAIN,/ {

                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)

                if ($2 != "")
                  print $2

              }
            ' "$CLEAN_FILE" |
            sort -u \
              >> "$DOMAIN_FILE"


            # ======================================================
            # HOST-KEYWORD
            # ======================================================

            awk -F',' '
              BEGIN {
                IGNORECASE=1
              }

              /^HOST-KEYWORD,/ {

                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)

                if ($2 != "")
                  print $2

              }
            ' "$CLEAN_FILE" |
            sort -u |
            sed 's/^/DOMAIN-KEYWORD,/' \
              > "$KEYWORD_FILE"


            # ======================================================
            # IP-CIDR
            # IP-CIDR6
            # IP6-CIDR
            #
            # 注意：
            #
            # Mihomo 输入：
            #
            # 203.205.254.0/23
            #
            # 而不是：
            #
            # IP-CIDR,203.205.254.0/23
            # ======================================================

            awk -F',' '
              BEGIN {
                IGNORECASE=1
              }

              /^IP-CIDR,/ {

                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)

                if ($2 != "")
                  print $2

              }

              /^IP-CIDR6,/ {

                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)

                if ($2 != "")
                  print $2

              }

              /^IP6-CIDR,/ {

                gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)

                if ($2 != "")
                  print $2

              }

            ' "$CLEAN_FILE" |
            sort -u \
              > "$IP_FILE"


            # ======================================================
            # 再次去重
            # ======================================================

            sort -u \
              "$DOMAIN_FILE" \
              -o "$DOMAIN_FILE"

            sort -u \
              "$SUFFIX_FILE" \
              -o "$SUFFIX_FILE"

            sort -u \
              "$IP_FILE" \
              -o "$IP_FILE"


            # ======================================================
            # 统计
            # ======================================================

            DOMAIN_COUNT="$(
              grep -c . "$DOMAIN_FILE" || true
            )"

            SUFFIX_COUNT="$(
              grep -c . "$SUFFIX_FILE" || true
            )"

            KEYWORD_COUNT="$(
              grep -c . "$KEYWORD_FILE" || true
            )"

            IP_COUNT="$(
              grep -c . "$IP_FILE" || true
            )"


            TOTAL_DOMAIN=$((DOMAIN_COUNT + SUFFIX_COUNT))


            echo
            echo "Detected:"
            echo "  DOMAIN       : $DOMAIN_COUNT"
            echo "  HOST-SUFFIX  : $SUFFIX_COUNT"
            echo "  KEYWORD      : $KEYWORD_COUNT"
            echo "  IP-CIDR      : $IP_COUNT"


            # ======================================================
            # 7. 生成 Sing-box source JSON
            #
            # 重要：
            #
            # 必须：
            #
            # {
            #   "version": 5,
            #   "rules": [...]
            # }
            #
            # 不能直接输出 [...]
            # ======================================================

            SINGBOX_JSON="$TMP/singbox.json"


            # ------------------------------------------------------
            # DOMAIN
            # ------------------------------------------------------

            jq -R -s '
              split("\n")
              | map(select(length > 0))
              | map({
                  domain: .
                })
            ' "$DOMAIN_FILE" \
              > "$TMP/domain.json"


            # ------------------------------------------------------
            # DOMAIN-SUFFIX
            # ------------------------------------------------------

            jq -R -s '
              split("\n")
              | map(select(length > 0))
              | map({
                  domain_suffix: .
                })
            ' "$SUFFIX_FILE" \
              > "$TMP/suffix.json"


            # ------------------------------------------------------
            # DOMAIN-KEYWORD
            # ------------------------------------------------------

            awk -F',' '
              /^DOMAIN-KEYWORD,/ {
                print $2
              }
            ' "$KEYWORD_FILE" |
            jq -R -s '
              split("\n")
              | map(select(length > 0))
              | map({
                  domain_keyword: .
                })
            ' \
              > "$TMP/keyword.json"


            # ------------------------------------------------------
            # IP-CIDR
            # ------------------------------------------------------

            jq -R -s '
              split("\n")
              | map(select(length > 0))
              | map({
                  ip_cidr: .
                })
            ' "$IP_FILE" \
              > "$TMP/ip.json"


            # ------------------------------------------------------
            # 组装最终 Sing-box source format
            # ------------------------------------------------------

            jq -n \
              --slurpfile domain "$TMP/domain.json" \
              --slurpfile suffix "$TMP/suffix.json" \
              --slurpfile keyword "$TMP/keyword.json" \
              --slurpfile ip "$TMP/ip.json" \
              '
              {
                version: 5,
                rules:
                  (
                    $domain[0]
                    +
                    $suffix[0]
                    +
                    $keyword[0]
                    +
                    $ip[0]
                  )
              }
              ' \
              > "$SINGBOX_JSON"


            # ======================================================
            # 8. 检查 Sing-box JSON
            # ======================================================

            echo
            echo "Sing-box source JSON:"

            jq empty "$SINGBOX_JSON"


            echo
            echo "Sing-box rule count:"

            jq '.rules | length' "$SINGBOX_JSON"


            # ======================================================
            # 9. 编译 Sing-box SRS
            # ======================================================

            SINGBOX_OUT="singbox/${NAME}.srs"


            sing-box rule-set compile \
              "$SINGBOX_JSON" \
              -o "$SINGBOX_OUT"


            if [ ! -s "$SINGBOX_OUT" ]; then

              echo
              echo "ERROR: Sing-box output is empty:"

              echo "$SINGBOX_OUT"

              exit 1

            fi


            echo
            echo "Sing-box output:"
            echo "  $SINGBOX_OUT"


            # ======================================================
            # 10. Mihomo MRS
            #
            # 自动判断：
            #
            # DOMAIN only
            # IP only
            # DOMAIN + IP
            # ======================================================


            # ======================================================
            # 只有 DOMAIN
            # ======================================================

            if [ "$TOTAL_DOMAIN" -gt 0 ] &&
               [ "$IP_COUNT" -eq 0 ]; then


              MIHOMO_OUT="mihomo/${NAME}.mrs"


              echo
              echo "Mihomo behavior: domain"

              echo "Output:"
              echo "  $MIHOMO_OUT"


              # ----------------------------------------------
              # Mihomo domain 输入
              #
              # HOST / DOMAIN / HOST-SUFFIX
              # 全部转换成 domain behavior
              # ----------------------------------------------

              cat \
                "$DOMAIN_FILE" \
                "$SUFFIX_FILE" |
              sort -u \
                > "$TMP/mihomo-domain.txt"


              mihomo convert-ruleset \
                domain \
                text \
                "$TMP/mihomo-domain.txt" \
                "$MIHOMO_OUT"


            # ======================================================
            # 只有 IP
            # ======================================================

            elif [ "$TOTAL_DOMAIN" -eq 0 ] &&
                 [ "$IP_COUNT" -gt 0 ]; then


              MIHOMO_OUT="mihomo/${NAME}.mrs"


              echo
              echo "Mihomo behavior: ipcidr"

              echo "Output:"
              echo "  $MIHOMO_OUT"


              # ----------------------------------------------
              # 关键：
              #
              # 这里必须直接传：
              #
              # 203.205.254.0/23
              #
              # 不能增加：
              #
              # IP-CIDR,
              # ----------------------------------------------

              mihomo convert-ruleset \
                ipcidr \
                text \
                "$IP_FILE" \
                "$MIHOMO_OUT"


            # ======================================================
            # DOMAIN + IP 混合
            # ======================================================

            elif [ "$TOTAL_DOMAIN" -gt 0 ] &&
                 [ "$IP_COUNT" -gt 0 ]; then


              MIHOMO_DOMAIN_OUT="mihomo/${NAME}.mrs"

              MIHOMO_IP_OUT="mihomo/${NAME}-cidr.mrs"


              echo
              echo "Mihomo behavior: mixed"

              echo "Domain:"
              echo "  $MIHOMO_DOMAIN_OUT"

              echo "IP-CIDR:"
              echo "  $MIHOMO_IP_OUT"


              # ----------------------------------------------
              # Domain
              # ----------------------------------------------

              cat \
                "$DOMAIN_FILE" \
                "$SUFFIX_FILE" |
              sort -u \
                > "$TMP/mihomo-domain.txt"


              mihomo convert-ruleset \
                domain \
                text \
                "$TMP/mihomo-domain.txt" \
                "$MIHOMO_DOMAIN_OUT"


              # ----------------------------------------------
              # IP
              # ----------------------------------------------

              mihomo convert-ruleset \
                ipcidr \
                text \
                "$IP_FILE" \
                "$MIHOMO_IP_OUT"


            else

              echo
              echo "No DOMAIN or IP-CIDR rules detected."

            fi


            # ======================================================
            # 11. HOST-KEYWORD
            # ======================================================

            if [ "$KEYWORD_COUNT" -gt 0 ]; then


              KEYWORD_OUT="mihomo/${NAME}-keyword.list"


              cp \
                "$KEYWORD_FILE" \
                "$KEYWORD_OUT"


              echo
              echo "Mihomo keyword:"
              echo "  $KEYWORD_OUT"


            fi


            # ======================================================
            # 12. 检查输出
            # ======================================================

            echo
            echo "Generated files:"


            find singbox mihomo \
              -maxdepth 1 \
              -type f \
              \( \
                -name "${NAME}*.srs" \
                -o \
                -name "${NAME}*.mrs" \
                -o \
                -name "${NAME}*-keyword.list" \
              \) \
              -printf "  %p  %s bytes\n"


            # ======================================================
            # 13. 检查空文件
            # ======================================================

            if find mihomo \
                -maxdepth 1 \
                -type f \
                -name "${NAME}*.mrs" \
                -size 0 |
                grep -q .; then


              echo
              echo "ERROR: Empty Mihomo MRS detected."


              find mihomo \
                -maxdepth 1 \
                -type f \
                -name "${NAME}*.mrs" \
                -size 0


              exit 1

            fi


            if find singbox \
                -maxdepth 1 \
                -type f \
                -name "${NAME}.srs" \
                -size 0 |
                grep -q .; then


              echo
              echo "ERROR: Empty Sing-box SRS detected."


              exit 1

            fi


            # ======================================================
            # 14. 删除临时目录
            # ======================================================

            rm -rf "$TMP"


          done


      # ============================================================
      # 15. 最终验证
      # ============================================================

      - name: Validate generated files
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "========================================"
          echo "Final validation"
          echo "========================================"


          echo
          echo "Sing-box:"
          
          find singbox \
            -maxdepth 1 \
            -type f \
            -name "*.srs" \
            -exec ls -lh {} \;


          echo
          echo "Mihomo:"

          find mihomo \
            -maxdepth 1 \
            -type f \
            \( \
              -name "*.mrs" \
              -o \
              -name "*-keyword.list" \
            \) \
            -exec ls -lh {} \;


          echo
          echo "Validation OK."


      # ============================================================
      # 16. Git commit
      # ============================================================

      - name: Commit generated rules
        shell: bash
        run: |
          set -euo pipefail


          git config \
            user.name \
            "github-actions[bot]"


          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            qx \
            singbox \
            mihomo


          if git diff --cached --quiet; then

            echo "No changes to commit."

            exit 0

          fi


          git commit \
            -m "auto: convert QX rules to sing-box and Mihomo"


      # ============================================================
      # 17. Push
      # ============================================================

      - name: Push changes
        shell: bash
        run: |
          set -euo pipefail


          git fetch origin master


          git rebase origin/master


          git push \
            origin \
            HEAD:master
