name: Convert QX rules to Sing-box JSON & Mihomo YAML

on:
  push:
    paths:
      - 'qx/**'
      - '.github/workflows/convert-rules.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: convert-rules
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ==========================================================
      # 2. Install dependencies
      # ==========================================================
      - name: Install dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y jq

          echo "Dependencies installed."

      # ==========================================================
      # 3. Prepare directories
      # ==========================================================
      - name: Prepare directories
        shell: bash
        run: |
          set -e

          mkdir -p singbox
          mkdir -p mihomo

          # 删除旧格式文件
          rm -f singbox/*.srs
          rm -f mihomo/*.mrs

          # 删除旧的 keyword/list 文件
          rm -f mihomo/*-keyword.list

          echo "Directories prepared."

      # ==========================================================
      # 4. Convert QX rules
      # ==========================================================
      - name: Convert QX rules
        shell: bash
        run: |
          set -e

          shopt -s nullglob

          files=(qx/*.snippet)

          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: No .snippet files found in qx/"
            exit 1
          fi

          for file in "${files[@]}"; do

            base="$(basename "$file" .snippet)"

            echo ""
            echo "========================================"
            echo "Processing: $file"
            echo "Output name: $base"
            echo "========================================"

            # ======================================================
            # 排除 ASN 文件
            # ======================================================
            if [[ "$base" == asn-* ]]; then
              echo "Skipping ASN file: $file"
              continue
            fi

            tmp="$(mktemp -d)"

            domains="$tmp/domains.txt"
            suffix="$tmp/suffix.txt"
            keywords="$tmp/keywords.txt"
            ipv4="$tmp/ipv4.txt"
            ipv6="$tmp/ipv6.txt"

            # ======================================================
            # 清理 QX 文件
            #
            # 删除：
            #   # 注释
            #   ; 注释
            #   空白
            #
            # 同时过滤 ASN
            # ======================================================
            sed -E 's/[#;].*$//' "$file" \
              | sed -E 's/^[[:space:]]+|[[:space:]]+$//g' \
              | grep -v -i -E \
                '^(IP-ASN|ASN|IP-ASN6)(,|[[:space:]])' \
              | grep -v '^$' \
              > "$tmp/clean.txt" || true

            # ======================================================
            # 解析规则
            # ======================================================

            # HOST
            grep -i -E '^HOST,' "$tmp/clean.txt" \
              | sed -E 's/^[^,]+,//' \
              | sed -E 's/,.+$//' \
              >> "$domains" || true

            # DOMAIN
            grep -i -E '^DOMAIN,' "$tmp/clean.txt" \
              | sed -E 's/^[^,]+,//' \
              | sed -E 's/,.+$//' \
              >> "$domains" || true

            # HOST-SUFFIX
            grep -i -E '^HOST-SUFFIX,' "$tmp/clean.txt" \
              | sed -E 's/^[^,]+,//' \
              | sed -E 's/,.+$//' \
              >> "$suffix" || true

            # HOST-KEYWORD
            grep -i -E '^HOST-KEYWORD,' "$tmp/clean.txt" \
              | sed -E 's/^[^,]+,//' \
              | sed -E 's/,.+$//' \
              >> "$keywords" || true

            # IP-CIDR
            grep -i -E '^IP-CIDR,' "$tmp/clean.txt" \
              | sed -E 's/^[^,]+,//' \
              | sed -E 's/,.+$//' \
              >> "$ipv4" || true

            # IP-CIDR6
            grep -i -E '^IP-CIDR6,' "$tmp/clean.txt" \
              | sed -E 's/^[^,]+,//' \
              | sed -E 's/,.+$//' \
              >> "$ipv6" || true

            # IP6-CIDR
            grep -i -E '^IP6-CIDR,' "$tmp/clean.txt" \
              | sed -E 's/^[^,]+,//' \
              | sed -E 's/,.+$//' \
              >> "$ipv6" || true

            # ======================================================
            # 去重
            # ======================================================
            for f in "$domains" "$suffix" "$keywords" "$ipv4" "$ipv6"; do
              if [ -f "$f" ]; then
                sort -u "$f" -o "$f"
              fi
            done

            domain_count=$(wc -l < "$domains" 2>/dev/null || echo 0)
            suffix_count=$(wc -l < "$suffix" 2>/dev/null || echo 0)
            keyword_count=$(wc -l < "$keywords" 2>/dev/null || echo 0)
            ipv4_count=$(wc -l < "$ipv4" 2>/dev/null || echo 0)
            ipv6_count=$(wc -l < "$ipv6" 2>/dev/null || echo 0)

            total_count=$(
              (
                cat "$domains" 2>/dev/null || true
                cat "$suffix" 2>/dev/null || true
                cat "$keywords" 2>/dev/null || true
                cat "$ipv4" 2>/dev/null || true
                cat "$ipv6" 2>/dev/null || true
              ) | wc -l
            )

            echo ""
            echo "Detected:"
            echo "  DOMAIN       : $domain_count"
            echo "  HOST-SUFFIX  : $suffix_count"
            echo "  KEYWORD      : $keyword_count"
            echo "  IP-CIDR      : $ipv4_count"
            echo "  IP-CIDR6     : $ipv6_count"
            echo "  TOTAL        : $total_count"

            # ======================================================
            # 如果只有 ASN / 不存在可转换规则
            # ======================================================
            if [ "$total_count" -eq 0 ]; then
              echo ""
              echo "No convertible rules found."
              echo "Skipping: $file"
              rm -rf "$tmp"
              continue
            fi

            # ======================================================
            # 5. Generate Sing-box JSON
            #
            # Source Format v5
            # ======================================================
            singbox_file="singbox/${base}.json"

            jq -n \
              --argjson domains "$(
                jq -R -s '
                  split("\n")
                  | map(select(length > 0))
                ' "$domains"
              )" \
              --argjson suffix "$(
                jq -R -s '
                  split("\n")
                  | map(select(length > 0))
                ' "$suffix"
              )" \
              --argjson keywords "$(
                jq -R -s '
                  split("\n")
                  | map(select(length > 0))
                ' "$keywords"
              )" \
              --argjson ipv4 "$(
                jq -R -s '
                  split("\n")
                  | map(select(length > 0))
                ' "$ipv4"
              )" \
              --argjson ipv6 "$(
                jq -R -s '
                  split("\n")
                  | map(select(length > 0))
                ' "$ipv6"
              )" \
              '
              {
                version: 5,
                rules:
                  (
                    ($domains | map({domain: .})) +
                    ($suffix | map({domain_suffix: .})) +
                    ($keywords | map({domain_keyword: .})) +
                    ($ipv4 | map({ip_cidr: .})) +
                    ($ipv6 | map({ip_cidr: .}))
                  )
              }
              ' > "$singbox_file"

            # ======================================================
            # Sing-box JSON validation
            # ======================================================
            echo ""
            echo "Sing-box JSON validation:"

            jq empty "$singbox_file"

            version=$(jq -r '.version' "$singbox_file")
            rule_count=$(jq '.rules | length' "$singbox_file")

            echo "Sing-box version:"
            echo "$version"

            echo ""
            echo "Sing-box rule count:"
            echo "$rule_count"

            if [ "$version" != "5" ]; then
              echo "ERROR: Invalid Sing-box source format version."
              exit 1
            fi

            if [ "$rule_count" -eq 0 ]; then
              echo "ERROR: Sing-box JSON contains no rules."
              exit 1
            fi

            # ======================================================
            # 6. Generate Mihomo YAML
            #
            # Classical Rule Provider
            # ======================================================
            mihomo_file="mihomo/${base}.yaml"

            {
              echo "payload:"

              while IFS= read -r rule; do
                [ -n "$rule" ] || continue
                echo "  - DOMAIN,$rule"
              done < "$domains"

              while IFS= read -r rule; do
                [ -n "$rule" ] || continue
                echo "  - DOMAIN-SUFFIX,$rule"
              done < "$suffix"

              while IFS= read -r rule; do
                [ -n "$rule" ] || continue
                echo "  - DOMAIN-KEYWORD,$rule"
              done < "$keywords"

              while IFS= read -r rule; do
                [ -n "$rule" ] || continue
                echo "  - IP-CIDR,$rule"
              done < "$ipv4"

              while IFS= read -r rule; do
                [ -n "$rule" ] || continue
                echo "  - IP-CIDR6,$rule"
              done < "$ipv6"

            } > "$mihomo_file"

            # ======================================================
            # Mihomo YAML validation
            # ======================================================
            echo ""
            echo "Mihomo YAML validation:"

            if ! grep -q '^payload:$' "$mihomo_file"; then
              echo "ERROR: Mihomo YAML missing payload."
              exit 1
            fi

            mihomo_rule_count=$(
              grep -cE '^  - ' "$mihomo_file" || true
            )

            echo "Mihomo rule count:"
            echo "$mihomo_rule_count"

            if [ "$mihomo_rule_count" -eq 0 ]; then
              echo "ERROR: Mihomo YAML contains no rules."
              exit 1
            fi

            # ======================================================
            # Output information
            # ======================================================
            echo ""
            echo "Generated files:"
            echo "  $singbox_file  $(wc -c < "$singbox_file") bytes"
            echo "  $mihomo_file  $(wc -c < "$mihomo_file") bytes"

            rm -rf "$tmp"

          done

      # ==========================================================
      # 7. Final validation
      # ==========================================================
      - name: Final validation
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "Final validation"
          echo "========================================"

          shopt -s nullglob

          json_files=(singbox/*.json)
          yaml_files=(mihomo/*.yaml)

          echo ""
          echo "Sing-box JSON files: ${#json_files[@]}"
          echo "Mihomo YAML files:   ${#yaml_files[@]}"

          # ------------------------------------------------------
          # Sing-box
          # ------------------------------------------------------
          for file in "${json_files[@]}"; do

            echo ""
            echo "Checking: $file"

            jq empty "$file"

            version=$(jq -r '.version' "$file")
            count=$(jq '.rules | length' "$file")

            if [ "$version" != "5" ]; then
              echo "ERROR: $file has invalid version: $version"
              exit 1
            fi

            if [ "$count" -eq 0 ]; then
              echo "ERROR: $file contains no rules."
              exit 1
            fi

            echo "  version: $version"
            echo "  rules:   $count"

          done

          # ------------------------------------------------------
          # Mihomo
          # ------------------------------------------------------
          for file in "${yaml_files[@]}"; do

            echo ""
            echo "Checking: $file"

            if ! grep -q '^payload:$' "$file"; then
              echo "ERROR: $file missing payload."
              exit 1
            fi

            count=$(grep -cE '^  - ' "$file" || true)

            if [ "$count" -eq 0 ]; then
              echo "ERROR: $file contains no rules."
              exit 1
            fi

            echo "  rules: $count"

          done

          # ------------------------------------------------------
          # 确认旧格式不存在
          # ------------------------------------------------------
          if find singbox -type f -name '*.srs' | grep -q .; then
            echo "ERROR: Old .srs files still exist."
            exit 1
          fi

          if find mihomo -type f -name '*.mrs' | grep -q .; then
            echo "ERROR: Old .mrs files still exist."
            exit 1
          fi

          if find mihomo -type f -name '*-keyword.list' | grep -q .; then
            echo "ERROR: Old keyword files still exist."
            exit 1
          fi

          # ------------------------------------------------------
          # 确认没有 ASN 输出
          # ------------------------------------------------------
          if find singbox mihomo -type f \
            \( -iname '*asn*' -o -iname 'asn-*' \) \
            | grep -q .; then

            echo "ERROR: ASN output file detected."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "All validation passed."
          echo "========================================"

      # ==========================================================
      # 8. Commit & Push
      # ==========================================================
      - name: Commit and push
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add qx singbox mihomo

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "auto: convert QX rules to sing-box JSON and Mihomo YAML"

          git fetch origin master
          git rebase origin/master

          git push origin HEAD:master
