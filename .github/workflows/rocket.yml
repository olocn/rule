name: Convert QX Rules to Shadowrocket (Rocket)

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'qx/**'
      - 'qxb/**'
      - 'convert.py'
      - '.github/workflows/convert.yml'
  schedule:
    # 每天北京时间 08:00 自动运行
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持网页手动触发

jobs:
  build-and-convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Conversion Script
        run: |
          python convert.py

      - name: Commit and Push Changes to Rocket Directory
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add rocket/
          
          if git diff --staged --quiet; then
            echo "No changes in rules, skipping commit."
          else
            git commit -m "auto: update shadowrocket rules in /rocket [skip ci]"
            git push
          fi
